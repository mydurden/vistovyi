  function applyMergeDeleteChoice(action) {
    var list = Array.isArray(state.mergeDeletes) ? state.mergeDeletes : [];
    if (!list.length) return;
    var item = list[0];
    var ts = stampNow();
    if (!state.removedAt) state.removedAt = { people: {}, machines: {} };
    ensureCardStores();
    var aliveCard = item.kind === "machine" ? state.machineCards[item.id] : state.peopleCards[item.id];
    // ZS-137b: жива картка без pendingChoice (хибний/stale діалог) — будь-яка кнопка не архівує.
    // ZS-152: після thaw pendingChoice=true — keep-removed справді архівує; restore лишає живою.
    if (aliveCard && !aliveCard.archived && action === "restore") {
      if (item.kind === "machine") {
        delete state.removed.machines[item.id];
        if (state.removedAt.machines) delete state.removedAt.machines[item.id];
      } else {
        delete state.removed.people[item.id];
        if (state.removedAt.people) delete state.removedAt.people[item.id];
      }
      aliveCard.archived = false;
      aliveCard.archivedAt = null;
      if (item.entity) {
        var dayKeep = state.viewDay || todayISO();
        if (item.kind === "machine") {
          if (!(aliveCard.days && aliveCard.days[dayKeep])) upsertMachineCardDay(item.id, dayKeep, item.entity);
        } else if (!(aliveCard.days && aliveCard.days[dayKeep])) {
          upsertPersonCardDay(item.id, dayKeep, item.entity);
        }
        if (state.peopleCards[item.id]) {
          state.peopleCards[item.id].archived = false;
          state.peopleCards[item.id].archivedAt = null;
        }
        if (state.machineCards[item.id]) {
          state.machineCards[item.id].archived = false;
          state.machineCards[item.id].archivedAt = null;
        }
      }
      state.mergeDeletes = list.slice(1);
      projectCardsToLiveDay();
      captureBundle(state.reportKey);
      save();
      render();
      flushDriveAfterMergeChoices();
      return;
    }
    if (aliveCard && !aliveCard.archived && action === "keep-removed" && !item.pendingChoice) {
      if (item.kind === "machine") {
        delete state.removed.machines[item.id];
        if (state.removedAt.machines) delete state.removedAt.machines[item.id];
      } else {
        delete state.removed.people[item.id];
        if (state.removedAt.people) delete state.removedAt.people[item.id];
      }
      aliveCard.archived = false;
      aliveCard.archivedAt = null;
      state.mergeDeletes = list.slice(1);
      projectCardsToLiveDay();
      captureBundle(state.reportKey);
      save();
      render();
      flushDriveAfterMergeChoices();
      return;
    }
    if (action === "keep-removed") {
      if (item.kind === "machine") {
        if (!state.removedAt.machines) state.removedAt.machines = {};
        state.removed.machines[item.id] = true;
        state.removedAt.machines[item.id] = ts;
        if (state.machineCards[item.id]) {
          state.machineCards[item.id].archived = true;
          state.machineCards[item.id].archivedAt = ts;
        }
        if (state.report && Array.isArray(state.report.machines)) {
          state.report.machines = state.report.machines.filter(function (row) {
            return !(row && row.id === item.id);
          });
        }
        stripMachineFromDaysArchive(item.id);
        state.added.machines = (state.added.machines || []).filter(function (row) {
          return !(row && row.id === item.id);
        });
        delete state.edits.machines[item.id];
      } else {
        if (!state.removedAt.people) state.removedAt.people = {};
        state.removed.people[item.id] = true;
        state.removedAt.people[item.id] = ts;
        if (state.peopleCards[item.id]) {
          state.peopleCards[item.id].archived = true;
          state.peopleCards[item.id].archivedAt = ts;
        }
        removePersonFromUnitTree(viewUnit(), item.id);
        stripPersonFromDaysArchive(item.id);
        state.added.people = (state.added.people || []).filter(function (row) {
          return !(row && row.id === item.id);
        });
        delete state.edits.people[item.id];
        delete state.positions[item.id];
      }
    } else if (action === "restore") {
      if (item.kind === "machine") {
        delete state.removed.machines[item.id];
        if (state.removedAt.machines) delete state.removedAt.machines[item.id];
        if (state.machineCards[item.id]) {
          state.machineCards[item.id].archived = false;
          state.machineCards[item.id].archivedAt = null;
        }
        if (item.entity) {
          if (!state.report) state.report = sampleReportDocument();
          if (!Array.isArray(state.report.machines)) state.report.machines = [];
          var hasMachine = state.report.machines.some(function (row) { return row && row.id === item.id; });
          if (!hasMachine) state.report.machines.push(cloneData(item.entity));
          var dayM = state.viewDay || todayISO();
          if (!(state.machineCards[item.id] && state.machineCards[item.id].days && state.machineCards[item.id].days[dayM])) {
            upsertMachineCardDay(item.id, dayM, item.entity);
          }
          if (state.machineCards[item.id]) {
            state.machineCards[item.id].archived = false;
            state.machineCards[item.id].archivedAt = null;
          }
        }
      } else {
        delete state.removed.people[item.id];
        if (state.removedAt.people) delete state.removedAt.people[item.id];
        if (state.peopleCards[item.id]) {
          state.peopleCards[item.id].archived = false;
          state.peopleCards[item.id].archivedAt = null;
        }
        if (item.entity) {
          var root = viewUnit();
          if (root) {
            if (!Array.isArray(root.people)) root.people = [];
            var hasPerson = root.people.some(function (row) { return row && row.id === item.id; });
            if (!hasPerson) root.people.push(cloneData(item.entity));
          }
          var dayP = state.viewDay || todayISO();
          if (!(state.peopleCards[item.id] && state.peopleCards[item.id].days && state.peopleCards[item.id].days[dayP])) {
            upsertPersonCardDay(item.id, dayP, item.entity);
          }
          if (state.peopleCards[item.id]) {
            state.peopleCards[item.id].archived = false;
            state.peopleCards[item.id].archivedAt = null;
          }
        }
      }
    }
    state.mergeDeletes = list.slice(1);
    materializeOverlays();
    syncRemovedFlagsFromCards();
    projectCardsToLiveDay();
    captureBundle(state.reportKey);
    save();
    render();
    flushDriveAfterMergeChoices();
  }

  function removePersonFromUnitTree(root, personId) {
    if (!root || !personId) return false;
    var removed = false;
    if (Array.isArray(root.people)) {
      var next = root.people.filter(function (item) {
        if (item && item.id === personId) {
          removed = true;
          return false;
        }
        return true;
      });
      root.people = next;
    }
    (Array.isArray(root.children) ? root.children : []).forEach(function (child) {
      if (removePersonFromUnitTree(child, personId)) removed = true;
    });
    return removed;
  }

  function applyMergeDupeChoice(action) {
    var list = Array.isArray(state.mergeDupes) ? state.mergeDupes : [];
    if (!list.length) return;
    var dupe = list[0];
    if (action === "combine") {
      var keep = findPerson(dupe.keepId);
      var drop = findPerson(dupe.dropId);
      if (keep && drop) {
        var ts = stampNow();
        if (!keep.fieldsUpdatedAt) keep.fieldsUpdatedAt = {};
        PERSON_MERGE_FIELDS.forEach(function (field) {
          var keepVal = keep[field];
          var dropVal = drop[field];
          if ((keepVal == null || String(keepVal).trim() === "") && dropVal != null && String(dropVal).trim() !== "") {
            keep[field] = dropVal;
            keep.fieldsUpdatedAt[field] = ts;
          }
        });
        keep.name = joinPersonName(personNameParts(keep));
        keep.updatedAt = ts;
        if (!state.removedAt) state.removedAt = { people: {}, machines: {} };
        if (!state.removedAt.people) state.removedAt.people = {};
        state.removed.people[dupe.dropId] = true;
        state.removedAt.people[dupe.dropId] = ts;
        removePersonFromUnitTree(viewUnit(), dupe.dropId);
        state.added.people = (state.added.people || []).filter(function (item) {
          return !(item && item.id === dupe.dropId);
        });
        delete state.edits.people[dupe.dropId];
        delete state.positions[dupe.dropId];
      }
    }
    state.mergeDupes = list.slice(1);
    materializeOverlays();
    captureBundle(state.reportKey);
    save();
    render();
    flushDriveAfterMergeChoices();

  function remapUnitCodeLocal(oldCode, newCode) {
    var from = String(oldCode || "");
    var to = String(newCode || "");
    if (!from || !to || from === to) return;
    if (bundles[from]) {
      bundles[to] = bundles[from];
      delete bundles[from];
      if (bundles[to] && bundles[to].report) bundles[to].report.code = to;
    }
    if (state.unitReportStatus[from]) {
      state.unitReportStatus[to] = state.unitReportStatus[from];
      delete state.unitReportStatus[from];
    }
    if (state.driveUnitNames && state.driveUnitNames[from]) {
      rememberCanonUnitName(to, state.driveUnitNames[from]);
      delete state.driveUnitNames[from];
      delete state.driveUnitNames[String(from).toLowerCase()];
    }
    if (state.driveUnitFileLabel && state.driveUnitFileLabel[from]) {
      if (!state.driveUnitFileLabel || typeof state.driveUnitFileLabel !== "object") state.driveUnitFileLabel = {};
      state.driveUnitFileLabel[to] = state.driveUnitFileLabel[from];
      delete state.driveUnitFileLabel[from];
    }
    var unit = findUnitByCode(to) || findUnitByCode(from);
    if (unit && unit.name) rememberCanonUnitName(to, unit.name);
    if (String(state.openCode || "") === from) state.openCode = to;
    if (String(state.reportRoot || "") === from) state.reportRoot = to;
    if (String(state.reportKey || "") === from) {
      state.reportKey = to;
      if (state.report) state.report.code = to;
    }
  }

  function removeIssuedUnit(unitId) {
    var removed = null;
    state.units = state.units.filter(function (unit) {
      if (unit.id === unitId) {
        removed = unit;
        return false;
      }
      return true;
    });
    if (removed) {
      delete state.unitReportStatus[removed.code];
      delete bundles[removed.code];
    }
    return removed;
  }

  function confirmAccessChange() {
    var change = state.accessChange;
    if (!change || !canBranch()) return Promise.resolve();
    var unit = null;
    for (var i = 0; i < state.units.length; i++) {
      if (state.units[i].id === change.unitId) unit = state.units[i];
    }
    if (!unit) {
      closeAccessChange();
      return Promise.resolve();
    }
    if (String(unit.parent || "").toLowerCase() !== actorKey().toLowerCase()) {
      closeAccessChange();
      return Promise.resolve();
    }
    var folderId = folderIdFromLink(state.driveFolder);
    var token = driveToken || "";

    if (change.deletePending) {
      removeIssuedUnit(unit.id);
      state.accessChange = null;
      save();
      if (!token || !folderId) {
        render();
        return Promise.resolve();
      }
      return upsertOwnUnitFile(token, folderId).then(function () {
        state.driveNote = "Список нижчих оновлено.";
        render();
      }).catch(function () {
        state.driveNote = "Ланку прибрано локально; синхрон файлу не вдався.";
        render();
      });
    }

    var nextCode = String(change.newCode || "").trim();
    if (!nextCode || nextCode === unit.code) {
      change.note = change.newCode ? "" : "Спочатку натисніть «Змінити».";
      render();
      return Promise.resolve();
    }
    var oldCode = String(unit.code || "");
    unit.code = nextCode;
    remapUnitCodeLocal(oldCode, nextCode);
    state.accessChange = null;
    save();

    if (!token || !folderId) {
      render();
      return Promise.resolve();
    }
    return resealChildUnitFile(token, folderId, oldCode, nextCode).then(function (reseal) {
      return upsertOwnUnitFile(token, folderId).then(function () {
        return reseal;
      });
    }).then(function (reseal) {
      if (reseal && reseal.ok) state.driveNote = "Доступ змінено, файл підлеглого перезапечатано.";
      else state.driveNote = "Новий код збережено; файл підлеглого не перезапечатано.";
      render();
    }).catch(function () {
      state.driveNote = "Новий код збережено локально; синхрон не вдався.";
      render();
    });
  }

    var label = String(name || "").replace(/\s+/g, " ").trim().slice(0, 80);

    var map = machineDutyMap();
    var taken = Object.keys(map).some(function (key) {

    });
    if (taken) return;
    state.customMachineDuties.push({ id: "md" + Date.now().toString(36), label: label, plus: !!plus });

    state.machineStatusNameDraft = "";

  function addMachineType(name) {
    if (!canEditCatalogs()) return;
    var label = String(name || "").replace(/\s+/g, " ").trim().slice(0, 80);
    if (!label) return;
    if (label.toLowerCase() === "інше") return;
    var taken = typeCatalog().some(function (item) {

  function saveTypeEdit(id, rawName) {
    if (!canEditCatalogs() || !id || id === OTHER_TYPE.id) return;
    var label = String(rawName || "").replace(/\s+/g, " ").trim().slice(0, 80);
    if (!label || label.toLowerCase() === "інше") return;
    var taken = typeCatalog().some(function (item) {
      return item.id !== id && (item.name.toLowerCase() === label.toLowerCase() || item.one.toLowerCase() === label.toLowerCase());
    });
    if (taken) return;
    var base = null;
    for (var i = 0; i < TYPES.length; i++) {
      if (TYPES[i].id === id) base = TYPES[i];
    }
    if (base) {
      state.typeOverrides[id] = { name: label, one: label };
    } else {
      state.customTypes.forEach(function (item) {
        if (item.id === id) {
          item.name = label;
          item.one = label;
        }
      });
    }
    state.typeEdit = "";
    state.typeNameDraft = "";
    save();
    render();
  }

  function archivedPeople() {
    ensureCardStores();
    var list = [];
    var seen = {};
    Object.keys(state.peopleCards).forEach(function (id) {
      var card = state.peopleCards[id];
      if (!card || !card.archived) return;
      seen[id] = true;
      list.push(personItemFromCard(card, state.viewDay || latestCardDayKey(card)));
    });
    // Сумісність: якщо картки ще немає, але є removed-прапорець.
    function walk(node) {
      (node.people || []).forEach(function (item) {
        if (!item || !item.id || seen[item.id] || !state.removed.people[item.id]) return;
        seen[item.id] = true;
        list.push(item);
      });
      (node.children || []).forEach(walk);
    }
    walk(viewUnit());
    (state.added.people || []).forEach(function (item) {
      if (!item || !item.id || seen[item.id] || !state.removed.people[item.id]) return;
      list.push(item);
    });
    return list;

    var today = todayISO();
    for (i = 1; i <= daysInMonth; i++) {

      if (hasDaySnapshot(iso)) classes += " has-report";

    } else if (state.mergeDeletes && state.mergeDeletes.length) {
      var deleteOverlay = renderMergeDeleteOverlay();

  var justOpened = "";

  function motionOff() {
    if (document.documentElement.classList.contains("is-test")) return true;
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  function wrapReveal(node, key) {
    if (!node) return node;
    node.classList.add("reveal");
    var body = el("div", { className: "reveal-body" });
    while (node.firstChild) body.appendChild(node.firstChild);
    node.appendChild(body);
    if (key && key === justOpened) node.setAttribute("data-fresh", "1");
    return node;
  }

  function armReveals() {
    document.querySelectorAll(".reveal[data-fresh]").forEach(function (node) {
      node.removeAttribute("data-fresh");
      if (motionOff()) return;
      node.classList.add("is-collapsed");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { node.classList.remove("is-collapsed"); });
      });
    });
    justOpened = "";
  }

  function collapseThen(node, done) {
    if (!node || motionOff()) {
      done();
      return;
    }
    node.classList.add("is-collapsed");
    var finished = false;
    function finish(event) {
      if (finished) return;
      if (event && event.target !== node) return;
      finished = true;
      done();
    }
    node.addEventListener("transitionend", finish);
    setTimeout(function () { finish(); }, 280);
  }

  function isEntityCardOpenId(id) {
    var key = String(id || "");
    return key.indexOf("person:") === 0 || key.indexOf("machine:") === 0;
  }

  function openEntityCardId() {

  function closeOpenEntityCards() {
    var changed = false;
    Array.from(state.open).forEach(function (id) {
      if (!isEntityCardOpenId(id)) return;
      // ZS-139: закриття оверлея зберігає правки без окремої «Зберегти».
      if (state.editing === id) commitCard(id);
      state.open.delete(id);
      if (state.editing === id) discardEdits();
      changed = true;
    });
    return changed;
  }

  function toggle(id) {
    if (state.open.has(id)) {
      if (state.editing === id) commitCard(id);
      state.open.delete(id);
      if (state.editing === id) discardEdits();
      if (isEntityCardOpenId(id)) {
        render();
        return;
      }
      collapseThen(document.getElementById(panelDomId(id)), render);
      return;
    }
    if (isEntityCardOpenId(id)) {
      // Одна картка о/с/ОВТ за раз — у вікні поверх екрана (як нова картка).
      closeOpenEntityCards();
      state.draft = null;
      state.open.add(id);
      justOpened = id;
      render();
      return;
    }
    state.open.add(id);
    justOpened = id;
    pendingScroll = panelDomId(id);
    render();
  }

  function applyCode(raw) {
    var keepReportRoot = String(state.reportRoot || "").trim();
    var typed = String(raw || "").trim();
    var code = typed.toLowerCase();
    // Старі внутрішні коди верхівки → lead (ZS-118: 1rota більше не окремий режим).
    if (code === "sluzhba" || code === "1rota") code = "lead";
    state.codeDraft = typed;
    if (!code) {
      state.codeError = "Впишіть код.";
      render();
      return;
    }
    var scope = CODES[code];
    var unit = scope ? null : findUnitByCode(typed);
    var grant = scope || unit ? null : findAccessGrant(typed);
    if (!scope && !unit && !grant) {
      state.codeError = "Такого коду на цьому пристрої немає.";
      render();
      return;
    }
    state.activeGrant = null;
    if (grant) {
      state.scope = "grant";
      state.openCode = grant.code;
      state.holder = grant.forWhom || "";
      state.activeGrant = grant;
      if (grant.mode === "period") {
        var periodDay = todayISO();
        if (grant.toDay && periodDay > grant.toDay) periodDay = grant.toDay;
        if (grant.fromDay && periodDay < grant.fromDay) periodDay = grant.fromDay;
        state.viewDay = periodDay;
      }
    } else if (unit) {
      state.scope = "all";
      state.openCode = unit.code;
      state.holder = unit.name;
    } else {
      state.scope = scope;
      state.openCode = code;
      if (code === "lead") state.holder = "Служба";
      else state.holder = "";
    }
    activateReport(state.openCode);
    if (!grant && !unit && code !== "lead" && scope === "all") {
      state.holder = (state.report && state.report.name) || "";
    }
    // ZS-107: якщо відкриваємо відому unit поточного кореня — не збивати reportRoot на її код.
    if (state.scope === "all") {
      var opened = String(state.openCode || "").trim();
      if (
        unit &&
        keepReportRoot &&
        keepReportRoot.toLowerCase() !== opened.toLowerCase() &&
        subordinatesFor(keepReportRoot).some(function (row) {
          return row && String(row.code).toLowerCase() === opened.toLowerCase();
        })
      ) {
        state.reportRoot = keepReportRoot;
      } else {
        state.reportRoot = state.openCode;
      }
    }
    state.codeError = "";
    state.codeDraft = "";
    state.profile = false;
    state.profilePane = "";
    state.unitNameDraft = "";
    state.unitError = "";
    state.statusEdit = "";
    state.machineStatusEdit = "";
    state.statusNameDraft = "";
    state.machineStatusNameDraft = "";
    state.statusPlus = true;
    state.machineStatusPlus = true;
    state.statusListOpen = false;
    state.machineStatusListOpen = false;
    state.confirm = null;
    state.draft = null;
    state.changesOpen = false;
    discardEdits();
    state.open.clear();
    save();
    render();
  }

  function newId(prefix) {
    return prefix + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  }

  function findPerson(id) {
    var found = null;
    function walk(node) {
      (node.people || []).some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
      if (!found) (node.children || []).forEach(walk);
    }
    walk(viewUnit());
    if (!found) {
      state.added.people.some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
    }
    return found;
  }

  function findMachine(id) {
    var found = null;
    viewMachines().some(function (item) {
      if (item.id === id) found = item;
      return !!found;
    });
    if (!found) {
      state.added.machines.some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
    }
    return found;
  }

  function removalQuestion(kind, id) {
    if (kind === "duty") {
      var personDuty = dutyMap()[id];
      return "Видалити статус «" + (personDuty ? personDuty.label : "") + "»?";
    }
    if (kind === "machineDuty") {
      var gearDuty = machineDutyMap()[id];
      return "Видалити стан «" + (gearDuty ? gearDuty.label : "") + "»?";
    }
    if (kind === "type") {
      var typeItem = typeById(id);
      return "Видалити тип «" + (typeItem ? typeItem.name : "") + "»?";
    }
    if (kind === "person") {
      var personItem = findPerson(id);
      var who = personItem ? (personCallsign(personItem) || personName(personItem)) : "";
      return "В архів картку «" + who + "»?";
    }
    if (kind === "event") {
      var eventRow = findEvent(id);
      var label = eventRow ? (eventRow.time ? eventRow.time + " · " : "") + (eventRow.description || "подію") : "подію";
      return "Видалити «" + String(label).slice(0, 80) + "»?";
    }
    var machine = findMachine(id);
    var what = machine ? (machineName(machine) || machineBoard(machine)) : "";
    return "В архів машину «" + what + "»?";
  }

  function renderConfirmBox() {
    var box = el("div", { className: "confirm", attrs: { id: "confirm-ask", role: "dialog" } });
    var archive = state.confirm.kind === "person" || state.confirm.kind === "machine";
    box.append(el("p", { text: removalQuestion(state.confirm.kind, state.confirm.id) }));
    box.append(el("button", { className: "remove", text: archive ? "В архів" : "Видалити", attrs: { type: "button", "data-confirm-delete": "1" } }));
    box.append(el("button", { className: "remove", text: "Скасувати", attrs: { type: "button", "data-cancel-delete": "1" } }));
    return box;
  }

  function blankDraft(kind) {
    if (kind === "machine") {
      return {
        kind: "machine",
        id: "draft",
        name: "",
        type: "",
        board: "",
        unit: "",
        accounting: "official",
        duty: "in",
        mileage: null,
        hours: null,
        service: ""
      };
    }
    return {
      kind: "person",
      id: "draft",
      surname: "",
      givenName: "",
      patronymic: "",
      name: "",
      rank: "",
      callsign: "",
      unit: "",
      position: "",
      accounting: "official",
      duty: "in"
    };
  }

  function renderDraftOverlay() {
    var overlay = el("div", { className: "overlay", attrs: { id: "card-overlay", role: "dialog" } });
    var sheet = el("div", { className: "overlay-sheet" });
    sheet.append(el("div", { className: "pull-bar", attrs: { "aria-hidden": "true" } }));
    if (state.draft.kind === "machine") sheet.append(renderMachineCard(state.draft, true));
    else sheet.append(renderPersonCard(state.draft, true));
    overlay.append(sheet);
    return overlay;
  }

  // ZS-136: існуюча картка о/с або ОВТ — те саме вікно, що й нова (поверх екрана).
  function renderEntityCardOverlay() {
    var openId = openEntityCardId();
    if (!openId) return null;
    var body = null;
    if (openId.indexOf("machine:") === 0) {
      var machineId = openId.slice("machine:".length);
      var machine = findMachine(machineId) || addedMachine(machineId);
      if (machine) body = renderMachineCard(machine);
    } else {
      var personId = openId.slice("person:".length);
      var person = findPerson(personId) || addedPerson(personId);
      if (person) body = renderPersonCard(person);
    }
    if (!body) {
      state.open.delete(openId);
      return null;
    }
    var overlay = el("div", { className: "overlay", attrs: { id: "card-overlay", role: "dialog" } });
    var sheet = el("div", { className: "overlay-sheet" });
    sheet.append(el("div", { className: "pull-bar", attrs: { "aria-hidden": "true" } }));
    sheet.append(body);
    overlay.append(sheet);
    return overlay;
  }

  // ZS-139: чи є в чернетці хоч одне заповнене поле (порожнє закриття не створює картку).
  function draftHasContent(draft) {
    if (!draft) return false;
    if (draft.kind === "machine") {
      if (String(draft.name || "").trim()) return true;
      if (String(draft.type || "").trim()) return true;
      if (String(draft.board || "").trim()) return true;
      if (String(draft.unit || "").trim()) return true;
      if (String(draft.service || "").trim()) return true;
      if (draft.mileage != null && draft.mileage !== "") return true;
      if (draft.hours != null && draft.hours !== "") return true;
      return false;
    }
    if (String(draft.surname || "").trim()) return true;
    if (String(draft.givenName || "").trim()) return true;
    if (String(draft.patronymic || "").trim()) return true;
    if (String(draft.name || "").trim()) return true;
    if (String(draft.rank || "").trim()) return true;
    if (String(draft.callsign || "").trim()) return true;
    if (String(draft.unit || "").trim()) return true;
    if (String(draft.position || "").trim()) return true;
    return false;
  }

  function closeCardOverlay() {
    if (state.draft) {
      syncDraftFromDom();
      // Автозбереження: заповнену чернетку пишемо без кнопки «Зберегти»; порожню — відкидаємо.
      if (draftHasContent(state.draft)) {
        saveDraft();
        return;
      }
      discardDraft();
      return;
    }
    if (closeOpenEntityCards()) {
      state.confirm = null;
      render();
    }
  }

  function openDraft(kind) {
    if (!canDelete()) return;
    if (state.draft && state.draft.kind === kind) return;
    state.confirm = null;
    closeOpenEntityCards();
    state.draft = blankDraft(kind);
    render();
  }

  function placeFromUnit(value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    var lower = raw.toLowerCase();
    var found = "";
    function walk(node, trail) {
      var next = trail.concat([node]);
      var path = next.map(function (item) { return item.name; }).join(" · ");
      if (node.people && (node.name === raw || path === raw || node.name.toLowerCase() === lower || path.toLowerCase() === lower)) found = node.id;
      (node.children || []).forEach(function (child) { walk(child, next); });
    }
    walk(viewUnit(), []);
    return found;
  }

  function defaultPersonPlace() {
    var root = viewUnit();
    if (root.people) return root.id;
    var found = "";
    function walk(node) {
      if (found) return;
      if (node.people) found = node.id;
      (node.children || []).forEach(walk);
    }
    walk(root);
    return found || root.id;
  }

  function typeFromLabel(value) {
    var raw = String(value || "").trim();
    if (!raw) return OTHER_TYPE.id;
    var lower = raw.toLowerCase();
    if (raw === OTHER_TYPE.name || raw === OTHER_TYPE.one || lower === "інше") return OTHER_TYPE.id;
    var list = typeCatalog();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === raw) return list[i].id;
      if (list[i].one === raw || list[i].name === raw || list[i].one.toLowerCase() === lower || list[i].name.toLowerCase() === lower) return list[i].id;
    }
    return OTHER_TYPE.id;
  }

  function resolveMachineTypeId(raw) {
    var value = String(raw == null ? "" : raw).trim();
    if (!value) return OTHER_TYPE.id;
    return typeFromLabel(value);
  }

  function addedPerson(id) {
    for (var i = 0; i < state.added.people.length; i++) {
      if (state.added.people[i].id === id) return state.added.people[i];
    }
    return null;
  }

  function addedMachine(id) {
    for (var i = 0; i < state.added.machines.length; i++) {
      if (state.added.machines[i].id === id) return state.added.machines[i];
    }
    return null;
  }

  function openUnitPath(placeId) {
    var path = findNode(viewUnit(), placeId, []);
    if (!path) return;
    path.forEach(function (node) {
      if (node.id !== viewUnit().id) state.open.add("unit:" + node.id);
    });
  }

  function applyDraftField(node) {
    if (!state.draft || !node || !node.getAttribute) return false;
    var field = node.getAttribute("data-draft-field");
    if (!field) return false;
    if (field === "mileage" || field === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) state.draft[field] = null;
      else {
        var num = parseInt(trimmed, 10);
        state.draft[field] = isNaN(num) ? null : num;
      }
    } else {
      state.draft[field] = String(rawControl(node) || "").slice(0, 80);
    }
    return true;
  }

  function syncDraftFromDom() {
    var root = document.getElementById("card-overlay");
    if (!root || !state.draft) return;
    root.querySelectorAll("[data-draft-field]").forEach(applyDraftField);
  }

  function saveDraft() {
    if (!canDelete() || !state.draft) return;
    syncDraftFromDom();
    var draft = state.draft;
    if (draft.kind === "person") {
      var place = placeFromUnit(draft.unit) || defaultPersonPlace();
      var personId = newId("np");
      var draftParts = {
        surname: draft.surname || "",
        givenName: draft.givenName || "",
        patronymic: draft.patronymic || ""
      };
      if (!draftParts.surname && !draftParts.givenName && !draftParts.patronymic && draft.name) {
        draftParts = splitLegacyName(draft.name);
      }
      state.added.people.push({
        id: personId,
        surname: draftParts.surname,
        givenName: draftParts.givenName,
        patronymic: draftParts.patronymic,
        name: joinPersonName(draftParts),
        rank: draft.rank || "",
        callsign: draft.callsign || "",
        unit: String(draft.unit || "").slice(0, 80),
        accounting: draft.accounting || "official",
        duty: draft.duty || "in",
        position: draft.position || "",
        place: place
      });
      state.positions[personId] = draft.position || "";
      openUnitPath(place);
    } else {
      var typeId = resolveMachineTypeId(draft.type);
      var machineId = newId("nm");
      state.added.machines.push({
        id: machineId,
        type: typeId,
        name: draft.name || "",
        board: draft.board || "",
        accounting: draft.accounting || "official",
        duty: draft.duty || "in",
        mileage: draft.mileage == null ? null : draft.mileage,
        hours: draft.hours == null ? null : draft.hours,
        service: draft.service || ""
      });
      state.open.add("type:" + typeId);
    }
    state.draft = null;
    state.confirm = null;
    // Картка вже в реєстрі; overlays лишаємо до зміни дня / bake (як раніше в UI).
    syncLiveOverlaysIntoCards();
    save();
    render();
  }

  function discardEdits() {
    state.editing = null;
    state.pending = null;
    state.editBaseline = null;
  }

  function captureEditBaseline(kind, id) {
    var fields = kind === "machine"
      ? ["name", "type", "board", "unit", "duty", "accounting", "mileage", "hours", "service"]
      : ["surname", "givenName", "patronymic", "rank", "unit", "callsign", "position", "duty", "accounting"];
    var base = {};
    fields.forEach(function (fieldName) {
      base[fieldName] = currentFieldValue(kind, id, fieldName);
    });
    return base;
  }

  // ZS-139: під час вводу одразу пишемо поле в модель + локальний кеш (без повного render).
  function liveAutosaveEditNode(node) {
    if (!node || !node.getAttribute || !state.editing) return false;
    var kind = node.getAttribute("data-edit-kind");
    var id = node.getAttribute("data-edit-id");
    var fieldName = node.getAttribute("data-edit-field");
    if (!kind && node.getAttribute("data-position-for")) {
      kind = "person";
      id = node.getAttribute("data-position-for");
      fieldName = "position";
    }
    if (!kind || !id || !fieldName) return false;
    if (state.editing !== kind + ":" + id) return false;
    rememberPending(node);
    if (fieldName === "position" && node.getAttribute("data-position-for")) {
      state.positions[id] = String(node.value || "").slice(0, 80);
    } else {
      applyFieldEdit(node);
    }
    syncLiveOverlaysIntoCards();
    save();
    return true;
  }

  function discardDraft() {
    state.draft = null;
    state.confirm = null;
    discardEdits();
    render();
  }

  var FIELD_LABEL = {
    name: "ПІП",
    surname: "Прізвище",
    givenName: "Ім’я",
    patronymic: "По батькові",
    rank: "Звання",
    unit: "Підрозділ",
    callsign: "Позивний",
    position: "Посада",
    type: "Тип",
    board: "Борт",
    duty: "Стан",
    accounting: "Облік",
    mileage: "Пробіг",
    hours: "Мотогодини",
    service: "Останнє ТО"
  };

  function canJournal() {
    return state.scope === "all" && !!state.holder;
  }

  function plainValue(value) {
    if (value == null || value === "") return "немає";
    return String(value);
  }

  function sameValue(before, after) {
    return plainValue(before) === plainValue(after);
  }

  function currentFieldValue(kind, id, fieldName) {
    if (kind === "person") {
      var personItem = findPerson(id);
      if (!personItem) return "";
      if (fieldName === "name") return personName(personItem);
      if (fieldName === "surname" || fieldName === "givenName" || fieldName === "patronymic") {
        return personNamePart(personItem, fieldName);
      }
      if (fieldName === "rank") return personRank(personItem);
      if (fieldName === "unit") return personUnit(personItem);
      if (fieldName === "callsign") return personCallsign(personItem);
      if (fieldName === "position") return positionOf(personItem);
      if (fieldName === "duty") {
        var personDuty = dutyMap()[personDutyKey(personItem)];
        return personDuty ? personDuty.label : "";
      }
      if (fieldName === "accounting") {
        var personAccount = ACCOUNTING[personAccountingKey(personItem)];
        return personAccount ? personAccount.label : "";
      }
      return "";
    }
    var machine = findMachine(id);
    if (!machine) return "";
    if (fieldName === "name") return machineName(machine);
    if (fieldName === "type") return machineTypeLabel(machine);
    if (fieldName === "board") return machineBoard(machine);
    if (fieldName === "unit") return machineUnit(machine);
    if (fieldName === "duty") {
      var duty = machineDutyMap()[machineDutyKey(machine)];
      return duty ? duty.label : "";
    }
    if (fieldName === "accounting") {
      var account = ACCOUNTING[machineAccountingKey(machine)];
      return account ? account.label : "";
    }
    if (fieldName === "mileage") return machineMileage(machine);
    if (fieldName === "hours") return machineHours(machine);
    if (fieldName === "service") return machineService(machine) || "";
    return "";
  }

  function controlValue(node) {
    var fieldName = node.getAttribute("data-edit-field") || node.getAttribute("data-position-for") && "position";
    if (fieldName === "mileage" || fieldName === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) return null;
      var num = parseInt(trimmed, 10);
      return isNaN(num) ? null : num;
    }
    if (node.classList && node.classList.contains("pick")) {
      var shown = node.querySelector(".pick-current");
      return shown ? String(shown.textContent || "") : "";
    }
    if (node.tagName === "SELECT") {
      var option = node.options[node.selectedIndex];
      return option ? option.text : String(node.value || "");
    }
    return String(node.value || "").slice(0, 80);
  }

  function rawControl(node) {
    if (node && node.classList && node.classList.contains("pick")) return node.getAttribute("data-value") || "";
    return node && node.value != null ? node.value : "";
  }

  function noteChange(fieldName, before, after) {
    if (!canJournal() || sameValue(before, after)) return;
    var label = FIELD_LABEL[fieldName] || fieldName;
    state.changes.push({
      who: state.holder,
      field: label,
      before: plainValue(before).slice(0, 80),
      after: plainValue(after).slice(0, 80)
    });
    if (state.changes.length > 100) state.changes = state.changes.slice(-100);
  }

  function commitCard(spec) {
    var parts = String(spec || "").split(":");
    var kind = parts[0];
    var id = parts.slice(1).join(":");
    var root = document.getElementById(panelDomId(kind + ":" + id));
    var baseline = state.editBaseline || {};
    if (root) {
      root.querySelectorAll("[data-edit-kind]").forEach(function (node) {
        var fieldName = node.getAttribute("data-edit-field");
        var before = Object.prototype.hasOwnProperty.call(baseline, fieldName)
          ? baseline[fieldName]
          : currentFieldValue(kind, id, fieldName);
        noteChange(fieldName, before, controlValue(node));
        applyFieldEdit(node);
      });
      var post = root.querySelector("[data-position-for]");
      if (post) {
        var beforePost = Object.prototype.hasOwnProperty.call(baseline, "position")
          ? baseline.position
          : currentFieldValue("person", id, "position");
        noteChange("position", beforePost, controlValue(post));
        state.positions[post.getAttribute("data-position-for")] = String(post.value || "").slice(0, 80);
      }
    }
    discardEdits();
    syncLiveOverlaysIntoCards();
    save();
    render();
  }

  function renderChanges() {
    if (state.scope !== "all") return null;
    if (!state.changes.length) return null;
    var section = el("section", { className: "block", attrs: { id: "changes", "aria-labelledby": "changes-title" } });
    var btn = el("button", {
      className: "changes-open",
      attrs: {
        type: "button",
        id: "changes-title",
        "data-open-changes": "1",
        "aria-label": "Що змінено, відкрити журнал"
      }
    });
    btn.append(el("span", { text: "Що змінено" }));
    btn.append(el("span", { className: "meta", text: String(state.changes.length) }));
    section.append(btn);
    return section;
  }

  function renderChangesOverlay() {
    var overlay = el("div", { className: "overlay", attrs: { id: "changes-overlay", role: "dialog", "aria-label": "Що змінено" } });
    var sheet = el("div", { className: "overlay-sheet is-compact" });
    sheet.append(el("div", { className: "pull-bar", attrs: { "aria-hidden": "true" } }));
    var head = el("div", { className: "card-head" });
    head.append(el("h2", { text: "Що змінено" }));
    head.append(iconButton("x", "Закрити", { "data-close-changes": "1" }));
    sheet.append(head);
    var list = el("ul", { className: "change-list" });
    state.changes.forEach(function (item) {
      list.append(el("li", { text: item.who + ". " + item.field + ". Було: " + item.before + ". Стало: " + item.after + "." }));
    });
    sheet.append(list);
    overlay.append(sheet);
    return overlay;
  }

  function rememberPending(node) {
    if (!node || !node.getAttribute) return false;
    var kind = node.getAttribute("data-edit-kind");
    var id = node.getAttribute("data-edit-id");
    var fieldName = node.getAttribute("data-edit-field");
    if (!kind && node.getAttribute("data-position-for")) {
      kind = "person";
      id = node.getAttribute("data-position-for");
      fieldName = "position";
    }
    if (!kind || !id || !fieldName) return false;
    if (state.editing !== kind + ":" + id) return false;
    if (!state.pending || state.pending.key !== state.editing) state.pending = { key: state.editing, fields: {} };
    state.pending.fields[fieldName] = rawControl(node);
    return true;
  }

  function saveDutyEdit(machine, id, rawName, plus) {
    if (!canEditCatalogs() || !id) return;
    var label = String(rawName || "").replace(/\s+/g, " ").trim().slice(0, 80);
    if (!label) return;
    var map = machine ? machineDutyMap() : dutyMap();
    var taken = Object.keys(map).some(function (key) {
      return key !== id && map[key].label.toLowerCase() === label.toLowerCase();
    });
    if (taken) return;
    var base = machine ? MACHINE_DUTY : DUTY;
    var custom = machine ? state.customMachineDuties : state.customDuties;
    if (base[id]) {
      var overrides = machine ? state.machineDutyOverrides : state.dutyOverrides;
      overrides[id] = { label: label, plus: !!plus };
    } else {
      custom.forEach(function (item) {
        if (item.id === id) {
          item.label = label;
          item.plus = !!plus;
        }
      });
    }
    if (machine) {
      state.machineStatusEdit = "";
      state.machineStatusNameDraft = "";
      state.machineStatusPlus = true;
    } else {
      state.statusEdit = "";
      state.statusNameDraft = "";
      state.statusPlus = true;
    }
    save();
    render();
  }

  function deleteDuty(kind, id) {
    if (!canEditCatalogs()) return;
    var machine = kind === "machineDuty";
    var custom = machine ? state.customMachineDuties : state.customDuties;
    var next = custom.filter(function (item) { return item.id !== id; });
    if (next.length !== custom.length) {
      if (machine) state.customMachineDuties = next;
      else state.customDuties = next;
    } else if (machine) state.machineDutyRemoved[id] = true;
    else state.dutyRemoved[id] = true;
    if (machine) {
      delete state.machineDutyOverrides[id];
      state.machineStatusEdit = "";
      state.machineStatusNameDraft = "";
      state.machineStatusPlus = true;
    } else {
      delete state.dutyOverrides[id];
      state.statusEdit = "";
      state.statusNameDraft = "";
      state.statusPlus = true;
    }
    state.confirm = null;
    save();
    render();
  }

  function stripPersonFromDaysArchive(personId) {
    Object.keys(state.daysArchive || {}).forEach(function (key) {
      var slice = state.daysArchive[key];
      if (!slice || !slice.unit) return;
      removePersonFromUnitTree(slice.unit, personId);
    });
  }

  function stripMachineFromDaysArchive(machineId) {
    Object.keys(state.daysArchive || {}).forEach(function (key) {
      var slice = state.daysArchive[key];
      if (!slice || !Array.isArray(slice.machines)) return;
      slice.machines = slice.machines.filter(function (item) {
        return !(item && item.id === machineId);
      });
    });
  }

  function confirmRemoval() {
    if (!state.confirm) return;
    if (state.confirm.kind === "duty" || state.confirm.kind === "machineDuty") {
      deleteDuty(state.confirm.kind, state.confirm.id);
      return;
    }
    if (state.confirm.kind === "type") {
      deleteType(state.confirm.id);
      return;
    }
    if (state.confirm.kind === "event") {

  function issueWideAccess() {

      render();

    }
    var mode = state.accessShareMode;
    if (mode !== "full" && mode !== "period" && mode !== "selective") {
      state.accessNote = "Оберіть тип доступу.";
      render();
      return;
    }
    var who = String(target.name || target.code || "").replace(/\s+/g, " ").trim().slice(0, 40);
    var peopleAll = mode === "full" || mode === "period" || !!state.accessPeopleAllDraft;
    var machinesAll = mode === "full" || mode === "period" || !!state.accessMachinesAllDraft;
    var tasksAll = mode === "full" || mode === "period" || !!state.accessTasksAllDraft;
    var people = peopleAll ? [] : Object.keys(state.accessPersonDraft || {}).filter(function (id) {
      return !!state.accessPersonDraft[id];
    });
    var machines = machinesAll ? [] : Object.keys(state.accessMachineDraft || {}).filter(function (id) {
      return !!state.accessMachineDraft[id];
    });
    var tasks = tasksAll ? [] : Object.keys(state.accessTaskDraft || {}).filter(function (id) {
      return !!state.accessTaskDraft[id];
    });
    var fromDay = "";
    var toDay = "";
    if (mode === "period") {
      fromDay = /^\d{4}-\d{2}-\d{2}$/.test(String(state.accessFromDay || "")) ? state.accessFromDay : todayISO();
      toDay = /^\d{4}-\d{2}-\d{2}$/.test(String(state.accessToDay || "")) ? state.accessToDay : todayISO();
      if (fromDay > toDay) {
        var swap = fromDay;
        fromDay = toDay;
        toDay = swap;
      }
    }
    if (mode === "selective" && !peopleAll && !machinesAll && !tasksAll && !people.length && !machines.length && !tasks.length) {
      state.accessNote = "Оберіть розділ або картки.";
      render();
      return;
    }
    // Оновити існуючий грант на того самого targetCode або видати новий код.
    var unitKey = state.reportKey || actorKey() || "lead";
    var existing = null;
    state.accessGrants.forEach(function (item) {
      if (String(item.unitKey || "") === String(unitKey) && String(item.targetCode || "") === String(target.code || "")) existing = item;
    });
    var grant = normalizeAccessGrant({
      id: existing && existing.id ? existing.id : ("g" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36)),
      code: existing && existing.code ? existing.code : generateUnitCode(),
      unitKey: unitKey,
      targetCode: String(target.code || "").slice(0, 80),
      forWhom: who,
      mode: mode,
      fromDay: fromDay,
      toDay: toDay,
      peopleAll: peopleAll,
      machinesAll: machinesAll,
      tasksAll: tasksAll,
      personIds: people.slice(0, 200),
      machineIds: machines.slice(0, 200),
      taskIds: tasks.slice(0, 200)
    });
    if (existing) {
      Object.keys(grant).forEach(function (key) { existing[key] = grant[key]; });
    } else {
      state.accessGrants.push(grant);
    }
    state.accessForDraft = who;
    state.accessShareTarget = String(target.code || "");
    resetAccessShareDraft();
    state.accessShareTarget = String(target.code || "");
    save();
    render();

  function applyFieldEdit(node) {
    if (!node || !node.getAttribute) return false;
    var kind = node.getAttribute("data-edit-kind");
    if (!kind) return false;
    var id = node.getAttribute("data-edit-id");
    var fieldName = node.getAttribute("data-edit-field");
    var bucket = kind === "machine" ? state.edits.machines : state.edits.people;
    if (!bucket[id]) bucket[id] = {};
    if (fieldName === "mileage" || fieldName === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) bucket[id][fieldName] = null;
      else {
        var num = parseInt(trimmed, 10);
        bucket[id][fieldName] = isNaN(num) ? null : num;
      }
    } else {
      bucket[id][fieldName] = String(rawControl(node) || "").slice(0, 80);
    }
    if (kind === "person" && (fieldName === "surname" || fieldName === "givenName" || fieldName === "patronymic" || fieldName === "name")) {
      var named = findPerson(id) || addedPerson(id);
      if (named) {
        var synced = personNameParts(named);
        bucket[id].surname = synced.surname;
        bucket[id].givenName = synced.givenName;
        bucket[id].patronymic = synced.patronymic;
        bucket[id].name = joinPersonName(synced);
        if (addedPerson(id)) {
          named.surname = synced.surname;
          named.givenName = synced.givenName;
          named.patronymic = synced.patronymic;
          named.name = bucket[id].name;
        }
      }
    }
    if (kind === "person" && fieldName === "unit") {
      var personItem = addedPerson(id) || findPerson(id);
      if (personItem) personItem.unit = String(bucket[id].unit || "").slice(0, 80);
      var addedOnly = addedPerson(id);
      var place = addedOnly ? placeFromUnit(bucket[id].unit) : "";
      if (addedOnly && place) {
        addedOnly.place = place;
        openUnitPath(place);
      }
    }
    if (kind === "machine" && fieldName === "type") {
      var machineItem = addedMachine(id) || findMachine(id);
      var typeId = resolveMachineTypeId(bucket[id].type);
      if (machineItem) {
        machineItem.type = typeId;
        bucket[id].type = typeId === OTHER_TYPE.id ? "" : (typeById(typeId) ? typeById(typeId).one : "");
        state.open.add("type:" + typeId);
      }
    }
    return true;
  }

    var copy = event.target.closest("[data-copy]");
    if (copy) {
      var value = copy.getAttribute("data-copy");
      var line = copy.parentElement.querySelector("[data-unit-code], [data-key-code]");
      if (line && window.getSelection && document.createRange) {
        var range = document.createRange();
        range.selectNodeContents(line);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).catch(function () {});
      }
      return;
    }
    var restore = event.target.closest("[data-restore]");
    if (restore) {
      if (!canBranch()) return;
      var restored = restore.getAttribute("data-restore").split(":");
      var restoredKind = restored[0];
      var restoredId = restored.slice(1).join(":");
      var restoreDay = state.viewDay || todayISO();
      ensureCardStores();
      // ZS-133: повернути з архіву й внести запис на поточний день (для редагування).
      if (restoredKind === "person") {
        delete state.removed.people[restoredId];
        if (state.removedAt && state.removedAt.people) delete state.removedAt.people[restoredId];
        var pCard = state.peopleCards[restoredId];
        if (!pCard) {
          upsertPersonCardDay(restoredId, restoreDay, { id: restoredId });
          pCard = state.peopleCards[restoredId];
        }
        if (pCard) {
          pCard.archived = false;
          pCard.archivedAt = null;
          if (!pCard.days) pCard.days = {};
          if (!pCard.days[restoreDay]) {
            var latestP = latestCardDayKey(pCard);
            upsertPersonCardDay(restoredId, restoreDay, latestP ? pCard.days[latestP] : personItemFromCard(pCard, ""));
          }
        }
      }
      if (restoredKind === "machine") {
        delete state.removed.machines[restoredId];
        if (state.removedAt && state.removedAt.machines) delete state.removedAt.machines[restoredId];
        var mCard = state.machineCards[restoredId];
        if (!mCard) {
          upsertMachineCardDay(restoredId, restoreDay, { id: restoredId });
          mCard = state.machineCards[restoredId];
        }
        if (mCard) {
          mCard.archived = false;
          mCard.archivedAt = null;
          if (!mCard.days) mCard.days = {};
          if (!mCard.days[restoreDay]) {
            var latestM = latestCardDayKey(mCard);
            upsertMachineCardDay(restoredId, restoreDay, latestM ? mCard.days[latestM] : machineItemFromCard(mCard, ""));
          }
        }
      }
      projectCardsToLiveDay();
      save();
      render();
      return;
    }
    var cancelDelete = event.target.closest("[data-cancel-delete]");
    if (cancelDelete) {
      state.confirm = null;
      render();
      return;
    }
    var confirmDelete = event.target.closest("[data-confirm-delete]");
    if (confirmDelete) {
      confirmRemoval();
      return;
    }
    var remove = event.target.closest("[data-remove]");
    if (remove) {
      if (canDelete()) {
        var parts = remove.getAttribute("data-remove").split(":");
        var kind = parts[0];
        var id = parts.slice(1).join(":");
        if (state.confirm && state.confirm.kind === kind && state.confirm.id === id) {
          state.confirm = null;
          render();
          return;
        }
        state.confirm = { kind: kind, id: id };
        // Підтвердження архіву — у вікні картки; інші о/с/ОВТ закриваємо.
        closeOpenEntityCards();
        state.draft = null;
        state.open.add(kind + ":" + id);
        render();
      }
      return;
    }
    var openUnit = event.target.closest("[data-open-unit]");
    if (openUnit) {
      var openCode = openUnit.getAttribute("data-open-unit");
      openManagedUnitTab(openCode);
      return;
    }
    var use = event.target.closest("[data-use-code]");
    if (use) {
      applyCode(use.getAttribute("data-use-code"));
      return;
    }
    var toggleNode = event.target.closest("[data-toggle]");
    if (!toggleNode) return;
    toggle(toggleNode.getAttribute("data-toggle"));
  }

      check(!!heading && heading.textContent === title, "заголовок картки: " + title);

      for (var i = 0; i < tools.length; i++) {

        check(tools[i].textContent.trim() === "", "іконка без підпису");
        check(tools[i].getAttribute("aria-label") === labels[i], "назва дії " + labels[i]);
        check(tools[i].classList.contains(kinds[i]), "вид іконки " + kinds[i]);
        strokes.push(tools[i].querySelector("svg").getAttribute("stroke-width"));
        widths.push(Math.round(mark.width * 10));

        gesture.active = true;

      gesture.el.style.transform = "translateY(" + Math.min(dy, 160) + "px)";

    }
