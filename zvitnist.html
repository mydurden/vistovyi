<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2820">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <title>Вістовий</title>
  <style>
:root {
  --bg: #e7e1d6;
  --paper: #fbf8f3;
  --ink: #1b1915;
  --muted: #4a453c;
  --line: #ddd4c6;
  --green: #0e6840;
  --green-ink: #0c4f31;
  --green-soft: #e6f3ec;
  --clay: #8c3b2e;
  --clay-ink: #6d2e23;
  --clay-soft: #f8ece8;
  --header: #1a2820;
  --header-ink: #f4f0e7;
  --header-muted: #d5cec3;
  --amber-soft: #f4efe4;
  --amber-ink: #5c4a2e;
  --red: #9b3228;
  --red-ink: #7a271f;
  --red-soft: #f7e8e5;
  --done-soft: #eceae6;
  --done-ink: #3e3a34;
  --today: #2f6fed;
  --today-soft: #dce8fb;
  --today-ink: #1a4fbf;
  --shadow: 0 1px 2px rgba(27, 25, 21, 0.05), 0 12px 28px rgba(27, 25, 21, 0.05);
  --radius: 16px;
  color-scheme: light;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
}

button, input { font: inherit; color: inherit; }

button { cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

.skip {
  position: absolute;
  left: 12px;
  top: -48px;
  z-index: 3;
  background: #fff;
  color: var(--ink);
  padding: 8px 12px;
  border-radius: 8px;
}

.skip:focus { top: 8px; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.top {
  background: var(--header);
  color: var(--header-ink);
  overflow: visible;
}

.wrap {
  width: min(720px, 100%);
  margin: 0 auto;
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
}

.top .wrap { padding-top: 6px; padding-bottom: 12px; }

h1 {
  margin: 0;
  font-size: 1.35rem;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-row h1 {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
}

.title-row h1[data-sync-drive] {
  cursor: pointer;
}

.title-mark {
  display: block;
  height: 42px;
  width: auto;
}


.title-row .tool { color: var(--header-ink); }

.field-label {
  display: block;
  margin-bottom: 4px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.top .field-label { color: var(--header-muted); }

.primary {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  border-radius: 12px;
  background: #f4f0e7;
  color: var(--header);
  font-weight: 700;
}

.now, .hint, .error, .gloss, .saved, .limit {
  margin: 6px 0 0;
}

.top .now, .top .hint { color: var(--header-muted); font-size: 0.92rem; }

.drive-progress {
  height: 4px;
  margin: 8px 0 0;
  border-radius: 999px;
  overflow: hidden;
  background: var(--line);
}

.drive-progress-fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--green);
  transition: width 0.35s ease-out;
}

.top .drive-progress {
  background: rgba(244, 240, 231, 0.22);
}

.top .drive-progress-fill {
  background: var(--header-muted);
}

.top .error { color: #ffd2c8; font-size: 0.92rem; margin: 8px 0 0; }

.top .report-switch {
  display: block;
  visibility: visible;
  opacity: 1;
  height: auto;
  max-height: none;
  overflow: visible;
  margin: 12px 0 0;
}

.top .report-switch .pick-current,
.top .report-switch .pick-list,
.top .report-switch .pick-option {
  background: var(--paper);
  color: var(--ink);
}

.top .report-switch .pick-current {
  display: block;
  visibility: visible;
  opacity: 1;
  width: 100%;
  min-height: 44px;
  overflow-wrap: anywhere;
  font-weight: 700;
}

.top .report-switch .pick-option.is-current { background: #fff; }

.top .report-switch .pick-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.top .report-switch .pick-option.is-disabled {
  opacity: 0.72;
  cursor: default;
}

.top .report-switch .report-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
}

.sub-status {
  flex: 0 1 auto;
  font-size: 0.86rem;
  font-weight: 700;
  line-height: 1.25;
  text-align: right;
  overflow-wrap: anywhere;
}

.sub-status.is-received { color: var(--clay); }
.sub-status.is-missing { color: var(--red); }
.sub-status.is-merged { color: var(--green); }

.pick-current-edit {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 0 4px 0 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}

.pick-current-edit input[type="text"] {
  flex: 1 1 auto;
  width: 1%;
  min-width: 0;
  min-height: 40px;
  margin: 0;
  padding: 8px 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  font: inherit;
  font-size: 16px;
}

.pick-current-edit .pick-toggle {
  flex: 0 0 auto;
  width: 40px;
  min-width: 40px;
  height: 40px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 1.1rem;
  line-height: 1;
}

.duty-combo {
  display: block;
  width: 100%;
  margin-top: 4px;
}

.duty-combo .pick-current-edit {
  display: flex;
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--line);
  background: #fff;
}

.duty-combo.is-open .pick-current-edit {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.changes-empty { margin: 4px 0 8px; font-weight: 700; }

.day-nav { padding-top: 10px; padding-bottom: 6px; }
.day-nav-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 44px;
}
.day-nav-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 44px;
  min-width: 44px;
  min-height: 44px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  line-height: 0;
}
.day-nav-arrow:active { background: var(--amber-soft); }
.day-nav-date {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 6px 8px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  font-weight: 700;
  text-align: center;
  line-height: 1.25;
}
.day-nav-date:active { background: var(--amber-soft); }
.day-nav-date .day-nav-weekday {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 700;
}

.calendar-month {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 4px 0 12px;
}
.calendar-month h3 {
  margin: 0;
  flex: 1 1 auto;
  text-align: center;
  font-size: 1.05rem;
}
.calendar-weekdays,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
.calendar-weekdays span {
  text-align: center;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  padding: 4px 0;
}
.calendar-day {
  min-height: 40px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #9a9286;
  font-weight: 700;
}
.calendar-day.has-report {
  background: var(--header);
  color: var(--header-ink);
}
.calendar-day.is-empty {
  background: #ece7de;
  color: #8a8378;
}
.calendar-day.is-muted {
  opacity: 0.35;
}
.calendar-day.is-selected {
  outline: 2px solid var(--green);
  outline-offset: 1px;
}
.calendar-day.is-today {
  background: var(--today-soft);
  color: var(--today-ink);
  box-shadow: inset 0 0 0 2px var(--today);
}
.calendar-day.is-today.has-report {
  background: var(--today);
  color: #f4f8ff;
  box-shadow: none;
}
.calendar-day.is-today.is-selected {
  outline-color: var(--today);
}
.calendar-day:active { opacity: 0.85; }

.overlay-sheet.is-compact {
  min-height: 0;
  width: min(100%, 420px);
  margin-top: 12vh;
  padding-bottom: 20px;
  border-radius: 16px;
}

main.wrap {
  padding-top: 12px;
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
}

.block {
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 12px 4px;
  margin: 0 0 8px;
}

.block-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.block-tools {
  display: flex;
  align-items: center;
  margin-left: auto;
}

h2 {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.2;
  font-weight: 700;
}

.frac {
  display: flex;
  align-items: baseline;
  gap: 1px;
  margin: 6px 0 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
}

.frac .num, .frac .den {
  font-weight: 700;
  font-size: 2rem;
}

.frac .num { color: var(--green); }
.frac .num.zero { color: var(--clay); }
.frac .slash { color: var(--muted); font-size: 1.45rem; margin: 0 1px; font-weight: 600; }

.frac.small { margin: 0; flex: 0 0 auto; }
.frac.small .num, .frac.small .den { font-size: 1.05rem; }
.frac.small .slash { font-size: 0.95rem; }

.gloss { color: var(--muted); font-size: 0.92rem; margin: 4px 0 4px; }

.tool {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  appearance: none;
  color: var(--ink);
  line-height: 0;
}

.icon-gear svg,
.icon-plus svg,
.icon-x svg,
.icon-check svg,
.icon-pencil svg,
.icon-profile svg,
.icon-left svg,
.icon-right svg { width: 36px; height: 36px; }
.tool-profile {
  height: auto;
  min-height: 0;
  width: auto;
  min-width: 0;
}
.tool-profile img { display: block; height: 42px; width: auto; }

.tool-x { color: var(--clay); }
.tool-check { color: var(--green); }
.tool-pencil { color: var(--ink); }

.card-actions { display: flex; flex: 0 0 auto; align-items: center; }

.name-row {
  display: flex;
  align-items: center;
  min-width: 0;
}

.name-row > input[type="text"] {
  flex: 1 1 auto;
  width: 1%;
  min-width: 0;
  margin-top: 4px;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: rgba(26, 40, 32, 0.5);
  overflow: auto;
  padding: 8px;
}

.overlay-sheet {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: calc(100vh - 16px);
  margin: 0 auto;
  background: var(--paper);
  padding: 8px 12px 32px;
}

.pull-bar {
  width: 44px;
  height: 6px;
  margin: 2px auto 10px;
  border-radius: 999px;
  background: var(--line);
  touch-action: none;
}

.overlay-sheet .card {
  border: 0;
  background: transparent;
  margin: 0;
  padding: 4px 0 12px;
  border-radius: 0;
}

.swipe-row {
  position: relative;
  overflow: hidden;
}

.swipe-delete {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  height: auto;
  width: 52px;
  min-width: 52px;
  transform: translateX(110%);
}

.swipe-row.revealed > .row { transform: translateX(-52px); }
.swipe-row.revealed .swipe-delete { transform: none; }

.icon { display: inline-flex; flex: 0 0 auto; }
.icon svg { display: block; }
.icon-chev { color: var(--muted); transition: transform 0.15s ease; }
[aria-expanded="true"] > .icon-chev { transform: rotate(90deg); }

.row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  padding: 7px 2px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
  touch-action: manipulation;
}

.row:active { background: rgba(26, 40, 32, 0.04); }

.grow { flex: 1 1 auto; min-width: 0; }
.call { display: block; font-weight: 700; overflow-wrap: break-word; }
.pname, .meta { display: block; color: var(--muted); font-size: 0.92rem; overflow-wrap: break-word; }
.inline-hint { color: var(--muted); font-weight: 500; }

.pill {
  flex: 0 0 auto;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  white-space: nowrap;
}

.pill.wrap {
  white-space: normal;
  max-width: 8.5rem;
}

.pill.plus { background: var(--green-soft); color: var(--green-ink); }
.pill.minus { background: var(--clay-soft); color: var(--clay-ink); }
.pill.planned { background: var(--amber-soft); color: var(--amber-ink); }
.pill.doing { background: var(--green-soft); color: var(--green-ink); }
.pill.done { background: var(--done-soft); color: var(--done-ink); }

.panel {
  margin: 0 0 8px 10px;
  padding-left: 8px;
  border-left: 2px solid var(--line);
}

.gear, .card, .short, .glossary {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.gear, .short { margin: 4px 0 8px; padding: 10px 12px; }

.gear h3, .card h3, .glossary summary {
  margin: 0 0 6px;
  font-size: 1rem;
}

.gear label, .check {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  min-height: 36px;
  padding: 4px 0;
}

.check input { width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; flex: 0 0 auto; }

.card { margin: 4px 0 8px; padding: 12px; }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-width: 0;
}

.card-head h3 {
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
  line-height: 1.2;
}

.card input:disabled,
.card select:disabled {
  color: var(--ink);
  opacity: 1;
}

.machine-card .card-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 10px;
  row-gap: 8px;
  margin-top: 8px;
}

.machine-card .card-fields .field {
  margin: 0;
  min-width: 0;
}

.machine-card .card-fields .field.wide {
  grid-column: 1 / -1;
}

.field { margin: 0 0 10px; }
.field .label, .card .label { color: var(--muted); font-size: 0.82rem; font-weight: 700; }
.field .value { font-size: 1rem; overflow-wrap: anywhere; }

button.count-toggle {
  display: block;
  width: auto;
  max-width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 6px 0;
  border: 0;
  background: transparent;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 0.18em;
  touch-action: manipulation;
}

.card input[type="text"],
.card select,
.unit-create input[type="text"],
.unit-create select {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 44px;
  margin-top: 4px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-size: 16px;
}

.card input[type="text"]:disabled,
.card select:disabled {
  background: var(--paper);
  color: var(--ink);
}

.card.is-editing {
  background: var(--paper);
}

.card.is-editing input[type="text"],
.card.is-editing select {
  background: #fff;
  color: var(--ink);
}

.card .name-row > input[type="text"] {
  flex: 1 1 auto;
  width: 1%;
  min-width: 0;
}

.unit-create .label,
.archive .label { display: block; margin-top: 8px; font-weight: 700; }

.wide-access .label { display: block; margin-top: 8px; font-weight: 700; }

.wide-access .check {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 6px;
  font-size: 16px;
}

.wide-access .check input {
  margin-top: 3px;
  flex: 0 0 auto;
}

.wide-access input.for-whom {
  display: block;
  width: 11.5rem;
  max-width: 100%;
  min-height: 44px;
  margin-top: 4px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-size: 16px;
}

.wide-access .issue {
  display: block;
  width: 100%;
  min-height: 44px;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-weight: 700;
}

.pick { position: relative; margin-top: 4px; }

.pick-current,
.pick-option {
  appearance: none;
  box-shadow: none;
  font: inherit;
  font-size: 16px;
  font-weight: 400;
  color: var(--ink);
  text-align: left;
}

.pick-current {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}

.card .pick.is-locked .pick-current { background: var(--paper); color: var(--ink); }

.card.is-editing .pick-current { background: #fff; color: var(--ink); }

.pick-list {
  position: fixed;
  z-index: 80;
  margin: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  overflow: auto;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 200ms ease, transform 200ms ease;
}

.pick-list.is-shown {
  opacity: 1;
  transform: translateY(0);
}

.pick-group {
  padding: 8px 12px 4px;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  color: var(--muted);
  background: var(--paper);
}

.pick-option {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 8px 12px;
  border: 0;
  border-radius: 0;
  background: #fff;
}

.pick-option.is-current { background: var(--paper); }

.unit-create .pick-current,
.card .pick-current {
  margin-top: 0;
  font-weight: 400;
}

.unit-create .pick-option,
.card .pick-option {
  margin-top: 0;
  border: 0;
  border-radius: 0;
  font-weight: 400;
  background: #fff;
}

.unit-create .pick-option.is-current,
.card .pick-option.is-current { background: var(--paper); }

.duty-catalog { margin-top: 14px; }

.reveal {
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows 200ms ease, opacity 200ms ease, transform 200ms ease;
}

.reveal > .reveal-body {
  min-height: 0;
  overflow: visible;
}

.reveal.is-collapsed {
  grid-template-rows: 0fr;
  opacity: 0;
  transform: translateY(-4px);
}

.reveal.is-collapsed > .reveal-body {
  overflow: hidden;
}

.status-list .pick-option {
  margin-top: 0;
  border: 0;
  border-radius: 0;
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  font-weight: 400;
  padding: 8px 12px;
}

.status-list summary {
  min-height: 44px;
  padding: 12px 0;
  font-weight: 700;
  cursor: pointer;
}

.status-item { border-top: 1px solid var(--line); padding-top: 8px; }

      а: "a", б: "b", в: "v", г: "h", ґ: "g", д: "d", е: "e", є: "ye", ж: "zh", з: "z",
      и: "y", і: "i", ї: "yi", й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p",
      р: "r", с: "s", т: "t", у: "u", ф: "f", х: "kh", ц: "ts", ч: "ch", ш: "sh", щ: "shch",
      ь: "", ю: "yu", я: "ya", "'": "", "’": "", "ʼ": ""
    };
    var lower = String(ch || "").toLowerCase();
    if (Object.prototype.hasOwnProperty.call(map, lower)) return map[lower];
    if (/[a-z0-9]/i.test(ch)) return lower;
    return "-";
  }

  function sanitizeDriveSlug(raw) {
    var src = String(raw || "").trim();
    if (!src) return "";
    var out = "";
    for (var i = 0; i < src.length; i++) out += translitDriveChar(src.charAt(i));
    out = out.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").replace(/-+/g, "-");
    return out.slice(0, 48);
  }

  function unitDriveLabelForKey(code) {
    var key = String(code || "").trim();
    if (!key) return "";
    var lower = key.toLowerCase();
    if (lower === "lead" || lower === "sluzhba" || lower === "1rota") return "sluzhba";
    var unit = findUnitByCode(key);
    if (unit && unit.name) return String(unit.name);
    if (looksLikeUnitCode(key)) {
      var parts = key.split("-");
      return parts[parts.length - 1] || "unit";
    }
    // Пароль адміна / загальний — не світити пароль; ярлик служби.
    if (String(state.reportRoot || "").toLowerCase() === "lead" || String(state.openCode || "").toLowerCase() === "lead") {
      return "sluzhba";
    }
    if (state.holder) return String(state.holder);
    return "zagalnyi";
  }

  function unitDriveFileName(code) {
    var key = String(code || "").trim();
    if (!key) return "";
    var slug = sanitizeDriveSlug(unitDriveLabelForKey(key));
    if (!slug) {
      if (looksLikeUnitCode(key)) {
        var tail = key.replace(/[^A-Za-z0-9]/g, "").slice(-4).toLowerCase();
        slug = "unit-" + (tail || "x");
      } else {
        slug = "zagalnyi";
      }
    }
    return "vu-" + slug + ".bin";
  }

  function resolveUnitDriveFile(token, folderId, key, opts) {
    var modern = unitDriveFileName(key);
    var legacy = unitDriveFileNameLegacy(key);
    if (!modern) return Promise.resolve({ file: null, name: "", legacyName: legacy, fromLegacy: false });
    var queryOpts = opts || { kind: "binary", decryptKey: key };
    return resolveDriveFileByName(token, folderId, modern, queryOpts).then(function (info) {
      if (info && info.file) {
        return { file: info.file, name: modern, legacyName: legacy, fromLegacy: false, trashed: info.trashed || 0 };
      }
      if (!legacy || legacy === modern) {
        return { file: null, name: modern, legacyName: legacy, fromLegacy: false, trashed: 0 };
      }
      return resolveDriveFileByName(token, folderId, legacy, queryOpts).then(function (legacyInfo) {
        return {
          file: legacyInfo && legacyInfo.file ? legacyInfo.file : null,
          name: modern,
          legacyName: legacy,
          fromLegacy: !!(legacyInfo && legacyInfo.file),
          trashed: legacyInfo && legacyInfo.trashed ? legacyInfo.trashed : 0
        };
      });
    });
  }

  function bytesToArrayBuffer(bytes) {
    return bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
  }

  function deriveAesKey(password, salt) {
    return crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(String(password || "")),
      "PBKDF2",
      false,
      ["deriveKey"]
    ).then(function (baseKey) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 120000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    });
  }

  function encryptWithCode(password, plainText) {
    var salt = new Uint8Array(16);
    var iv = new Uint8Array(12);
    crypto.getRandomValues(salt);
    crypto.getRandomValues(iv);
    return deriveAesKey(password, salt).then(function (key) {
      return crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        new TextEncoder().encode(String(plainText || ""))
      ).then(function (cipher) {
        var sealed = new Uint8Array(4 + salt.length + iv.length + cipher.byteLength);
        sealed[0] = 118; // v
        sealed[1] = 117; // u
        sealed[2] = 1;   // version
        sealed[3] = 1;
        sealed.set(salt, 4);
        sealed.set(iv, 20);
        sealed.set(new Uint8Array(cipher), 32);
        return sealed;
      });
    });
  }

  function decryptWithCode(password, bytes) {
    var data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes || []);
    if (data.length < 33 || data[0] !== 118 || data[1] !== 117 || data[2] !== 1) {
      return Promise.reject(new Error("format"));
    }
    var salt = data.slice(4, 20);
    var iv = data.slice(20, 32);
    var cipher = data.slice(32);
    return deriveAesKey(password, salt).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, cipher).then(function (plain) {
        return new TextDecoder().decode(plain);
      });
    });
  }

  function pad2(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function parseISODate(iso) {
    var parts = String(iso || "").split("-").map(Number);
    if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return null;
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function toISODate(date) {
    return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
  }

  function shiftISODate(iso, delta) {
    var d = parseISODate(iso) || new Date();
    d.setDate(d.getDate() + Number(delta || 0));
    return toISODate(d);
  }

  function formatDayUi(iso) {
    var d = parseISODate(iso);
    if (!d) return String(iso || "");
    return pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + d.getFullYear();
  }

  function weekdayLabel(iso) {
    var d = parseISODate(iso);
    if (!d) return "";
    return WEEKDAYS[d.getDay()] || "";
  }

  function monthKeyFromISO(iso) {
    var d = parseISODate(iso) || new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  }

  function cloneData(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function placeFromUnitInTree(root, value) {
    var raw = String(value || "").trim();
    if (!raw || !root) return "";
    var lower = raw.toLowerCase();
    var found = "";
    function walk(node, trail) {
      var next = trail.concat([node]);
      var path = next.map(function (item) { return item.name; }).join(" · ");
      if (node.name === raw || path === raw || String(node.name || "").toLowerCase() === lower || path.toLowerCase() === lower) {
        found = node.id;
      }
      (node.children || []).forEach(function (child) { walk(child, next); });
    }
    walk(root, []);
    return found;
  }

  function bakedPersonFields(item) {
    var edit = personEdit(item.id);
    var dutyMapNow = dutyMap();
    var duty = Object.prototype.hasOwnProperty.call(edit, "duty")
      ? (edit.duty && dutyMapNow[edit.duty] ? edit.duty : (item.duty || "in"))
      : (dutyMapNow[item.duty] ? item.duty : (item.duty || "in"));
    var accounting = edit.accounting && ACCOUNTING[edit.accounting]
      ? edit.accounting
      : (ACCOUNTING[item.accounting] ? item.accounting : "official");
    var parts = personNameParts(item);
    var unitText = edit.unit != null ? edit.unit : (item.unit != null ? item.unit : "");
    return {
      id: item.id,
      surname: parts.surname,
      givenName: parts.givenName,
      patronymic: parts.patronymic,
      name: joinPersonName(parts),
      rank: edit.rank != null ? edit.rank : (item.rank || ""),
      callsign: edit.callsign != null ? edit.callsign : (item.callsign || ""),
      unit: String(unitText || "").slice(0, 80),
      accounting: accounting,
      duty: duty,
      position: Object.prototype.hasOwnProperty.call(state.positions, item.id)
        ? String(state.positions[item.id] || "")
        : String(item.position || "")
    };
  }

  function bakedMachineFields(item) {
    var edit = machineEdit(item.id);
    var map = machineDutyMap();
    var duty = Object.prototype.hasOwnProperty.call(edit, "duty")
      ? (edit.duty && map[edit.duty] ? edit.duty : (item.duty || "in"))
      : (map[item.duty] ? item.duty : (item.duty || "in"));
    var accounting = edit.accounting && ACCOUNTING[edit.accounting]
      ? edit.accounting
      : (ACCOUNTING[item.accounting] ? item.accounting : "official");
    var typeId = item.type;
    if (edit.type != null) typeId = resolveMachineTypeId(edit.type);
    return {
      id: item.id,
      type: typeId,
      name: edit.name != null ? edit.name : (item.name || ""),
      board: edit.board != null ? edit.board : (item.board || ""),
      accounting: accounting,
      duty: duty,
      mileage: Object.prototype.hasOwnProperty.call(edit, "mileage") ? edit.mileage : (item.mileage == null ? null : item.mileage),
      hours: Object.prototype.hasOwnProperty.call(edit, "hours") ? edit.hours : (item.hours == null ? null : item.hours),
      service: Object.prototype.hasOwnProperty.call(edit, "service") ? edit.service : String(item.service || "")
    };
  }

  // Знімок дня з накладками added/edits (без зміни живого state).
  function buildBakedDayParts() {
    var report = state.report || sampleReportDocument();
    var unit = cloneData(report.unit || { id: "root", name: "", people: [] });
    var nodes = {};
    var collected = [];
    function strip(node) {
      nodes[node.id] = node;
      (node.people || []).forEach(function (item) {
        collected.push({ item: item, place: node.id });
      });
      node.people = Array.isArray(node.people) ? [] : node.people;
      (node.children || []).forEach(strip);
    }
    strip(unit);
    function putPerson(item, placeHint, editUnit) {
      if (!item || !item.id || state.removed.people[item.id]) return;
      var place = placeHint || unit.id;
      if (editUnit != null) {
        var moved = placeFromUnitInTree(unit, editUnit);
        if (moved) place = moved;
      }
      if (!nodes[place]) place = unit.id;
      if (!nodes[place].people) nodes[place].people = [];
      nodes[place].people.push(bakedPersonFields(item));
    }
    collected.forEach(function (entry) {
      var edit = personEdit(entry.item.id);
      putPerson(entry.item, entry.place, edit.unit);
    });
    (state.added.people || []).forEach(function (item) {
      var edit = personEdit(item.id);
      putPerson(item, item.place || unit.id, edit.unit);
    });
    var machines = [];
    (Array.isArray(report.machines) ? report.machines : []).forEach(function (item) {
      if (!item || !item.id || state.removed.machines[item.id]) return;
      machines.push(bakedMachineFields(item));
    });
    (state.added.machines || []).forEach(function (item) {
      if (!item || !item.id || state.removed.machines[item.id]) return;
      machines.push(bakedMachineFields(item));
    });
    return {
      unit: unit,
      machines: machines,
      tasks: cloneData(Array.isArray(report.tasks) ? report.tasks : []),
      people: cloneData(Array.isArray(report.people) ? report.people : []),
      changes: cloneData(Array.isArray(state.changes) ? state.changes : [])
    };
  }

  function materializeOverlays() {
    if (!state.report) return false;
    var hasAdded = (state.added.people || []).some(function (item) { return item && !state.removed.people[item.id]; })
      || (state.added.machines || []).some(function (item) { return item && !state.removed.machines[item.id]; });
    var hasEdits = Object.keys(state.edits.people || {}).length > 0 || Object.keys(state.edits.machines || {}).length > 0;
    var hasPos = Object.keys(state.positions || {}).length > 0;
    if (!hasAdded && !hasEdits && !hasPos) return false;
    var baked = buildBakedDayParts();
    state.report = {
      name: state.report.name,
      code: state.report.code,
      file: state.report.file,
      unit: baked.unit,
      machines: baked.machines,
      tasks: baked.tasks,
      people: baked.people
    };
    state.added = {
      people: (state.added.people || []).filter(function (item) { return item && state.removed.people[item.id]; }),
      machines: (state.added.machines || []).filter(function (item) { return item && state.removed.machines[item.id]; })
    };
    state.edits = { people: {}, machines: {} };
    state.positions = {};
    return true;
  }

  function daySliceFromState() {
    return buildBakedDayParts();
  }

  function normalizeDaySlice(raw) {
    if (!raw || typeof raw !== "object") {
      return {
        unit: { id: "root", name: "", people: [] },
        machines: [],
        tasks: [],
        people: [],
        changes: []
      };
    }
    return {
      unit: raw.unit && typeof raw.unit === "object" ? cloneData(raw.unit) : { id: "root", name: "", people: [] },
      machines: Array.isArray(raw.machines) ? cloneData(raw.machines) : [],
      tasks: Array.isArray(raw.tasks) ? cloneData(raw.tasks) : [],
      people: Array.isArray(raw.people) ? cloneData(raw.people) : [],
      changes: Array.isArray(raw.changes) ? cloneData(raw.changes) : []
    };
  }

  // Правило rollover: плани лишаються планами, о/с і ОВТ як були.
  function rolloverDaySlice(raw) {
    var slice = normalizeDaySlice(raw);
    return {
      unit: slice.unit,
      machines: slice.machines,
      tasks: slice.tasks,
      people: slice.people,
      changes: []
    };
  }

  function countPeopleInUnit(unit) {
    var total = 0;
    function walk(node) {
      if (!node || typeof node !== "object") return;
      total += Array.isArray(node.people) ? node.people.length : 0;
      (Array.isArray(node.children) ? node.children : []).forEach(walk);
    }
    walk(unit);
    return total;
  }

  function daySliceHasReport(slice) {
    var normalized = normalizeDaySlice(slice);
    if (countPeopleInUnit(normalized.unit) > 0) return true;
    if (Array.isArray(normalized.people) && normalized.people.length > 0) return true;
    if (Array.isArray(normalized.machines) && normalized.machines.length > 0) return true;
    if (Array.isArray(normalized.tasks) && normalized.tasks.length > 0) return true;
    return false;
  }

  function viewDayHasReport() {
    if (daySliceHasReport(daySliceFromState())) return true;
    if ((state.added.people || []).some(function (item) { return !state.removed.people[item.id]; })) return true;
    if ((state.added.machines || []).some(function (item) { return !state.removed.machines[item.id]; })) return true;
    return false;
  }

  function stashViewDay() {
    if (!state.viewDay) return;
    // Порожній зріз від самого лише відкриття дати в архів не кладемо.
    if (viewDayHasReport()) state.daysArchive[state.viewDay] = daySliceFromState();
    else delete state.daysArchive[state.viewDay];
  }

  function applyDaySliceToState(slice) {
    var normalized = normalizeDaySlice(slice);
    var base = state.report || sampleReportDocument();
    state.report = {
      name: base.name,
      code: base.code,
      file: base.file,
      unit: normalized.unit,
      machines: normalized.machines,
      tasks: normalized.tasks,
      people: normalized.people
    };
    state.changes = Array.isArray(normalized.changes) ? normalized.changes.slice(-100) : [];
    state.edits = { people: {}, machines: {} };
    state.removed = { people: {}, machines: {} };
    state.added = { people: [], machines: [] };
    state.positions = {};
    state.editing = null;
    state.pending = null;
    state.draft = null;
    state.confirm = null;
  }

  function nearestSourceSlice(iso, archive) {
    var store = archive || state.daysArchive;
    if (store[iso]) return normalizeDaySlice(store[iso]);
    var cursor = iso;
    var i;
    for (i = 0; i < 370; i++) {
      cursor = shiftISODate(cursor, -1);
      if (store[cursor]) return normalizeDaySlice(store[cursor]);
    }
    return rolloverDaySlice(daySliceFromState());
  }

  function ensureDaySliceIn(archive, iso) {
    if (archive[iso]) return;
    archive[iso] = rolloverDaySlice(nearestSourceSlice(iso, archive));
  }

  function openViewDay(iso) {
    var target = String(iso || todayISO());
    if (!/^\d{4}-\d{2}-\d{2}$/.test(target)) target = todayISO();
    if (state.viewDay === target && state.report) return;
    stashViewDay();
    // Навігація по датах: без rollover чужого дня. Порожня дата = порожній зріз.
    // Автокопію вчора→сьогодні лишає лише ensureDayRollover через ensureDaySliceIn.
    if (state.daysArchive[target]) {
      var slice = state.daysArchive[target];
      delete state.daysArchive[target];
      applyDaySliceToState(slice);
      state.viewDay = target;
    } else if (!state.viewDay) {
      // Перше прив’язування дати до вже зібраного звіту (rollover/тест) — не затирати.
      state.viewDay = target;
    } else {
      applyDaySliceToState(null);
      state.viewDay = target;
    }
    if (!state.fileDay || target > state.fileDay) state.fileDay = target;
  }

  function shiftViewDay(delta) {
    openViewDay(shiftISODate(state.viewDay || todayISO(), delta));
  }

  function ensureDayRollover() {
    var today = todayISO();
    if (!state.fileDay) state.fileDay = today;
    if (!state.viewDay) state.viewDay = state.fileDay;
    if (state.fileDay >= today) {
      if (!state.report) applyDaySliceToState(normalizeDaySlice(state.daysArchive[state.viewDay] || null));
      return;
    }
    stashViewDay();
    while (state.fileDay < today) {
      ensureDaySliceIn(state.daysArchive, state.fileDay);
      var next = shiftISODate(state.fileDay, 1);
      if (!state.daysArchive[next]) {
        state.daysArchive[next] = rolloverDaySlice(state.daysArchive[state.fileDay]);
      }
      state.fileDay = next;
    }
    state.viewDay = "";
    openViewDay(state.fileDay);
  }

  function hasDaySnapshot(iso) {
    if (iso === state.viewDay) return viewDayHasReport();
    return daySliceHasReport(state.daysArchive[iso]);
  }

  function allDaysMap() {
    var archive = {};
    Object.keys(state.daysArchive).forEach(function (key) {
      archive[key] = normalizeDaySlice(state.daysArchive[key]);
    });
    var viewKey = state.viewDay || todayISO();
    archive[viewKey] = daySliceFromState();
    var today = todayISO();
    var liveKey = state.fileDay || viewKey;
    while (liveKey < today) {
      ensureDaySliceIn(archive, liveKey);
      var next = shiftISODate(liveKey, 1);
      if (!archive[next]) archive[next] = rolloverDaySlice(archive[liveKey]);
      liveKey = next;
    }
    ensureDaySliceIn(archive, liveKey);
    return { archive: archive, liveKey: liveKey, viewKey: viewKey };
  }

  function currentUnitSnapshot() {
    var packed = allDaysMap();
    if (packed.liveKey !== state.fileDay) state.fileDay = packed.liveKey;
    var live = packed.archive[packed.liveKey];
    var days = {};
    Object.keys(packed.archive).forEach(function (key) {
      if (key === packed.liveKey) return;
      days[key] = packed.archive[key];
    });
    // children у знімку — від власника файлу (drive), навіть якщо зараз відкритий підлеглий.
    // Запис файлу дитини підставляє своїх children окремо в upsertOwnUnitFile.
    var unitKey = activeDriveUnitKey() || String(state.driveEncryptKey || "").trim();
    var children = unitsOwnedHere().map(function (unit) {
      return { name: String(unit.name || "").slice(0, 80), code: String(unit.code || "") };
    }).filter(function (item) { return !!item.code; });
    var report = state.report || sampleReportDocument();
    return {
      version: 2,
      name: String(report.name || state.holder || "").slice(0, 80),
      code: unitKey,
      day: packed.liveKey,
      unit: live.unit,
      machines: live.machines,
      tasks: live.tasks,
      people: live.people,
      changes: live.changes || [],
      days: days,
      children: children
    };
  }

  function bundleKeyForDriveKey(driveKey) {
    var key = String(driveKey || "").trim();
    if (!key) return "";
    if (key.toLowerCase() === "lead" || key.toLowerCase() === "sluzhba") return "1rota";
    var unit = findUnitByCode(key);
    if (unit) return unit.code;
    var root = String(state.reportRoot || "").trim();
    if (root) return reportKey(root);
    return reportKey(key);
  }

  function snapshotFromStoredBundle(unitKey) {
    var b = bundles[unitKey];
    if (!b || !b.report) return null;
    var day = b.fileDay || b.viewDay || todayISO();
    var live = null;
    if (b.daysArchive && b.daysArchive[day]) live = normalizeDaySlice(b.daysArchive[day]);
    else {
      live = normalizeDaySlice({
        unit: b.report.unit,
        machines: b.report.machines,
        tasks: b.report.tasks,
        people: b.report.people,
        changes: b.changes
      });
    }
    var days = {};
    Object.keys(b.daysArchive || {}).forEach(function (key) {
      if (key === day) return;
      days[key] = normalizeDaySlice(b.daysArchive[key]);
    });
    return {
      version: 2,
      name: String(b.report.name || "").slice(0, 80),
      code: String(unitKey || "").trim(),
      day: day,
      unit: live.unit,
      machines: live.machines,
      tasks: live.tasks,
      people: live.people,
      changes: live.changes || [],
      days: days,
      children: subordinatesFor(unitKey).map(function (unit) {
        return { name: String(unit.name || "").slice(0, 80), code: String(unit.code || "") };
      }).filter(function (item) { return !!item.code; })
    };
  }

  function applyUnitSnapshot(raw, code) {
    if (!raw || typeof raw !== "object") return null;
    var doc = {
      name: String(raw.name || "").slice(0, 80),
      code: String(code || raw.code || "").trim(),
      file: reportFileName(code || raw.code || ""),
      unit: raw.unit && typeof raw.unit === "object" ? raw.unit : { id: "root", name: String(raw.name || "").slice(0, 80), people: [] },
      machines: Array.isArray(raw.machines) ? raw.machines : [],
      tasks: Array.isArray(raw.tasks) ? raw.tasks : [],
      people: Array.isArray(raw.people) ? raw.people : []
    };
    return doc;
  }

  function loadDaysFromSnapshot(raw) {
    var next = {};
    if (raw && raw.days && typeof raw.days === "object") {
      Object.keys(raw.days).forEach(function (key) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
        next[key] = normalizeDaySlice(raw.days[key]);
      });
    }
    var day = raw && typeof raw.day === "string" && /^\d{4}-\d{2}-\d{2}$/.test(raw.day) ? raw.day : todayISO();
    next[day] = normalizeDaySlice({
      unit: raw && raw.unit,
      machines: raw && raw.machines,
      tasks: raw && raw.tasks,
      people: raw && raw.people,
      changes: raw && raw.changes

  function applyReportCache(data) {
    if (!data || !data.bundles || typeof data.bundles !== "object") return false;
    var keys = Object.keys(data.bundles);
    if (!keys.length) return false;
    keys.forEach(function (key) {
      var src = data.bundles[key];
      if (!src || !src.report) return;
      bundles[key] = {
        edits: src.edits || { people: {}, machines: {} },
        removed: src.removed || { people: {}, machines: {} },
        added: src.added || { people: [], machines: [] },
        positions: src.positions || {},
        changes: Array.isArray(src.changes) ? src.changes : [],
        report: src.report,
        daysArchive: src.daysArchive || {},
        fileDay: src.fileDay || todayISO(),
        viewDay: src.viewDay || src.fileDay || todayISO()
      };
    });
    if (data.unitReportStatus && typeof data.unitReportStatus === "object") {
      state.unitReportStatus = data.unitReportStatus;
    }
    if (typeof data.reportRoot === "string" && data.reportRoot) {
      state.reportRoot = data.reportRoot.slice(0, 80);
    }
    var want = state.reportKey || data.reportKey || "";
    if (!want || !bundles[want]) {
      want = keys.filter(function (key) { return !!bundles[key]; })[0] || "";
    }
    var saved = want ? bundles[want] : null;
    if (!saved) return false;
    state.reportKey = want;
    state.edits = saved.edits;
    state.removed = saved.removed;
    state.added = saved.added;
    state.positions = saved.positions;
    state.changes = saved.changes;
    state.report = saved.report;

  function activateReport(code) {
    var key = reportKey(code);
    if (state.reportKey === key && state.report) return;
    captureBundle(state.reportKey);
    state.reportKey = key;
    var saved = bundles[key];
    if (saved) {
      state.edits = saved.edits;
      state.removed = saved.removed;
      state.added = saved.added;
      state.positions = saved.positions;
      state.changes = saved.changes;
      state.report = saved.report;
      state.daysArchive = saved.daysArchive ? cloneData(saved.daysArchive) : {};
      state.fileDay = saved.fileDay || todayISO();
      state.viewDay = saved.viewDay || state.fileDay;
      ensureDayRollover();
      return;
    }
    freshOverlays();
    state.daysArchive = {};
    state.fileDay = todayISO();
    state.viewDay = state.fileDay;
    if (key === "1rota") {
      state.report = state.sampleReport || sampleReportDocument();
      return;
    }
    var unit = findUnitByCode(key);
    var loaded = readSiblingJson(reportFileName(key));
    if (loaded && loaded.unit && Array.isArray(loaded.machines)) {
      state.report = applyUnitSnapshot(loaded, key) || loaded;
      loadDaysFromSnapshot(loaded);
    } else {
      state.report = emptyUnitReport(unit || { name: String(key), code: String(key) });
    }

    if (typeof document === "undefined" || typeof URL === "undefined" || typeof Blob === "undefined") return;
    try {
      var blob = new Blob([json], { type: "application/json" });
      var link = el("a", { attrs: { href: URL.createObjectURL(blob), download: name } });
      document.body.append(link);
      link.click();
      link.remove();
    } catch (err) {}
  }

  function offerReportFile(doc) {
    var json = JSON.stringify(doc, null, 2);
    var name = reportFileName(doc.code);
    writeReportProof(doc);
    if (state.dirHandle && state.dirHandle.getFileHandle) {
      state.dirHandle.getFileHandle(name, { create: true }).then(function (handle) {
        return handle.createWritable();
      }).then(function (stream) {
        return stream.write(json).then(function () { return stream.close(); });
      }).then(function () {
        state.fileNote = false;
        render();
      }).catch(function () {
        downloadReport(name, json);
        state.fileNote = true;
        render();
      });
      return;
    }
    downloadReport(name, json);
    state.fileNote = true;
  }

  function loadEdits(edits) {
    if (!edits || typeof edits !== "object") return;
    ["people", "machines"].forEach(function (kind) {
      var bucket = edits[kind];
      if (!bucket || typeof bucket !== "object") return;
      Object.keys(bucket).forEach(function (id) {
        var src = bucket[id];
        if (!src || typeof src !== "object") return;
        var copy = {};
        Object.keys(src).forEach(function (key) {
          if (src[key] == null) copy[key] = null;
          else if (typeof src[key] === "number" && isFinite(src[key])) copy[key] = src[key];
          else if (typeof src[key] === "string") copy[key] = src[key].slice(0, 80);
        });
        state.edits[kind][id] = copy;
      });
    });
  }

  function loadRemoved(removed) {
    if (!removed || typeof removed !== "object") return;
    ["people", "machines"].forEach(function (kind) {
      var bucket = removed[kind];
      if (!bucket || typeof bucket !== "object") return;
      Object.keys(bucket).forEach(function (id) {
        if (bucket[id]) state.removed[kind][id] = true;
      });
    });
  }

    var people = [];
    var machines = [];

      added.people.forEach(function (item) {
        if (!item || typeof item.id !== "string" || !item.id) return;
        if (typeof item.callsign !== "string" || !item.callsign.trim()) return;
        if (!DUTY[item.duty] || !ACCOUNTING[item.accounting]) return;
        var nameParts = {
          surname: String(item.surname || "").slice(0, 80),
          givenName: String(item.givenName || "").slice(0, 80),
          patronymic: String(item.patronymic || "").slice(0, 80)
        };
        if (!nameParts.surname && !nameParts.givenName && !nameParts.patronymic) {
          nameParts = splitLegacyName(item.name || item.callsign || "");
        }
        people.push({
          id: item.id.slice(0, 40),
          surname: nameParts.surname,
          givenName: nameParts.givenName,
          patronymic: nameParts.patronymic,
          name: joinPersonName(nameParts) || String(item.name || item.callsign).slice(0, 80),

          position: String(item.position || "").slice(0, 80),
          place: String(item.place || "s1").slice(0, 40)
        });
      });
    }

          service: String(item.service || "").slice(0, 80)
        });
      });
    }
    state.added = { people: people, machines: machines };

  function icon(name) {
    var span = el("span", { className: "icon icon-" + name, attrs: { "aria-hidden": "true" } });
    span.innerHTML = ICONS[name];
    return span;
  }

  function frac(stats, size, label) {
    var node = el("span", {
      className: size === "small" ? "frac small" : "frac",
      attrs: {
        "data-plus": String(stats.plus),
        "data-total": String(stats.total),
        "aria-label": label || (stats.plus + " у строю з " + stats.total)
      }
    });
    var visual = el("span", { attrs: { "aria-hidden": "true" } });
    var num = el("span", { className: stats.plus === 0 ? "num zero" : "num", text: String(stats.plus) });
    visual.append(num, el("span", { className: "slash", text: "/" }), el("span", { className: "den", text: String(stats.total) }));
    node.append(visual);
    return node;
  }

  function pill(label, kind) {
    var wrap = label.length > 14 ? " wrap" : "";
    return el("span", { className: "pill " + kind + wrap, text: label });
  }

  function rowButton(id, main, trailing, label) {
    var open = state.open.has(id);
    var btn = el("button", {
      className: "row",
      attrs: {
        type: "button",
        "data-toggle": id,
        "aria-expanded": open ? "true" : "false",
        "aria-controls": panelDomId(id),
        "aria-label": label
      }
    });
    btn.append(icon("chev"), main);
    if (trailing) btn.append(trailing);
    return btn;
  }

  function gearButton(id, label) {
    var open = state.open.has(id);
    var btn = el("button", {
      className: "tool",
      attrs: {
        type: "button",
        "data-toggle": id,
        "aria-expanded": open ? "true" : "false",
        "aria-controls": panelDomId(id),

      }

    return btn;
  }

  function plusButton(kind) {
    var btn = el("button", {
      className: "tool",
      attrs: {
        type: "button",
        "data-add": kind,
        "aria-label": kind === "person" ? "Додати військовослужбовця" : "Додати машину"
      }
    });
    btn.append(icon("plus"));
    return btn;
  }

  function sectionTools(gearId, gearLabel, addKind) {
    var tools = el("div", { className: "block-tools" });
    if (canDelete() && addKind) tools.append(plusButton(addKind));
    tools.append(gearButton(gearId, gearLabel));
    return tools;
  }

  function field(label, value) {
    var wrap = el("div", { className: "field" });
    wrap.append(el("div", { className: "label", text: label }));
    wrap.append(el("div", { className: "value", text: value }));
    return wrap;
  }

  function renderPeopleGear() {
    var box = el("div", { className: "gear", attrs: { id: panelDomId("gear:people") } });
    box.append(el("h3", { text: "Які поля показувати" }));
    var options = [
      ["status", "Стан"],
      ["callsign", "Позивний"],
      ["name", "ПІП"],
      ["surname", "Прізвище"],
      ["givenName", "Ім’я"],
      ["patronymic", "По батькові"],
      ["rank", "Звання"],
      ["position", "Посада або умовна посада"],
      ["accounting", "Облік"],
      ["unit", "Підрозділ"]
    ];
    options.forEach(function (pair) {
      var label = el("label", { className: "check" });
      var input = el("input", {
        attrs: {
          type: "checkbox",
          "data-gear": "people",
          "data-field": pair[0]
        }
      });
      input.checked = !!state.peopleFields[pair[0]];
      label.append(input, el("span", { text: pair[1] }));
      box.append(label);
    });
    return wrapReveal(box, "gear:people");
  }

  function renderPerson(item) {
    var id = "person:" + item.id;
    var fields = state.peopleFields;
    var duty = dutyMap()[personDutyKey(item)] || null;
    var dutyName = duty ? duty.label : "";
    var main = el("span", { className: "grow" });
    var call = String(personCallsign(item) || "").trim();
    if (fields.callsign && call) main.append(el("span", { className: "call", text: call }));
    var line2 = [];
    if (fields.position) {
      var position = String(positionOf(item) || "").trim();
      if (position) line2.push(lowerUa(position));
    }
    if (fields.rank) {
      var rank = String(personRank(item) || "").trim();
      if (rank) line2.push(lowerUa(rank));
    }
    if (fields.name) {
      var pipShort = String(personPipShort(item) || "").trim();
      if (pipShort) line2.push(pipShort);
    }
    if (fields.surname) {
      var surnameShown = String(personNamePart(item, "surname") || "").trim();
      if (surnameShown) line2.push(surnameShown);
    }
    if (fields.givenName) {
      var givenShown = String(personNamePart(item, "givenName") || "").trim();
      if (givenShown) line2.push(givenShown);
    }
    if (fields.patronymic) {
      var patronymShown = String(personNamePart(item, "patronymic") || "").trim();
      if (patronymShown) line2.push(patronymShown);
    }
    if (line2.length) main.append(el("span", { className: "pname", text: line2.join(" ") }));
    var line3 = [];
    if (fields.unit) {
      var chain = personChain(item);
      if (chain) line3.push(chain);
    }
    if (fields.accounting && ACCOUNTING[personAccountingKey(item)]) line3.push(lowerUa(ACCOUNTING[personAccountingKey(item)].label));
    if (line3.length) main.append(el("span", { className: "meta", text: line3.join(" · ") }));
    if (!main.childNodes.length) main.append(el("span", { className: "call", text: call || personName(item) }));
    var trailing = fields.status && duty ? pill(duty.label, duty.plus ? "plus" : "minus") : null;
    var btn = rowButton(
      id,
      main,
      trailing,
      "Картка військовослужбовця: " + personCallsign(item) + ", " + personName(item) + (dutyName ? ", " + dutyName : "")
    );
    var frag = document.createDocumentFragment();
    frag.append(withSwipe("person", item.id, btn));
    if (state.open.has(id)) frag.append(renderPersonCard(item));
    return frag;
  }

  function textInput(id, value, extra) {
    var attrs = { id: id, type: "text", maxlength: "80", autocomplete: "off" };
    if (extra) Object.keys(extra).forEach(function (key) { attrs[key] = extra[key]; });
    var input = el("input", { attrs: attrs });
    input.value = value == null ? "" : String(value);
    return input;
  }

  function fieldEditor(label, control, wideText) {
    var wide = String(wideText || "").length > 36 ? " wide" : "";
    var wrap = el("div", { className: "field" + wide });
    wrap.append(el("label", { className: "label", text: label, attrs: { for: control.id } }));
    wrap.append(control);
    return wrap;
  }

  function inPlacePick(id, value, options, extra) {
    var known = false;
    var knownLabel = "";
    options.forEach(function (pair) {
      if (pair[0] === value) {
        known = true;
        knownLabel = pair[1];
      }
    });
    var attrs = { id: id, "data-value": known ? value : "" };
    if (extra) Object.keys(extra).forEach(function (key) { attrs[key] = extra[key]; });
    var box = el("div", { className: "pick", attrs: attrs });
    box._options = options;
    var btn = el("button", {
      className: "pick-current",
      attrs: { type: "button", "data-pick-toggle": id, "aria-expanded": "false" }
    });
    btn.append(el("span", { text: known ? knownLabel : "" }));
    box.append(btn);
    return box;
  }

  function closePick(box) {
    var list = box.querySelector(".pick-list:not(.is-closing)");
    box.classList.remove("is-open");
    var btn = box.querySelector("[data-pick-toggle]") || box.querySelector(".pick-current");
    if (btn) btn.setAttribute("aria-expanded", "false");
    if (!list) return;
    if (motionOff()) {
      list.remove();
      return;
    }
    list.classList.add("is-closing");
    list.classList.remove("is-shown");
    var finished = false;
    function finish(event) {
      if (finished) return;
      if (event && event.target !== list) return;
      finished = true;
      if (list.parentNode) list.remove();
    }
    list.addEventListener("transitionend", finish);
    setTimeout(function () { finish(); }, 280);
  }

  function placeLayer(layer, anchor) {
    var rect = anchor.getBoundingClientRect();
    var gap = 4;
    var maxH = 280;
    var below = window.innerHeight - rect.bottom - gap - 8;
    var above = rect.top - gap - 8;
    var upward = below < 160 && above > below;
    var room = Math.max(88, Math.min(maxH, upward ? above : below));
    layer.style.left = Math.max(8, rect.left) + "px";
    layer.style.width = Math.max(120, rect.width) + "px";
    layer.style.maxHeight = room + "px";
    if (upward) {
      layer.style.top = "auto";
      layer.style.bottom = (window.innerHeight - rect.top + gap) + "px";
    } else {
      layer.style.bottom = "auto";
      layer.style.top = (rect.bottom + gap) + "px";
    }
  }

  function placePickList(box) {
    var list = box.querySelector(".pick-list:not(.is-closing)");
    var btn = box.querySelector(".pick-current");
    if (!list || !btn) return;
    placeLayer(list, btn);
  }

  function placeOpenLists() {
    document.querySelectorAll(".pick.is-open").forEach(placePickList);
  }

  function closeOpenLists(target) {
    var insidePick = target && target.closest && target.closest(".pick");
    if (!insidePick) document.querySelectorAll(".pick.is-open").forEach(closePick);
  }

  function pickOption(value, label, current) {
    var opt = el("button", {
      className: "pick-option" + (value === current ? " is-current" : ""),
      attrs: { type: "button", "data-pick-value": value }
    });
    opt.textContent = label;
    return opt;
  }

  function openPick(box) {
    var current = box.getAttribute("data-value") || "";
    var list = el("div", { className: "pick-list" });
    if (box.classList.contains("duty-catalog")) {
      var kind = box.getAttribute("data-catalog-kind") || (box.id === "machine-status-list" ? "machineDuty" : box.id === "type-list" ? "type" : "duty");
      var chooseAttr = kind === "machineDuty" ? "data-choose-machine-duty" : kind === "type" ? "data-choose-type" : "data-choose-duty";
      (box._options || []).forEach(function (pair) {
        var opt = el("button", { className: "pick-option", attrs: { type: "button" } });
        opt.setAttribute(chooseAttr, pair[0]);
        opt.textContent = pair[1];
        list.append(opt);
      });
    } else if (box.classList.contains("rank-pick")) {
      list.append(pickOption("", "", current));
      if (current && !listedRank(current)) list.append(pickOption(current, current, current));
      RANK_GROUPS.forEach(function (group) {
        list.append(el("div", { className: "pick-group", text: group.label }));
        group.ranks.forEach(function (rank) { list.append(pickOption(rank, rank, current)); });
      });
    } else if (box.id === "report-switch") {
      (box._options || []).forEach(function (pair) {
        var code = pair[0];
        var label = pair[1];
        var opt = el("button", {
          className: "pick-option" + (code === current ? " is-current" : ""),
          attrs: { type: "button" }
        });
        if (code === "__general__") {
          opt.setAttribute("data-pick-value", code);
          opt.textContent = label;
        } else {
          var status = unitReportStatus(code);
          opt.append(el("span", { className: "report-name", text: label }));
          opt.append(el("span", {
            className: "sub-status is-" + status,
            text: unitReportStatusLabel(status),
            attrs: { "data-unit-status": code }
          }));
          if (status === "missing" && !canOpenUnitReport(code)) {
            opt.classList.add("is-disabled");
            opt.setAttribute("aria-disabled", "true");
            opt.setAttribute("data-report-blocked", code);
          } else {
            opt.setAttribute("data-pick-value", code);
            opt.setAttribute("data-open-unit", code);
          }
        }
        list.append(opt);
      });
    } else {
      (box._options || []).forEach(function (pair) {
        list.append(pickOption(pair[0], pair[1], current));
      });
    }
    box.append(list);
    box.classList.add("is-open");
    var btn = box.querySelector("[data-pick-toggle]") || box.querySelector(".pick-current");
    if (btn) btn.setAttribute("aria-expanded", "true");
    placePickList(box);
    if (motionOff()) list.classList.add("is-shown");
    else requestAnimationFrame(function () { list.classList.add("is-shown"); });
  }

  function togglePick(id) {
    var box = document.getElementById(id);
    if (!box) return;
    var willOpen = !box.classList.contains("is-open");
    document.querySelectorAll(".pick.is-open").forEach(closePick);
    if (willOpen) openPick(box);
  }

  function choosePick(box, value) {
    if (box.id === "report-switch") {
      openReportChoice(value);
      return;
    }
    if (box.classList.contains("is-locked")) {
      closePick(box);
      return;
    }
    var label = "";
    (box._options || []).forEach(function (pair) {
      if (pair[0] === value) label = pair[1];
    });
    box.setAttribute("data-value", value);
    var shown = box.querySelector(".pick-current span");
    if (shown) shown.textContent = label;
    closePick(box);
    if (!applyDraftField(box)) rememberPending(box);
  }

  function editAttrs(kind, id, fieldName) {
    return { "data-edit-kind": kind, "data-edit-id": id, "data-edit-field": fieldName };
  }

  function rankPick(id, value, extra) {
    var raw = String(value || "");
    var known = listedRank(raw);
    var selected = known || raw;
    var options = [["", ""]];
    if (raw && !known) options.push([raw, raw]);
    RANK_GROUPS.forEach(function (group) {
      group.ranks.forEach(function (rank) { options.push([rank, rank]); });
    });
    var box = inPlacePick(id, selected, options, extra);
    box.classList.add("rank-pick");
    return box;
  }

  function iconButton(iconName, label, attrs) {
    var all = { type: "button", "aria-label": label };
    if (attrs) Object.keys(attrs).forEach(function (key) { all[key] = attrs[key]; });
    var btn = el("button", { className: "tool tool-" + iconName, attrs: all });
    btn.append(icon(iconName));
    return btn;
  }

  function isEditing(kind, id) {
    return state.editing === kind + ":" + id;
  }

  function pendingValue(kind, id, field, fallback) {
    var key = kind + ":" + id;
    if (state.pending && state.pending.key === key && Object.prototype.hasOwnProperty.call(state.pending.fields, field)) {
      return state.pending.fields[field];
    }
    return fallback;
  }

  function lockControl(node, editable) {
    if (node.classList && node.classList.contains("pick")) {
      if (editable) node.classList.remove("is-locked");
      else node.classList.add("is-locked");
      return node;
    }
    node.disabled = !editable;
    return node;
  }

  function cardIconRow(kind, id, draftMode) {
    var row = el("span", { className: "card-actions" });
    if (canDelete()) {
      if (draftMode) row.append(iconButton("x", "Видалити", { "data-discard-draft": "1" }));
      else row.append(iconButton("x", "В архів", { "data-remove": kind + ":" + id }));
    }
    row.append(iconButton("check", "Зберегти", { "data-save-card": draftMode ? "draft" : kind + ":" + id }));
    row.append(iconButton("pencil", "Редагувати", { "data-edit-card": draftMode ? "draft" : kind + ":" + id }));
    return row;
  }

  function cardHead(title, kind, id, draftMode) {
    var head = el("div", { className: "card-head" });
    head.append(el("h3", { text: title }));
    head.append(cardIconRow(kind, id, draftMode));
    return head;
  }

  function withSwipe(kind, id, button) {
    if (!canDelete()) return button;
    var wrap = el("div", { className: "swipe-row" });
    wrap.append(button);
    var del = iconButton("x", "В архів", { "data-remove": kind + ":" + id });
    del.classList.add("swipe-delete");
    wrap.append(del);
    return wrap;
  }

  function renderPersonCard(item, draftMode) {
    var dutyKey = draftMode ? (item.duty || "in") : pendingValue("person", item.id, "duty", personDutyKey(item));
    var editable = !!draftMode || isEditing("person", item.id);
    var card = el("article", { className: "card" + (editable ? " is-editing" : ""), attrs: { id: panelDomId("person:" + item.id) } });
    card.append(cardHead("Картка військовослужбовця", "person", item.id, draftMode));
    if (!draftMode && state.confirm && state.confirm.kind === "person" && state.confirm.id === item.id) card.append(renderConfirmBox());
    var parts = draftMode
      ? { surname: item.surname || "", givenName: item.givenName || "", patronymic: item.patronymic || "" }
      : personNameParts(item);
    if (draftMode && !parts.surname && !parts.givenName && !parts.patronymic && item.name) {
      parts = splitLegacyName(item.name);
    }
    var surname = draftMode ? (parts.surname || "") : pendingValue("person", item.id, "surname", parts.surname);
    var givenName = draftMode ? (parts.givenName || "") : pendingValue("person", item.id, "givenName", parts.givenName);
    var patronymic = draftMode ? (parts.patronymic || "") : pendingValue("person", item.id, "patronymic", parts.patronymic);
    var rank = draftMode ? (item.rank || "") : pendingValue("person", item.id, "rank", personRank(item));
    var unit = draftMode ? (item.unit || "") : pendingValue("person", item.id, "unit", personUnit(item));
    var call = draftMode ? (item.callsign || "") : pendingValue("person", item.id, "callsign", personCallsign(item));
    card.append(fieldEditor("Прізвище", lockControl(textInput("surname-" + item.id, surname, draftMode ? { "data-draft-field": "surname" } : editAttrs("person", item.id, "surname")), editable)));
    card.append(fieldEditor("Ім’я", lockControl(textInput("given-" + item.id, givenName, draftMode ? { "data-draft-field": "givenName" } : editAttrs("person", item.id, "givenName")), editable)));
    card.append(fieldEditor("По батькові", lockControl(textInput("patronym-" + item.id, patronymic, draftMode ? { "data-draft-field": "patronymic" } : editAttrs("person", item.id, "patronymic")), editable)));
    card.append(fieldEditor("Звання", lockControl(rankPick("rank-" + item.id, rank, draftMode ? { "data-draft-field": "rank" } : editAttrs("person", item.id, "rank")), editable)));
    card.append(fieldEditor("Підрозділ", lockControl(textInput("unitp-" + item.id, unit, draftMode ? { "data-draft-field": "unit" } : editAttrs("person", item.id, "unit")), editable)));
    card.append(fieldEditor("Позивний", lockControl(textInput("call-" + item.id, call, draftMode ? { "data-draft-field": "callsign" } : editAttrs("person", item.id, "callsign")), editable)));
    var post = el("div", { className: "field" });
    var postLabel = el("label", { className: "label", text: "Посада або умовна посада", attrs: { for: "post-" + item.id } });
    var postAttrs = {
      id: "post-" + item.id,
      type: "text",
      maxlength: "80",
      autocomplete: "off",
      placeholder: "Ще не вписано"
    };
    if (draftMode) postAttrs["data-draft-field"] = "position";
    else postAttrs["data-position-for"] = item.id;
    var input = el("input", { attrs: postAttrs });
    input.value = draftMode ? (item.position || "") : pendingValue("person", item.id, "position", positionOf(item));
    lockControl(input, editable);
    post.append(postLabel, input);
    card.append(post);
    var dutyOptions = Object.keys(dutyMap()).map(function (key) {
      return [key, dutyMap()[key].label];
    });
    card.append(fieldEditor("Стан", lockControl(inPlacePick("duty-" + item.id, dutyKey, dutyOptions, draftMode ? { "data-draft-field": "duty" } : editAttrs("person", item.id, "duty")), editable)));

  function renderReportSwitch() {
    if (!reportSwitchVisible()) return null;
    var root = reportRootCode();
    var options = [["__general__", "Загальний звіт"]];
    subordinatesFor(root).forEach(function (unit) {
      if (!unit) return;
      options.push([unit.code, unit.name]);
    });
    var current = currentReportValue();
    var known = options.some(function (pair) { return pair[0] === current; });
    if (!known) current = "__general__";
    var pick = inPlacePick("report-switch", current, options);
    pick.classList.add("report-switch");
    var shown = pick.querySelector(".pick-current span");
    if (shown) {
      shown.id = "open-report";
      shown.textContent = currentReportLabel();
    }
    return pick;
  }

  // ZS-110/113: bar лише поки йде sync; width анімується між кроками (rAF після remount).
  var driveProgressPaintPct = 0;

  function setDriveProgress(step, total) {
    if (step == null || !(total > 0)) {
      state.driveProgress = null;
      return;
    }
    var n = Number(step);
    var t = Number(total);
    if (!(n >= 0) || !(t > 0)) {
      state.driveProgress = null;
      return;
    }
    state.driveProgress = { step: n, total: t };
  }

  function clearDriveProgress() {
    state.driveProgress = null;
    driveProgressPaintPct = 0;
  }

  function renderDriveProgressBar() {
    if (!state.driveProgress || !(state.driveProgress.total > 0)) return null;
    // Крок 0 = ще лише «Відкриваю Google» — bar з’являється з першого sync-кроку.
    if (!(Number(state.driveProgress.step) > 0)) return null;
    var pct = Math.round((Number(state.driveProgress.step) / Number(state.driveProgress.total)) * 100);
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    var from = driveProgressPaintPct;
    if (!(from >= 0)) from = 0;
    if (from > 100) from = 100;
    var bar = el("div", {
      className: "drive-progress",
      attrs: {
        role: "progressbar",
        "aria-valuemin": "0",
        "aria-valuemax": "100",
        "aria-valuenow": String(pct),
        "aria-label": "Прогрес синхронізації",
        "data-drive-progress": "1"
      }
    });
    var fill = el("div", { className: "drive-progress-fill" });
    fill.style.width = from + "%";
    bar.append(fill);
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          fill.style.width = pct + "%";
          driveProgressPaintPct = pct;
        });
      });
    } else {
      fill.style.width = pct + "%";
      driveProgressPaintPct = pct;
    }
    return bar;
  }

  // ZS-111: технічні підписи sync ховаємо; лишаємо помилки/дії + progress bar.
  function isVisibleDriveNote(note) {
    var text = String(note || "").trim();
    if (!text) return false;
    if (/^Впишіть код доступу/.test(text)) return true;
    if (/^Вхід не підтверджено/.test(text)) return true;
    if (/^Мережа не відповіла/.test(text)) return true;
    if (/^Вікно Google не відкрилось/.test(text)) return true;
    if (/^Google не відкриває вхід/.test(text)) return true;
    return false;
  }

  function appendDriveSyncStatus(parent) {
    if (!parent) return;
    if (isVisibleDriveNote(state.driveNote)) {
      parent.append(el("p", { className: "hint", text: state.driveNote, attrs: { "data-drive-note": "1" } }));
    }
    var bar = renderDriveProgressBar();
    if (bar) parent.append(bar);
  }

  function renderWideAccess() {
    var section = el("section", { className: "block unit-create wide-access", attrs: { id: "wide-access", "aria-labelledby": "wide-access-title" } });
    section.append(el("h2", { text: "Штат і доступ", attrs: { id: "wide-access-title" } }));
    var people = staffPeopleList();
    var machines = staffMachinesList();
