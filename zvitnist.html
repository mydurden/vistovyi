<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2820">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <title>Вістовий</title>
  <style>
:root {
  --bg: #e7e1d6;
  --paper: #fbf8f3;
  --ink: #1b1915;
  --muted: #4a453c;
  --line: #ddd4c6;
  --green: #0e6840;
  --green-ink: #0c4f31;
  --green-soft: #e6f3ec;
  --clay: #8c3b2e;
  --clay-ink: #6d2e23;
  --clay-soft: #f8ece8;
  --header: #1a2820;
  --header-ink: #f4f0e7;
  --header-muted: #d5cec3;
  --amber-soft: #f4efe4;
  --amber-ink: #5c4a2e;
  --red: #9b3228;
  --red-ink: #7a271f;
  --red-soft: #f7e8e5;
  --done-soft: #eceae6;
  --done-ink: #3e3a34;
  --today: #2f6fed;
  --today-soft: #dce8fb;
  --today-ink: #1a4fbf;
  --shadow: 0 1px 2px rgba(27, 25, 21, 0.05), 0 12px 28px rgba(27, 25, 21, 0.05);
  --radius: 16px;
  color-scheme: light;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
}

button, input { font: inherit; color: inherit; }

button { cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

.skip {
  position: absolute;
  left: 12px;
  top: -48px;
  z-index: 3;
  background: #fff;
  color: var(--ink);
  padding: 8px 12px;
  border-radius: 8px;
}

.skip:focus { top: 8px; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.top {
  background: var(--header);
  color: var(--header-ink);
  overflow: visible;
}

.wrap {
  width: min(720px, 100%);
  margin: 0 auto;
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
}

.top .wrap { padding-top: 6px; padding-bottom: 12px; }

h1 {
  margin: 0;
  font-size: 1.35rem;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-row h1 {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
}

.title-row h1[data-sync-drive] {
  cursor: pointer;
}

.title-mark {
  display: block;
  height: 42px;
  width: auto;
}


.title-row .tool { color: var(--header-ink); }

.field-label {
  display: block;
  margin-bottom: 4px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.top .field-label { color: var(--header-muted); }

.primary {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  border-radius: 12px;
  background: #f4f0e7;
  color: var(--header);
  font-weight: 700;
}

.now, .hint, .error, .gloss, .saved, .limit {
  margin: 6px 0 0;
}

.top .now, .top .hint { color: var(--header-muted); font-size: 0.92rem; }

.drive-progress {
  height: 4px;
  margin: 8px 0 0;
  border-radius: 999px;
  overflow: hidden;
  background: var(--line);
}

.drive-progress-fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--green);
  transition: width 0.2s linear;
}

.top .drive-progress {
  background: rgba(244, 240, 231, 0.22);
}

.top .drive-progress-fill {
  background: var(--header-muted);
}

.top .error { color: #ffd2c8; font-size: 0.92rem; margin: 8px 0 0; }

.top .report-switch {
  display: block;
  visibility: visible;
  opacity: 1;
  height: auto;
  max-height: none;
  overflow: visible;
  margin: 12px 0 0;
}

.top .report-switch .pick-current,
.top .report-switch .pick-list,
.top .report-switch .pick-option {
  background: var(--paper);
  color: var(--ink);
}

.top .report-switch .pick-current {
  display: block;
  visibility: visible;
  opacity: 1;
  width: 100%;
  min-height: 44px;
  overflow-wrap: anywhere;
  font-weight: 700;
}

.top .report-switch .pick-option.is-current { background: #fff; }

.top .report-switch .pick-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.top .report-switch .pick-option.is-disabled {
  opacity: 0.72;
  cursor: default;
}

.top .report-switch .report-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
}

.sub-status {
  flex: 0 1 auto;
  font-size: 0.86rem;
  font-weight: 700;
  line-height: 1.25;
  text-align: right;
  overflow-wrap: anywhere;
}

.sub-status.is-received { color: var(--clay); }
.sub-status.is-missing { color: var(--red); }
.sub-status.is-merged { color: var(--green); }

.pick-current-edit {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 0 4px 0 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}

.pick-current-edit input[type="text"] {
  flex: 1 1 auto;
  width: 1%;
  min-width: 0;
  min-height: 40px;
  margin: 0;
  padding: 8px 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  font: inherit;
  font-size: 16px;
}

.pick-current-edit .pick-toggle {
  flex: 0 0 auto;
  width: 40px;
  min-width: 40px;
  height: 40px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 1.1rem;
  line-height: 1;
}

.duty-combo {
  display: block;
  width: 100%;
  margin-top: 4px;
}

.duty-combo .pick-current-edit {
  display: flex;
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--line);
  background: #fff;
}

.duty-combo.is-open .pick-current-edit {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.changes-empty { margin: 4px 0 8px; font-weight: 700; }

.day-nav { padding-top: 10px; padding-bottom: 6px; }
.day-nav-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 44px;
}
.day-nav-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 44px;
  min-width: 44px;
  min-height: 44px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  line-height: 0;
}
.day-nav-arrow:active { background: var(--amber-soft); }
.day-nav-date {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 6px 8px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  font-weight: 700;
  text-align: center;
  line-height: 1.25;
}
.day-nav-date:active { background: var(--amber-soft); }
.day-nav-date .day-nav-weekday {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 700;
}

.calendar-month {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 4px 0 12px;
}
.calendar-month h3 {
  margin: 0;
  flex: 1 1 auto;
  text-align: center;
  font-size: 1.05rem;
}
.calendar-weekdays,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
.calendar-weekdays span {
  text-align: center;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  padding: 4px 0;
}
.calendar-day {
  min-height: 40px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #9a9286;
  font-weight: 700;
}
.calendar-day.has-report {
  background: var(--header);
  color: var(--header-ink);
}
.calendar-day.is-empty {
  background: #ece7de;
  color: #8a8378;
}
.calendar-day.is-muted {
  opacity: 0.35;
}
.calendar-day.is-selected {
  outline: 2px solid var(--green);
  outline-offset: 1px;
}
.calendar-day.is-today {
  background: var(--today-soft);
  color: var(--today-ink);
  box-shadow: inset 0 0 0 2px var(--today);
}
.calendar-day.is-today.has-report {
  background: var(--today);
  color: #f4f8ff;
  box-shadow: none;
}
.calendar-day.is-today.is-selected {
  outline-color: var(--today);
}
.calendar-day:active { opacity: 0.85; }

.overlay-sheet.is-compact {
  min-height: 0;
  width: min(100%, 420px);
  margin-top: 12vh;
  padding-bottom: 20px;
  border-radius: 16px;
}

main.wrap {
  padding-top: 12px;
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
}

.block {
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 12px 4px;
  margin: 0 0 8px;
}

.block-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.block-tools {
  display: flex;
  align-items: center;
  margin-left: auto;
}

h2 {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.2;
  font-weight: 700;
}

.frac {
  display: flex;
  align-items: baseline;
  gap: 1px;
  margin: 6px 0 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
}

.frac .num, .frac .den {
  font-weight: 700;
  font-size: 2rem;
}

.frac .num { color: var(--green); }
.frac .num.zero { color: var(--clay); }
.frac .slash { color: var(--muted); font-size: 1.45rem; margin: 0 1px; font-weight: 600; }

.frac.small { margin: 0; flex: 0 0 auto; }
.frac.small .num, .frac.small .den { font-size: 1.05rem; }
.frac.small .slash { font-size: 0.95rem; }

.gloss { color: var(--muted); font-size: 0.92rem; margin: 4px 0 4px; }

.tool {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  appearance: none;
  color: var(--ink);
  line-height: 0;
}

.icon-gear svg,
.icon-plus svg,
.icon-copy svg,
.icon-x svg,
.icon-check svg,
.icon-pencil svg,
.icon-profile svg,
.icon-left svg,
.icon-right svg { width: 36px; height: 36px; }
.tool-profile {
  height: auto;
  min-height: 0;
  width: auto;
  min-width: 0;
}
.tool-profile img { display: block; height: 42px; width: auto; }

.tool-x { color: var(--clay); }
.tool-check { color: var(--green); }
.tool-pencil { color: var(--ink); }

.card-actions { display: flex; flex: 0 0 auto; align-items: center; }

.name-row {
  display: flex;
  align-items: center;
  min-width: 0;
}

.name-row > input[type="text"] {
  flex: 1 1 auto;
  width: 1%;
  min-width: 0;
  margin-top: 4px;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: rgba(26, 40, 32, 0.5);
  overflow: auto;
  padding: 8px;
}

.overlay-sheet {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: calc(100vh - 16px);
  margin: 0 auto;
  background: var(--paper);
  padding: 8px 12px 32px;
}

.pull-bar {
  width: 44px;
  height: 6px;
  margin: 2px auto 10px;
  border-radius: 999px;
  background: var(--line);
  touch-action: none;
}

.overlay-sheet .card {
  border: 0;
  background: var(--paper);
  margin: 0;
  padding: 4px 0 12px;
  border-radius: 0;
}

.swipe-row {
  position: relative;
  overflow: hidden;
}

.swipe-delete {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  height: auto;
  width: 52px;
  min-width: 52px;
  transform: translateX(110%);
}

.swipe-row.revealed > .row { transform: translateX(-52px); }
.swipe-row.revealed .swipe-delete { transform: none; }

.icon { display: inline-flex; flex: 0 0 auto; }
.icon svg { display: block; }
.icon-chev { color: var(--muted); transition: transform 0.15s ease; }
[aria-expanded="true"] > .icon-chev { transform: rotate(90deg); }

.row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  padding: 7px 2px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
  touch-action: manipulation;
}

.row:active { background: rgba(26, 40, 32, 0.04); }

.grow { flex: 1 1 auto; min-width: 0; }
.call { display: block; font-weight: 700; overflow-wrap: break-word; }
.pname, .meta { display: block; color: var(--muted); font-size: 0.92rem; overflow-wrap: break-word; }
.inline-hint { color: var(--muted); font-weight: 500; }

.pill {
  flex: 0 0 auto;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  white-space: nowrap;
}

.pill.wrap {
  white-space: normal;
  max-width: 8.5rem;
}

.pill.plus { background: var(--green-soft); color: var(--green-ink); }
.pill.minus { background: var(--clay-soft); color: var(--clay-ink); }
.pill.planned { background: var(--amber-soft); color: var(--amber-ink); }
.pill.doing { background: var(--green-soft); color: var(--green-ink); }
.pill.done { background: var(--done-soft); color: var(--done-ink); }
.pill.link-person { background: #e7eefc; color: #1a4fbf; }
.pill.link-machine { background: var(--green-soft); color: var(--green-ink); }
.pill.link-task { background: var(--amber-soft); color: var(--amber-ink); }

.events .event-item {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 8px;
}
.events .event-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  text-align: left;
  font: inherit;
  color: inherit;
}
.events .event-row.is-open { border-color: #1a4fbf; }
.events .event-main { flex: 1 1 auto; min-width: 0; }
.events .event-time {
  display: inline-block;
  min-width: 3.2rem;
  font-weight: 700;
  margin-right: 8px;
}
.events .event-desc { font-weight: 500; overflow-wrap: break-word; }
.events .event-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.events .event-tools { display: flex; gap: 4px; flex: 0 0 auto; }
.events .event-panel {
  margin: 0 0 12px;
  padding: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
}
.events .event-panel textarea {
  width: 100%;
  min-height: 4.5rem;
  resize: vertical;
  font: inherit;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}
.events .event-pick {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  max-height: 12rem;
  overflow: auto;
}
.events .event-pick button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  font: inherit;
  color: inherit;
}
.events .event-pick button:last-child { border-bottom: 0; }
.events .event-add-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.panel {
  margin: 0 0 8px 10px;
  padding-left: 8px;
  border-left: 2px solid var(--line);
}

.gear, .card, .short, .glossary {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.gear, .short { margin: 4px 0 8px; padding: 10px 12px; }

.gear h3, .card h3, .glossary summary {
  margin: 0 0 6px;
  font-size: 1rem;
}

.gear label, .check {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  min-height: 36px;
  padding: 4px 0;
}

.check input { width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; flex: 0 0 auto; }

.card { margin: 4px 0 8px; padding: 12px; }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-width: 0;
}

.card-head h2,
.card-head h3 {
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
  line-height: 1.2;
}

.card-head-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  min-width: 0;
}

.profile-build {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.2;
}

.card input:disabled,
.card select:disabled {
  color: var(--ink);
  opacity: 1;
}

.machine-card .card-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 10px;
  row-gap: 8px;
  margin-top: 8px;
}

.machine-card .card-fields .field {
  margin: 0;
  min-width: 0;
}

.machine-card .card-fields .field.wide {
  grid-column: 1 / -1;
}

.field { margin: 0 0 10px; }
.field .label, .card .label { color: var(--muted); font-size: 0.82rem; font-weight: 700; }
.field .value { font-size: 1rem; overflow-wrap: anywhere; }

button.count-toggle {
  display: block;
  width: auto;
  max-width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 6px 0;
  border: 0;
  background: transparent;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 0.18em;
  touch-action: manipulation;
}

.card input[type="text"],
.card select,
.unit-create input[type="text"],
.unit-create select {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 44px;
  margin-top: 4px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-size: 16px;
}

.card input[type="text"]:disabled,
.card select:disabled {
  background: var(--paper);
  color: var(--ink);
}

.card.is-editing {
  background: var(--paper);
}

.card.is-editing input[type="text"],
.card.is-editing select {
  background: #fff;
  color: var(--ink);
}

.card .name-row > input[type="text"] {
  flex: 1 1 auto;
  width: 1%;
  min-width: 0;
}

.unit-create .label,
.archive .label { display: block; margin-top: 8px; font-weight: 700; }

.wide-access .label { display: block; margin-top: 8px; font-weight: 700; }

.wide-access .check {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 6px;
  font-size: 16px;
}

.wide-access .check input {
  margin-top: 3px;
  flex: 0 0 auto;
}

.wide-access select.access-user,
.wide-access input.for-whom,
.wide-access input.access-day {
  display: block;
  width: 100%;
  max-width: 100%;
  min-height: 44px;
  margin-top: 4px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-size: 16px;
}

.wide-access .issue,
.wide-access .mode-btn,
.wide-access .fields-btn {
  display: block;
  width: 100%;
  min-height: 44px;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-weight: 700;
}

  function syncRemovedFlagsFromCards() {

  // Живий екран ← картки за обраний день (завдання не чіпаємо; дерево підрозділів лишається).
  function findUnitTreeNode(root, id) {
    if (!root || id == null || id === "") return null;
    var want = String(id);
    if (want === "root" && root.id) want = String(root.id);
    function walk(node) {
      if (!node) return null;
      if (String(node.id) === want) return node;
      var kids = Array.isArray(node.children) ? node.children : [];
      var i;
      for (i = 0; i < kids.length; i++) {
        var found = walk(kids[i]);
        if (found) return found;
      }
      return null;
    }
    return walk(root);
  }

  // ZS-146: після flatten sync place може лишитись на зниклій гілці — перенести на живий вузол / root.
  function remapPeopleCardPlacesToLiveTree() {
    ensureCardStores();
    var root = state.report && state.report.unit;
    if (!root) return;
    var rootId = root.id || "root";
    Object.keys(state.peopleCards || {}).forEach(function (id) {
      var card = state.peopleCards[id];
      if (!card || card.archived) return;
      var place = card.place != null && card.place !== "" ? String(card.place) : rootId;
      if (place === "root") place = rootId;
      if (findUnitTreeNode(root, place)) {
        card.place = place;
        return;
      }
      card.place = rootId;
    });
  }

  function projectCardsToLiveDay() {
    ensureCardStores();
    var day = state.viewDay || todayISO();
    if (!state.report) state.report = sampleReportDocument();
    remapPeopleCardPlacesToLiveTree();
    var unit = cloneData(state.report.unit || { id: "root", name: state.report.name || "" });
    if (!unit.id) unit.id = "root";
    function clearPeople(node) {
      if (!node || typeof node !== "object") return;
      var kids = Array.isArray(node.children) ? node.children : [];
      // У вузлів із дітьми people прибираємо зовсім — інакше renderPeople не малює дерево (порожній [] truthy).
      if (kids.length) delete node.people;
      else node.people = [];
      kids.forEach(clearPeople);
    }
    clearPeople(unit);
    var orphanPeople = [];
    Object.keys(state.peopleCards).forEach(function (id) {
      var card = state.peopleCards[id];
      if (!card || card.archived || !cardBelongsHere(card)) return;
      if (!card.days || !card.days[day]) return;
      var person = personItemFromCard(card, day);
      var place = card.place || person.place || unit.id;
      if (place === "root") place = unit.id;
      var node = findUnitTreeNode(unit, place);
      // ZS-146: немає вузла place (flatten) — на root, не мовчки ховати.
      if (!node) {
        card.place = unit.id;
        place = unit.id;
        node = unit;
      }
      // Не садити людей на гілку з дітьми — інакше зникає дерево в UI.
      if (Array.isArray(node.children) && node.children.length) {
        person.place = node.id;
        orphanPeople.push(person);
        return;
      }
      if (!Array.isArray(node.people)) node.people = [];
      node.people.push(person);
    });
    if (Array.isArray(unit.children) && unit.children.length) delete unit.people;
    var machines = [];
    Object.keys(state.machineCards).forEach(function (id) {
      var card = state.machineCards[id];
      if (!card || card.archived || !cardBelongsHere(card)) return;
      if (!card.days || !card.days[day]) return;
      machines.push(machineItemFromCard(card, day));

    state.report.unit = unit;
    state.report.machines = machines;

  // Overlay added/edits/removed → картки поточного дня.

        state.machineCards[machine.id].archivedAt = null;
      }

  function mergeIncomingCards(kind, incoming) {
    ensureCardStores();
    var store = kind === "machine" ? state.machineCards : state.peopleCards;
    if (!incoming || typeof incoming !== "object") return;
    Object.keys(incoming).forEach(function (id) {
      var src = incoming[id];
      if (!src || !src.id) return;
      var cur = store[id];
      if (!cur) {
        store[id] = cloneData(src);

        return;
      }
      if (!cur.days) cur.days = {};

  // Міграція зі старих day-зрізів + знімків peopleCards/machineCards.
  function migrateSlicesToCards(rawSnap) {
    ensureCardStores();
    if (rawSnap && rawSnap.peopleCards) mergeIncomingCards("person", rawSnap.peopleCards);
    if (rawSnap && rawSnap.machineCards) mergeIncomingCards("machine", rawSnap.machineCards);
    var archivedPeople = state.removed && state.removed.people ? state.removed.people : {};
    var archivedMachines = state.removed && state.removed.machines ? state.removed.machines : {};
    var liveDay = state.viewDay || state.fileDay || todayISO();
    if (state.report) {
      (function ingestTree(node, day) {
        if (!node || typeof node !== "object") return;
        (Array.isArray(node.people) ? node.people : []).forEach(function (person) {
          if (!person || !person.id) return;
          var row = cloneData(person);
          row.place = node.id || "root";
          ingestPeopleListForDay(day, [row], archivedPeople);
        });
        (Array.isArray(node.children) ? node.children : []).forEach(function (child) {
          ingestTree(child, day);
        });
      })(state.report.unit, liveDay);
      ingestMachinesListForDay(liveDay, state.report.machines || [], archivedMachines);
    }
    (state.added && state.added.people || []).forEach(function (person) {
      if (!person || !person.id) return;
      ingestPeopleListForDay(liveDay, [person], archivedPeople);
    });
    (state.added && state.added.machines || []).forEach(function (machine) {
      if (!machine || !machine.id) return;
      ingestMachinesListForDay(liveDay, [machine], archivedMachines);
    });
    Object.keys(state.daysArchive || {}).forEach(function (day) {
      var slice = state.daysArchive[day];
      if (!slice) return;
      ingestPeopleListForDay(day, flattenPeopleFromUnit(slice.unit), archivedPeople);
      ingestMachinesListForDay(day, slice.machines || [], archivedMachines);
    });
    if (rawSnap && rawSnap.days && typeof rawSnap.days === "object") {
      Object.keys(rawSnap.days).forEach(function (day) {
        var slice = rawSnap.days[day];
        if (!slice) return;
        ingestPeopleListForDay(day, flattenPeopleFromUnit(slice.unit), {});
        ingestMachinesListForDay(day, slice.machines || [], {});
      });
    }
    if (rawSnap && rawSnap.unit) {
      var snapDay = rawSnap.day && /^\d{4}-\d{2}-\d{2}$/.test(rawSnap.day) ? rawSnap.day : liveDay;
      ingestPeopleListForDay(snapDay, flattenPeopleFromUnit(rawSnap.unit), {});
      ingestMachinesListForDay(snapDay, rawSnap.machines || [], {});
    }
    Object.keys(archivedPeople).forEach(function (id) {
      if (!archivedPeople[id] || !state.peopleCards[id]) return;
      state.peopleCards[id].archived = true;
      state.peopleCards[id].archivedAt = (state.removedAt && state.removedAt.people && state.removedAt.people[id]) || state.peopleCards[id].archivedAt || stampNow();
    });
    Object.keys(archivedMachines).forEach(function (id) {
      if (!archivedMachines[id] || !state.machineCards[id]) return;
      state.machineCards[id].archived = true;
      state.machineCards[id].archivedAt = (state.removedAt && state.removedAt.machines && state.removedAt.machines[id]) || state.machineCards[id].archivedAt || stampNow();
    });
    // ZS-146: після ingest зі старим place на зниклій гілці — remap на живе дерево.
    remapPeopleCardPlacesToLiveTree();
    syncRemovedFlagsFromCards();
  }

  // Зріз дня для архіву/Drive: о/с і ОВТ з карток; завдання — як були.
  function daySliceFromCards(day, tasks, changes, events) {
    ensureCardStores();
    remapPeopleCardPlacesToLiveTree();
    var unit = state.report && state.report.unit
      ? cloneData(state.report.unit)
      : { id: "root", name: (state.report && state.report.name) || "" };
    if (!unit.id) unit.id = "root";
    function clearPeople(node) {

      if (kids.length) delete node.people;

    Object.keys(state.peopleCards).forEach(function (id) {

      if (!card || card.archived || !cardBelongsHere(card) || !card.days || !card.days[day]) return;
      var person = personItemFromCard(card, day);

  // Знімок дня з накладками added/edits (без зміни живого state).
  function buildBakedDayParts() {
    var report = state.report || sampleReportDocument();
    var unit = cloneData(report.unit || { id: "root", name: "", people: [] });
    var nodes = {};
    var collected = [];
    function strip(node) {
      nodes[node.id] = node;
      (node.people || []).forEach(function (item) {

      node.people = Array.isArray(node.people) ? [] : node.people;
      (node.children || []).forEach(strip);
    }
    strip(unit);
    function putPerson(item, placeHint, editUnit) {
      if (!item || !item.id || state.removed.people[item.id]) return;
      var place = placeHint || unit.id;
      if (editUnit != null) {
        var moved = placeFromUnitInTree(unit, editUnit);
        if (moved) place = moved;

      state.added = saved.added;
      state.positions = saved.positions;
      state.changes = saved.changes;
      state.report = saved.report;
      state.daysArchive = saved.daysArchive ? cloneData(saved.daysArchive) : {};
      state.fileDay = saved.fileDay || todayISO();
      state.viewDay = saved.viewDay || state.fileDay;
      // ZS-122: посіяти живий день з report, якщо архів порожній.
      var liveDay = state.fileDay || state.viewDay || todayISO();
      var seeded = daySliceFromReportOrArchive(state.report, state.daysArchive, liveDay, state.changes);
      if (daySliceHasReport(seeded)) state.daysArchive[liveDay] = seeded;
      migrateSlicesToCards();
      ensureDayRollover();
      projectCardsToLiveDay();
      return;
    }
    freshOverlays();
    state.daysArchive = {};
    state.fileDay = todayISO();
    state.viewDay = state.fileDay;
    if (key === "lead") {
      state.report = state.sampleReport || sampleReportDocument();
      migrateSlicesToCards();
      projectCardsToLiveDay();
      return;
    }
    var unit = findUnitByCode(key);
    var loaded = readSiblingJson(reportFileName(key));
    if (loaded && loaded.unit && Array.isArray(loaded.machines)) {
      state.report = applyUnitSnapshot(loaded, key) || loaded;
      loadDaysFromSnapshot(loaded);
      migrateSlicesToCards(loaded);
      projectCardsToLiveDay();
      return;
    } else {
      state.report = emptyUnitReport(unit || { name: String(key), code: String(key) });
      migrateSlicesToCards();
      projectCardsToLiveDay();
      return;
    }
  }

  function writeReportProof(doc) {

    if (typeof require === "function") {

        require("fs").writeFileSync("/tmp/" + reportFileName(doc.code), json);
      } catch (err) {}
    }
    return json;
  }

  function downloadReport(name, json) {
    if (typeof document === "undefined" || typeof URL === "undefined" || typeof Blob === "undefined") return;
    try {
      var blob = new Blob([json], { type: "application/json" });
      var link = el("a", { attrs: { href: URL.createObjectURL(blob), download: name } });
      document.body.append(link);
      link.click();
      link.remove();
    } catch (err) {}
  }

  function offerReportFile(doc) {
    var json = JSON.stringify(doc, null, 2);
    var name = reportFileName(doc.code);
    writeReportProof(doc);
    if (state.dirHandle && state.dirHandle.getFileHandle) {
      state.dirHandle.getFileHandle(name, { create: true }).then(function (handle) {
        return handle.createWritable();
      }).then(function (stream) {
        return stream.write(json).then(function () { return stream.close(); });
      }).then(function () {
        state.fileNote = false;
        render();
      }).catch(function () {
        downloadReport(name, json);
        state.fileNote = true;
        render();
      });
      return;
    }
    downloadReport(name, json);
    state.fileNote = true;
  }

  function rememberOpen(code) {
    if (typeof location === "undefined" || typeof history === "undefined") return;
    var next = "#" + encodeURIComponent(code);
    if (location.hash === next) return;
    try {
      history.replaceState(null, "", location.pathname + location.search + next);
    } catch (err) {}
  }

  function codeFromHash() {
    if (typeof location === "undefined" || !location.hash) return "";
    var raw = location.hash.slice(1);
    try { return decodeURIComponent(raw); } catch (err) { return raw; }
  }

  function loadDrivePrefs() {
    try {
      if (typeof localStorage === "undefined") return;
      var raw = localStorage.getItem(DRIVE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data || typeof data !== "object") return;
      if (typeof data.driveFolder === "string") state.driveFolder = data.driveFolder.slice(0, 240);
      if (typeof data.driveEncryptKey === "string") state.driveEncryptKey = data.driveEncryptKey.slice(0, 500);
      if (typeof data.driveGoogleEmail === "string") state.driveGoogleEmail = data.driveGoogleEmail.slice(0, 120);
      if (typeof data.reportRoot === "string") state.reportRoot = data.reportRoot.slice(0, 80);
      if (Array.isArray(data.units)) {
        var nextUnits = [];
        data.units.forEach(function (item) {
          if (!item || typeof item.code !== "string" || !item.code.trim()) return;
          nextUnits.push({
            id: String(item.id || ("u" + nextUnits.length)).slice(0, 40),
            name: String(item.name || "Підрозділ").slice(0, 80),
            code: String(item.code).trim().slice(0, 80),
            parent: String(item.parent || "").slice(0, 80)
          });
        });
        state.units = nextUnits;
      }
      if (data.unitReportStatus && typeof data.unitReportStatus === "object") {
        var nextStatus = {};
        Object.keys(data.unitReportStatus).forEach(function (key) {
          var value = data.unitReportStatus[key];
          if (value === "received" || value === "missing" || value === "merged") nextStatus[key] = value;
        });
        state.unitReportStatus = nextStatus;
      }
      if (Array.isArray(data.accessGrants)) {
        var nextGrants = [];
        data.accessGrants.forEach(function (item) {
          var row = normalizeAccessGrant(item);
          if (!row) return;
          if (!row.id) row.id = "g" + nextGrants.length;
          nextGrants.push(row);
        });
        state.accessGrants = nextGrants;
      }
      if (data.driveUnitNames && typeof data.driveUnitNames === "object") {
        applyCanonUnitNamesMap(data.driveUnitNames);
      }
      if (data.driveUnitFileLabel && typeof data.driveUnitFileLabel === "object") {
        state.driveUnitFileLabel = {};
        Object.keys(data.driveUnitFileLabel).forEach(function (key) {
          var label = String(data.driveUnitFileLabel[key] || "").trim().slice(0, 80);
          if (!key || !label || isDefaultUnitName(label)) return;
          state.driveUnitFileLabel[key] = label;
        });
      }
    } catch (err) {}
  }

    if (!edits || typeof edits !== "object") return;
    ["people", "machines"].forEach(function (kind) {
      var bucket = edits[kind];
      if (!bucket || typeof bucket !== "object") return;
      Object.keys(bucket).forEach(function (id) {
        var src = bucket[id];
        if (!src || typeof src !== "object") return;
        var copy = {};
        Object.keys(src).forEach(function (key) {
          if (src[key] == null) copy[key] = null;
          else if (typeof src[key] === "number" && isFinite(src[key])) copy[key] = src[key];
          else if (typeof src[key] === "string") copy[key] = src[key].slice(0, 80);
        });
        state.edits[kind][id] = copy;
      });
    });
  }

    ["people", "machines"].forEach(function (kind) {

      if (!bucket || typeof bucket !== "object") return;
      Object.keys(bucket).forEach(function (id) {
        if (bucket[id]) state.removed[kind][id] = true;

  function loadAdded(added) {
    if (!added || typeof added !== "object") return;
    var people = [];
    var machines = [];
    if (Array.isArray(added.people)) {
      added.people.forEach(function (item) {
        if (!item || typeof item.id !== "string" || !item.id) return;
        if (typeof item.callsign !== "string" || !item.callsign.trim()) return;
        if (!DUTY[item.duty] || !ACCOUNTING[item.accounting]) return;
        var nameParts = {
          surname: String(item.surname || "").slice(0, 80),
          givenName: String(item.givenName || "").slice(0, 80),
          patronymic: String(item.patronymic || "").slice(0, 80)
        };
        if (!nameParts.surname && !nameParts.givenName && !nameParts.patronymic) {
          nameParts = splitLegacyName(item.name || item.callsign || "");
        }
        people.push({
          id: item.id.slice(0, 40),
          surname: nameParts.surname,
          givenName: nameParts.givenName,
          patronymic: nameParts.patronymic,
          name: joinPersonName(nameParts) || String(item.name || item.callsign).slice(0, 80),
          rank: String(item.rank || "").slice(0, 80),
          callsign: item.callsign.trim().slice(0, 80),
          unit: String(item.unit || "").slice(0, 80),
          accounting: item.accounting,
          duty: item.duty,
          position: String(item.position || "").slice(0, 80),
          place: String(item.place || "s1").slice(0, 40)
        });
      });
    }
    if (Array.isArray(added.machines)) {
      added.machines.forEach(function (item) {
        if (!item || typeof item.id !== "string" || !item.id) return;
        if (typeof item.name !== "string" || !item.name.trim()) return;
        if (!MACHINE_DUTY[item.duty] || !ACCOUNTING[item.accounting]) return;
        machines.push({
          id: item.id.slice(0, 40),
          type: resolveMachineTypeId(item.type),
          name: item.name.trim().slice(0, 80),
          board: String(item.board || "").slice(0, 80),
          accounting: item.accounting,
          duty: item.duty,
          mileage: typeof item.mileage === "number" && isFinite(item.mileage) ? item.mileage : null,
          hours: typeof item.hours === "number" && isFinite(item.hours) ? item.hours : null,
          service: String(item.service || "").slice(0, 80)
        });
      });
    }
    state.added = { people: people, machines: machines };
  }

  function loadChanges(list) {
    if (!Array.isArray(list)) return;

    list.forEach(function (item) {

  function inPlacePick(id, value, options, extra) {
    var known = false;
    var knownLabel = "";
    options.forEach(function (pair) {
      if (pair[0] === value) {
        known = true;
        knownLabel = pair[1];
      }
    });
    var attrs = { id: id, "data-value": known ? value : "" };
    if (extra) Object.keys(extra).forEach(function (key) { attrs[key] = extra[key]; });
    var box = el("div", { className: "pick", attrs: attrs });
    box._options = options;
    var btn = el("button", {
      className: "pick-current",
      attrs: { type: "button", "data-pick-toggle": id, "aria-expanded": "false" }
    });
    btn.append(el("span", { text: known ? knownLabel : "" }));
    box.append(btn);

  function closePick(box) {
    var list = box.querySelector(".pick-list:not(.is-closing)");
    box.classList.remove("is-open");
    var btn = box.querySelector("[data-pick-toggle]") || box.querySelector(".pick-current");
    if (btn) btn.setAttribute("aria-expanded", "false");
    if (!list) return;
    if (motionOff()) {
      list.remove();
      return;
    }
    list.classList.add("is-closing");
    list.classList.remove("is-shown");
    var finished = false;
    function finish(event) {
      if (finished) return;
      if (event && event.target !== list) return;
      finished = true;
      if (list.parentNode) list.remove();
    }
    list.addEventListener("transitionend", finish);
    setTimeout(function () { finish(); }, 280);
  }

  function placeLayer(layer, anchor) {
    var rect = anchor.getBoundingClientRect();
    var gap = 4;
    var maxH = 280;
    var below = window.innerHeight - rect.bottom - gap - 8;
    var above = rect.top - gap - 8;
    var upward = below < 160 && above > below;
    var room = Math.max(88, Math.min(maxH, upward ? above : below));
    layer.style.left = Math.max(8, rect.left) + "px";
    layer.style.width = Math.max(120, rect.width) + "px";
    layer.style.maxHeight = room + "px";
    if (upward) {
      layer.style.top = "auto";
      layer.style.bottom = (window.innerHeight - rect.top + gap) + "px";
    } else {
      layer.style.bottom = "auto";
      layer.style.top = (rect.bottom + gap) + "px";
    }
  }

  function placePickList(box) {
    var list = box.querySelector(".pick-list:not(.is-closing)");
    var btn = box.querySelector(".pick-current");
    if (!list || !btn) return;
    placeLayer(list, btn);

  function placeOpenLists() {

  function closeOpenLists(target) {

  function pickOption(value, label, current) {
    var opt = el("button", {
      className: "pick-option" + (value === current ? " is-current" : ""),
      attrs: { type: "button", "data-pick-value": value }
    });
    opt.textContent = label;
    return opt;

  function openPick(box) {
    var current = box.getAttribute("data-value") || "";
    var list = el("div", { className: "pick-list" });
    if (box.classList.contains("duty-catalog")) {
      var kind = box.getAttribute("data-catalog-kind") || (box.id === "machine-status-list" ? "machineDuty" : box.id === "type-list" ? "type" : "duty");
      var chooseAttr = kind === "machineDuty" ? "data-choose-machine-duty" : kind === "type" ? "data-choose-type" : "data-choose-duty";
      (box._options || []).forEach(function (pair) {
        var opt = el("button", { className: "pick-option", attrs: { type: "button" } });
        opt.setAttribute(chooseAttr, pair[0]);
        opt.textContent = pair[1];
        list.append(opt);
      });
    } else if (box.classList.contains("rank-pick")) {
      list.append(pickOption("", "", current));
      if (current && !listedRank(current)) list.append(pickOption(current, current, current));
      RANK_GROUPS.forEach(function (group) {
        list.append(el("div", { className: "pick-group", text: group.label }));
        group.ranks.forEach(function (rank) { list.append(pickOption(rank, rank, current)); });
      });
    } else if (box.id === "report-switch") {
      (box._options || []).forEach(function (pair) {
        var code = pair[0];
        var label = pair[1];
        var opt = el("button", {
          className: "pick-option" + (code === current ? " is-current" : ""),
          attrs: { type: "button" }
        });
        if (code === "__general__") {
          opt.setAttribute("data-pick-value", code);
          opt.textContent = label;
        } else {
          var status = unitReportStatus(code);
          opt.append(el("span", { className: "report-name", text: label }));
          opt.append(el("span", {
            className: "sub-status is-" + status,
            text: unitReportStatusLabel(status),
            attrs: { "data-unit-status": code }
          }));
          // Статус («Відсутній звіт» тощо) лишається візуально; вкладку не блокуємо.
          opt.setAttribute("data-pick-value", code);
          opt.setAttribute("data-open-unit", code);
        }
        list.append(opt);
      });
    } else {
      (box._options || []).forEach(function (pair) {
        list.append(pickOption(pair[0], pair[1], current));
      });
    }
    box.append(list);
    box.classList.add("is-open");
    var btn = box.querySelector("[data-pick-toggle]") || box.querySelector(".pick-current");
    if (btn) btn.setAttribute("aria-expanded", "true");
    placePickList(box);
    if (motionOff()) list.classList.add("is-shown");
    else requestAnimationFrame(function () { list.classList.add("is-shown"); });
  }

  function togglePick(id) {
    var box = document.getElementById(id);
    if (!box) return;
    var willOpen = !box.classList.contains("is-open");
    document.querySelectorAll(".pick.is-open").forEach(closePick);
    if (willOpen) openPick(box);

  function choosePick(box, value) {
    if (box.id === "report-switch") {
      openReportChoice(value);
      return;
    }
    if (box.classList.contains("is-locked")) {
      closePick(box);
      return;
    }
    var label = "";
    (box._options || []).forEach(function (pair) {
      if (pair[0] === value) label = pair[1];
    });
    box.setAttribute("data-value", value);
    var shown = box.querySelector(".pick-current span");
    if (shown) shown.textContent = label;
    closePick(box);
    if (applyDraftField(box)) return;
    if (liveAutosaveEditNode(box)) return;
    rememberPending(box);
  }

    var raw = String(value || "");

    var options = [["", ""]];

  // ZS-141: розділ «Події» під Завданнями — записи відкритого дня.
  function viewEvents() {
    if (state.report && Array.isArray(state.report.events)) return state.report.events;
    return [];
  }

  function ensureReportEvents() {
    if (!state.report) state.report = sampleReportDocument();
    if (!Array.isArray(state.report.events)) state.report.events = [];
    return state.report.events;
  }

  function findEvent(id) {
    var list = viewEvents();
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].id === id) return list[i];
    }
    return null;
  }

  function eventLinkLabel(link) {
    if (!link || !link.kind || !link.id) return "";
    if (link.kind === "person") {
      var personItem = findPerson(link.id) || addedPerson(link.id);
      if (!personItem) return String(link.id);
      var call = personCallsign(personItem);
      return call || personPipShort(personItem) || personItem.name || link.id;
    }
    if (link.kind === "machine") {
      var machine = findMachine(link.id) || addedMachine(link.id);
      return machine ? (machineName(machine) || machine.board || link.id) : String(link.id);
    }
    if (link.kind === "task") {
      var tasks = viewTasks();
      for (var t = 0; t < tasks.length; t++) {
        if (tasks[t] && tasks[t].id === link.id) return tasks[t].name || link.id;
      }
      return String(link.id);
    }
    return String(link.id);
  }

  function eventLinkPillClass(kind) {
    if (kind === "person") return "pill wrap link-person";
    if (kind === "machine") return "pill wrap link-machine";
    return "pill wrap link-task";
  }

  function blankEvent() {
    return { id: newId("ne"), time: "", description: "", links: [] };
  }

  function addEventRecord() {
    if (!canDelete()) return;
    var list = ensureReportEvents();
    var row = blankEvent();
    list.push(row);
    state.eventLinkPick = null;
    state.open.add("event:" + row.id);
    save();
    render();
  }

  function copyEventRecord(id) {
    if (!canDelete()) return;
    var src = findEvent(id);
    if (!src) return;
    var list = ensureReportEvents();
    list.push({
      id: newId("ne"),
      time: String(src.time || "").slice(0, 16),
      description: String(src.description || "").slice(0, 500),
      links: Array.isArray(src.links) ? cloneData(src.links) : []
    });
    save();
    render();
  }

  function removeEventRecord(id) {
    if (!canDelete()) return;
    var list = ensureReportEvents();
    state.report.events = list.filter(function (row) { return !(row && row.id === id); });
    state.open.delete("event:" + id);
    if (state.eventLinkPick && state.eventLinkPick.eventId === id) state.eventLinkPick = null;
    state.confirm = null;
    save();
    render();
  }

  function askRemoveEvent(id) {
    if (!canDelete()) return;
    if (state.confirm && state.confirm.kind === "event" && state.confirm.id === id) {
      state.confirm = null;
      render();
      return;
    }
    state.confirm = { kind: "event", id: id };
    render();
  }

  function openEventLink(link) {
    if (!link || !link.kind || !link.id) return;
    if (link.kind === "person") toggle("person:" + link.id);
    else if (link.kind === "machine") toggle("machine:" + link.id);
    else if (link.kind === "task") toggle("task:" + link.id);
  }

  function addEventLink(eventId, kind, targetId) {
    var row = findEvent(eventId);
    if (!row || !kind || !targetId) return;
    if (!Array.isArray(row.links)) row.links = [];
    var exists = row.links.some(function (link) {
      return link && link.kind === kind && link.id === targetId;
    });
    if (!exists) row.links.push({ kind: kind, id: targetId });
    state.eventLinkPick = null;
    save();
    render();
  }

  function removeEventLink(eventId, kind, targetId) {
    var row = findEvent(eventId);
    if (!row || !Array.isArray(row.links)) return;
    row.links = row.links.filter(function (link) {
      return !(link && link.kind === kind && link.id === targetId);
    });
    save();
    render();
  }

  function eventPeopleChoices() {
    return staffPeopleList().filter(function (item) {
      return item && item.id && !state.removed.people[item.id];
    });
  }

  function eventMachineChoices() {
    var out = [];
    var seen = {};
    function push(item) {
      if (!item || !item.id || state.removed.machines[item.id] || seen[item.id]) return;
      seen[item.id] = true;
      out.push(item);
    }
    (state.report && Array.isArray(state.report.machines) ? state.report.machines : []).forEach(push);
    (state.added.machines || []).forEach(push);
    Object.keys(state.machineCards || {}).forEach(function (id) {
      var card = state.machineCards[id];
      if (!card || card.archived) return;
      var day = state.viewDay || todayISO();
      if (card.days && card.days[day]) push(machineItemFromCard(card, day));
    });
    return out;
  }

  function renderEventLinkPick(eventId, kind) {
    var list = el("ul", { className: "event-pick", attrs: { "data-event-pick-list": eventId } });
    var choices = [];
    if (kind === "person") {
      eventPeopleChoices().forEach(function (item) {
        choices.push({ id: item.id, label: eventLinkLabel({ kind: "person", id: item.id }) });
      });
    } else if (kind === "machine") {
      eventMachineChoices().forEach(function (item) {
        choices.push({ id: item.id, label: machineName(item) || item.board || item.id });
      });
    } else if (kind === "task") {
      viewTasks().forEach(function (task) {
        if (!task || !task.id) return;
        if (!grantAllowsTask(task.id)) return;
        choices.push({ id: task.id, label: task.name || task.id });
      });
    }
    if (!choices.length) {
      list.append(el("li", { text: "Немає записів для зв’язку" }));
      return list;
    }
    choices.forEach(function (choice) {
      var item = el("li");
      item.append(el("button", {
        text: choice.label,
        attrs: {
          type: "button",
          "data-event-link-choose": eventId + ":" + kind + ":" + choice.id
        }
      }));
      list.append(item);
    });
    return list;
  }

    if (state.confirm && state.confirm.kind === "event" && state.confirm.id === row.id) {
      panel.append(renderConfirmBox());

        className: eventLinkPillClass(link.kind),

    linksField.append(chips);

        className: "issue",
        text: "+ ОВТ",
        attrs: { type: "button", "data-event-link-pick": row.id + ":machine" }
      }));
      addRow.append(el("button", {
        className: "issue",
        text: "+ завдання",
        attrs: { type: "button", "data-event-link-pick": row.id + ":task" }
      }));
      addRow.append(el("button", {
        className: "issue",
        text: "+ місце (пізніше)",
        attrs: { type: "button", disabled: "disabled" }
      }));
      linksField.append(addRow);
      if (state.eventLinkPick && state.eventLinkPick.eventId === row.id) {
        linksField.append(renderEventLinkPick(row.id, state.eventLinkPick.kind));
      }
    }
    panel.append(linksField);
    return panel;
  }

  function renderReportSwitch() {
    if (!reportSwitchVisible()) return null;
    var root = reportRootCode();
    var options = [["__general__", "Загальний звіт"]];
    subordinatesFor(root).forEach(function (unit) {
      if (!unit) return;
      options.push([unit.code, unit.name]);
    });
    var current = currentReportValue();
    var known = options.some(function (pair) { return pair[0] === current; });
    if (!known) current = "__general__";
    var pick = inPlacePick("report-switch", current, options);
    pick.classList.add("report-switch");
    var shown = pick.querySelector(".pick-current span");
    if (shown) {
      shown.id = "open-report";
      shown.textContent = currentReportLabel();
    }
    return pick;
  }

  // ZS-110/113/116/119: bar під час sync; довший crawl, м’який догін на межі кроку, 100% перед hide.
  var driveProgressPaintPct = 0;
  var driveProgressCrawlTimer = null;
  var driveProgressFinishTimer = null;
  var driveProgressCrawling = false;
  var driveProgressCatchTo = null;
  var driveProgressFinishing = false;

  function driveProgressSegment(step, total) {
    var n = Number(step);
    var t = Number(total);
    if (!(n > 0) || !(t > 0)) return { start: 0, end: 0, soft: 0 };
    var start = ((n - 1) / t) * 100;
    var end = (n / t) * 100;
    // ZS-119: soft ближче до кінця (~4%), щоб менше «стояти» перед ривком.
    var soft = end - (end - start) * 0.04;
    if (soft < start) soft = start;
    return { start: start, end: end, soft: soft };
  }

  function stopDriveProgressCrawl() {
    if (driveProgressCrawlTimer) {
      clearInterval(driveProgressCrawlTimer);
      driveProgressCrawlTimer = null;
    }
    driveProgressCrawling = false;
  }

  function paintDriveProgressDom(pct, mode) {
    var value = Number(pct);
    if (!(value >= 0)) value = 0;
    if (value > 100) value = 100;
    driveProgressPaintPct = value;
    var rounded = Math.round(value);
    var bars = document.querySelectorAll("[data-drive-progress]");
    var transition = "width 0.2s linear";
    if (mode === "catch") transition = "width 0.32s ease-out";
    else if (mode === "finish") transition = "width 0.45s ease-out";
    for (var i = 0; i < bars.length; i++) {
      bars[i].setAttribute("aria-valuenow", String(rounded));
      var fill = bars[i].querySelector(".drive-progress-fill");
      if (!fill) continue;
      fill.style.transition = transition;
      fill.style.width = value + "%";
    }
  }

  // Один тік crawl (і для interval, і для self-test).
  function tickDriveProgressCrawl() {
    if (!state.driveProgress || !(Number(state.driveProgress.step) > 0)) {
      stopDriveProgressCrawl();
      return false;
    }
    if (driveProgressFinishing) {
      if (driveProgressPaintPct >= 99.6) {
        paintDriveProgressDom(100, "finish");
        return true;
      }
      var gapF = 100 - driveProgressPaintPct;
      var deltaF = Math.max(0.4, Math.min(2.2, gapF * 0.14));
      paintDriveProgressDom(Math.min(100, driveProgressPaintPct + deltaF), "finish");
      return true;
    }
    var seg = driveProgressSegment(state.driveProgress.step, state.driveProgress.total);
    var floor = seg.start;
    if (driveProgressCatchTo != null && Number(driveProgressCatchTo) > floor) {
      floor = Number(driveProgressCatchTo);
    }
    if (driveProgressPaintPct < floor - 0.02) {
      var gapC = floor - driveProgressPaintPct;
      // М’який догін без великих стрибків max(1.5, …).
      var deltaC = Math.max(0.22, Math.min(0.9, gapC * 0.16));
      paintDriveProgressDom(Math.min(floor, driveProgressPaintPct + deltaC), "catch");
      if (driveProgressPaintPct >= floor - 0.02) driveProgressCatchTo = null;
      return true;
    }
    if (driveProgressCatchTo != null && driveProgressPaintPct >= Number(driveProgressCatchTo) - 0.02) {
      driveProgressCatchTo = null;
    }
    // Після soft — дуже повільний asymptote до кінця сегмента (не стопати crawl).
    var park = seg.end - 0.08;
    if (park < seg.soft) park = seg.soft;
    if (driveProgressPaintPct >= seg.soft - 0.05) {
      if (driveProgressPaintPct >= park - 0.02) {

        return true;

      paintDriveProgressDom(Math.min(park, driveProgressPaintPct + deltaSlow), "crawl");
      return true;
    }
    var gap = seg.soft - driveProgressPaintPct;
    // Повільніший crawl, ніж ZS-116 (було gap·0.055 / 50 ms).
    var delta = Math.max(0.05, Math.min(0.28, gap * 0.024));
    paintDriveProgressDom(Math.min(seg.soft, driveProgressPaintPct + delta), "crawl");
    return true;
  }

  function startDriveProgressCrawl() {
    stopDriveProgressCrawl();
    if (!state.driveProgress || !(Number(state.driveProgress.step) > 0) || !(Number(state.driveProgress.total) > 0)) {
      return;
    }
    driveProgressCrawling = true;
    driveProgressCrawlTimer = setInterval(function () {
      if (!tickDriveProgressCrawl()) stopDriveProgressCrawl();
    }, 80);
  }

  function setDriveProgress(step, total) {
    if (step == null || !(total > 0)) {
      clearDriveProgress();
      return;
    }
    var n = Number(step);
    var t = Number(total);
    if (!(n >= 0) || !(t > 0)) {
      clearDriveProgress();
      return;
    }
    var prev = state.driveProgress;
    stopDriveProgressCrawl();
    if (driveProgressFinishTimer) {
      clearTimeout(driveProgressFinishTimer);
      driveProgressFinishTimer = null;
    }
    driveProgressFinishing = false;
    // ZS-119: м’який догін — не стрибати paintPct на prevEnd, лише ціль для crawl.
    if (prev && Number(prev.step) > 0 && n > Number(prev.step)) {
      var prevEnd = driveProgressSegment(prev.step, prev.total).end;
      if (driveProgressPaintPct < prevEnd) driveProgressCatchTo = prevEnd;
    }
    state.driveProgress = { step: n, total: t };
  }

  function clearDriveProgress() {
    stopDriveProgressCrawl();
    if (driveProgressFinishTimer) {
      clearTimeout(driveProgressFinishTimer);
      driveProgressFinishTimer = null;
    }
    state.driveProgress = null;
    driveProgressPaintPct = 0;
    driveProgressCatchTo = null;
    driveProgressFinishing = false;

  // Успішний фініш: crawl до 100% → коротка пауза → hide. done() після clear.
  function finishDriveProgress(done) {
    stopDriveProgressCrawl();
    if (driveProgressFinishTimer) {
      clearTimeout(driveProgressFinishTimer);
      driveProgressFinishTimer = null;
    }
    driveProgressCatchTo = null;
    driveProgressFinishing = true;
    if (!state.driveProgress || !(Number(state.driveProgress.total) > 0)) {
      state.driveProgress = { step: 1, total: 1 };
    } else {
      state.driveProgress = {
        step: Number(state.driveProgress.total),
        total: Number(state.driveProgress.total)
      };
    }
    function afterFull() {
      paintDriveProgressDom(100, "finish");
      driveProgressFinishTimer = setTimeout(function () {
        driveProgressFinishTimer = null;
        clearDriveProgress();
        if (typeof done === "function") done();
      }, 320);
    }
    if (driveProgressPaintPct >= 98.5) {
      afterFull();
      return;
    }
    startDriveProgressCrawl();
    function pollFinish() {
      if (driveProgressPaintPct >= 99.5) {
        stopDriveProgressCrawl();
        afterFull();
        return;
      }
      tickDriveProgressCrawl();
      driveProgressFinishTimer = setTimeout(pollFinish, 40);
    }
    pollFinish();
  }

      doc.machines = liveSlice.machines;
      doc.tasks = liveSlice.tasks;
      doc.people = liveSlice.people;
    }
    // ZS-142/144: картки з merge + попередній bundle + живий state; порожній remote не зносить local.
    var prevBundle = bundles[code];
    var incomingPeople = rawJson && rawJson.peopleCards && typeof rawJson.peopleCards === "object"
      ? cloneData(rawJson.peopleCards)
      : {};
    var incomingMachines = rawJson && rawJson.machineCards && typeof rawJson.machineCards === "object"
      ? cloneData(rawJson.machineCards)
      : {};
    var prevPeople = prevBundle && prevBundle.peopleCards ? prevBundle.peopleCards : {};
    var prevMachines = prevBundle && prevBundle.machineCards ? prevBundle.machineCards : {};
    var livePeople = String(state.reportKey || "").toLowerCase() === String(code || "").toLowerCase()
      ? (state.peopleCards || {})
      : {};
    var liveMachines = String(state.reportKey || "").toLowerCase() === String(code || "").toLowerCase()
      ? (state.machineCards || {})
      : {};
    var childPeopleCards = mergeCardMaps(mergeCardMaps(prevPeople, livePeople), incomingPeople);
    var childMachineCards = mergeCardMaps(mergeCardMaps(prevMachines, liveMachines), incomingMachines);
    bundles[code] = {
      edits: { people: {}, machines: {} },
      removed: { people: {}, machines: {} },
      peopleCards: childPeopleCards,
      machineCards: childMachineCards,
      added: { people: [], machines: [] },
      positions: {},
      changes: changes,
      report: doc,
      daysArchive: days,
      fileDay: day,
      viewDay: day
    };
    // Якщо unit зараз відкритий — показати знімок з посіяним днем.
    applyOpenUnitFromBundle(code);
    // ZS-123: одразу перенести в Загальний (merged), не лишати лише received.
    mergeUnitIntoGeneral(code);
    if (unitReportStatus(code) !== "merged") setUnitReportStatus(code, "received");
    return true;
  }

  function syncChildUnits(token, folderId) {
    var list = unitsOwnedHere();
    state.childFilesPulledThisSync = {};
    if (!list.length) return Promise.resolve({ received: 0, missing: 0, merged: 0, conflicts: 0 });
    var received = 0;
    var missing = 0;
    var merged = 0;
    var openChild = String(driveChildWriteCode() || "").trim();
    // Конфлікти/схожі для вкладки unit — лише з її файлу; інакше лишаємо конфлікти lead.
    var conflictAcc = openChild ? [] : (Array.isArray(state.mergeConflicts) ? state.mergeConflicts.slice() : []);
    var deleteAcc = openChild ? [] : (Array.isArray(state.mergeDeletes) ? state.mergeDeletes.slice() : []);
    var chain = Promise.resolve();
    list.forEach(function (unit) {
      chain = chain.then(function () {
        var code = String(unit.code || "").trim();
        if (!code) {
          missing += 1;
          return;
        }
        if (unit && unit.name) rememberCanonUnitName(code, unit.name);
        // ZS-142/128: навіть без канонічного імені — resolve (аліаси + хвіст + hash), не різати одразу missing.
        return resolveUnitDriveFile(token, folderId, code, { kind: "binary", decryptKey: code }).then(function (resolved) {
          var file = resolved && resolved.file;
          if (!file || !file.id) {
            missing += 1;
            setUnitReportStatus(code, "missing");
            return;
          }
          return downloadBinaryFile(token, file.id).then(function (bytes) {
            return decryptWithCode(code, bytes).then(function (text) {
              var raw;
              try { raw = JSON.parse(text); } catch (err) {
                missing += 1;
                setUnitReportStatus(code, "missing");
                return;
              }
              if (!raw || typeof raw !== "object") {
                missing += 1;
                setUnitReportStatus(code, "missing");
                return;
              }
              // ZS-128: 3-way merge файлу unit (як телефон↔ПК), не сліпий replace.
              var localSnap = localChildSnapshotForMerge(code);
              var preservedPeople = cloneData((localSnap && localSnap.peopleCards) || {});
              var preservedMachines = cloneData((localSnap && localSnap.machineCards) || {});
              var baseSnap = loadMergeBase(code);
              var mergedResult = mergeUnitSnapshots(localSnap, raw, baseSnap);
              if (!mergedResult.snapshot) {
                missing += 1;
                setUnitReportStatus(code, "missing");
                return;
              }
              var isOpenTab = !!(openChild && openChild.toLowerCase() === code.toLowerCase());
              if (isOpenTab && Array.isArray(mergedResult.conflicts) && mergedResult.conflicts.length) {
                conflictAcc = conflictAcc.concat(mergedResult.conflicts);
              }
              if (isOpenTab && Array.isArray(mergedResult.deleteConflicts) && mergedResult.deleteConflicts.length) {
                deleteAcc = deleteAcc.concat(mergedResult.deleteConflicts.map(function (row) {
                  var copy = cloneData(row);
                  if (copy && copy.direction === "local-removed") copy.pendingChoice = true;
                  return copy;
                }));
              }
              if (!ingestChildUnit(code, mergedResult.snapshot)) {
                missing += 1;
                setUnitReportStatus(code, "missing");
                return;
              }
              received += 1;
              state.childFilesPulledThisSync[code] = true;
              if (unitReportStatus(code) === "merged") merged += 1;
              if (isOpenTab) {
                restorePreservedAliveCards(preservedPeople, preservedMachines, raw);
                thawPendingLocalRemoves(mergedResult.deleteConflicts);
                projectCardsToLiveDay();
                applyMergedRemovals(mergedResult.snapshot, mergedResult.deleteConflicts);
                queuePersonDuplicatePrompts(mergedResult.snapshot);
              }
              // ZS-152: не upsert tomb/знімок на Диск, доки відкрита вкладка чекає delete/conflict вибір.
              var pendingOpenDialogs = isOpenTab && (
                (mergedResult.deleteConflicts && mergedResult.deleteConflicts.length) ||
                (mergedResult.conflicts && mergedResult.conflicts.length)
              );
              if (pendingOpenDialogs) return null;
              var snapToWrite = cloneData(mergedResult.snapshot);
              snapToWrite.code = code;
              snapToWrite.children = subordinatesFor(code).map(function (row) {
                var childCode = String(row.code || "");
                var label = preferUnitName(row.name, unitNameFromBundle(childCode));
                if (label && row.name !== label) row.name = label;
                return { name: String(label || row.name || "").slice(0, 80), code: childCode };
              }).filter(function (item) { return !!item.code; });
              return upsertKeyedUnitFile(token, folderId, code, snapToWrite).catch(function () {
                return null;
              });
            });
          });
        }).catch(function () {
          missing += 1;
          setUnitReportStatus(code, "missing");
        });
      });
    });
    return chain.then(function () {
      state.mergeConflicts = conflictAcc;
      // Не затирати delete-конфлікти lead, накопичені в pullOwnUnitFile.
      if (openChild && deleteAcc.length) {
        state.mergeDeletes = (Array.isArray(state.mergeDeletes) ? state.mergeDeletes : []).concat(deleteAcc);
      } else if (!openChild) {
        state.mergeDeletes = deleteAcc;
      }
      var openNow = String(state.openCode || "").trim();
      if (openNow && bundles[openNow]) applyOpenUnitFromBundle(openNow);
      return {
        received: received,
        missing: missing,
        merged: merged,
        conflicts: openChild ? conflictAcc.length : 0,
        deletes: (state.mergeDeletes || []).length,
        dupes: openChild ? (state.mergeDupes || []).length : 0
      };
    });
  }

  function driveSyncSummary(settings, own, children, pulled) {
    var parts = [];
    if (settings && settings.wroteSettings) parts.push("довідники записано");
    else if (settings && settings.readSettings) parts.push("довідники прочитано");
    if (pulled && pulled.pulled && pulled.quarantined) parts.push("звіт підлеглої ланки перенесено в загальний");
    else     if (pulled && pulled.pulled && pulled.merged) {
      parts.push("свій файл злито");
      if (pulled.conflicts) parts.push("є поля на вибір: " + pulled.conflicts);
      if (pulled.dupes) parts.push("схожі картки: " + pulled.dupes);
    } else if (pulled && pulled.pulled && !pulled.keptLocal) parts.push("свій файл прочитано");
    // ZS-142: noname — явна помилка, не тихий «синхронізацію завершено».
    if (own && (own.reason === "noname" || own.error === "noname" || own.skipped)) {
      parts.push("помилка: немає назви підрозділу для файлу на Диску — звіт unit не записано");
    } else if (own && own.updated) parts.push("свій файл оновлено");
    else if (own && own.ok) {
      if (looksLikeUnitCode(state.driveEncryptKey) && unitsOwnedHere().length === 0) {
        parts.push("звіт підрозділу записано на Диск");
      } else {
        parts.push("свій файл записано");
      }
    }
    var received = children && children.received ? children.received : 0;
    var missing = children && children.missing ? children.missing : 0;
    if (received || missing) {
      parts.push("нижчих: " + received + " отримано" + (missing ? ", " + missing + " відсутні" : ""));
      if (children && children.conflicts) parts.push("є поля на вибір у вкладці: " + children.conflicts);
      if (children && children.dupes) parts.push("схожі картки у вкладці: " + children.dupes);
    } else if (unitsOwnedHere().length === 0) {
      parts.push("нижчих ланок ще немає");
    }
    if (state.driveDupNote) parts.push(String(state.driveDupNote));
    return parts.length ? parts.join(". ") + "." : "Синхронізацію завершено.";
  }

  function runDriveSync(token, folderId) {
    var key = String(state.driveEncryptKey || "").trim();
    // ZS-121: 4 робочі кроки на bar; фініш — crawl до 100%, без сегмента 5.
    var syncTotal = 4;
    if (!key) {
      state.driveNote = "Впишіть код доступу.";
      clearDriveProgress();
      render();
      return;
    }
    rememberDriveUser(token);
    state.driveDupNote = "";
    state.driveNote = "Синхронізую довідники.";
    setDriveProgress(1, syncTotal);
    render();
    findSettingsFile(token, folderId).then(function (file) {
      var prepare = file
        ? downloadSettingsFile(token, file.id).then(function (json) {
            rememberSettingsAdmin(json);
            return { file: file, json: json };
          })
        : Promise.resolve({ file: null, json: null });
      return prepare.then(function (info) {
        if (canWriteDriveSettings()) {
          return uploadSettingsFile(token, folderId, info.file && info.file.id).then(function () {
            rememberSettingsAdmin(buildSettingsPayload());
            return { wroteSettings: true, readSettings: false };
          });
        }
        if (info.json) {
          applySettingsPayload(info.json);
          return { wroteSettings: false, readSettings: true };
        }
        return { wroteSettings: false, readSettings: false };
      });
    }).then(function (settingsResult) {
      state.childFilesPulledThisSync = {};
      state.driveNote = "Читаю свій файл підрозділу.";
      setDriveProgress(2, syncTotal);
      render();
      return pullOwnUnitFile(token, folderId).then(function (pulled) {
        return { settings: settingsResult || {}, pulled: pulled || { pulled: false } };
      });
    }).then(function (bundle) {
      // ZS-128: спочатку pull+3-way файлів нижчих ланок, потім upsert — ніколи не затирати vu-*.bin порожньою вкладкою.
      state.driveNote = "Читаю звіти нижчих ланок.";
      setDriveProgress(3, syncTotal);
      render();
      return syncChildUnits(token, folderId).then(function (children) {
        return { settings: bundle.settings, pulled: bundle.pulled, children: children };
      });
    }).then(function (bundle) {
      // ZS-152: не писати власний файл на Диск, доки висять delete/conflict/dupe діалоги.
      if (mergeDialogsPending()) {
        state.driveNote = "Є розбіжності — оберіть у вікні, потім звіт допишеться на Диск.";
        setDriveProgress(4, syncTotal);
        render();
        return {
          settings: bundle.settings,
          pulled: bundle.pulled,
          own: { deferred: true },
          children: bundle.children
        };
      }
      state.driveNote = "Пишу файл підрозділу.";
      setDriveProgress(4, syncTotal);
      render();
      return upsertOwnUnitFile(token, folderId).then(function (own) {
        return { settings: bundle.settings, pulled: bundle.pulled, own: own, children: bundle.children };
      });
    }).then(function (bundle) {
      // ZS-123/125: після реального merge — завжди перезаписати файл lead зі знімка bundles,
      // навіть якщо зараз відкрита підлегла ланка (не через upsertOwnUnitFile → файл unit).
      if (mergeDialogsPending()) return bundle;
      var needParentWrite = bundle.children && Number(bundle.children.merged) > 0;
      if (!needParentWrite) return bundle;
      var parentKey = String(state.driveEncryptKey || "").trim();
      var parentBundleKey = canonicalOwnBundleKey(parentKey);
      var parentSnap = snapshotFromStoredBundle(parentBundleKey);
      if (!parentSnap || !parentKey) return bundle;
      parentSnap.code = parentKey;
      state.driveNote = "Пишу загальний звіт із перенесеними ланками.";
      return upsertKeyedUnitFile(token, folderId, parentKey, parentSnap).then(function (own) {
        bundle.own = own || bundle.own;
        return bundle;
      }).catch(function () {
        return bundle;
      });
    }).then(function (bundle) {
      if (bundle.own && bundle.own.name) {
        state.driveQueue.push({ name: bundle.own.name, folder: folderId, at: new Date().toISOString() });
      }
      state.driveLinked = true;
      state.driveNote = driveSyncSummary(bundle.settings, bundle.own, bundle.children, bundle.pulled);
      // ZS-121: після кроку 4 одразу finish-crawl до 100% (без сегмента 5 і без paintPct=100).
      state.refreshFallback = false;
      save({ force: true });
      render();
      finishDriveProgress(function () {
        render();
      });
    }).catch(function (err) {
      clearDriveProgress();
      if (state.refreshFallback) {
        state.refreshFallback = false;
        if (restoreFromReportCache()) return;
      }
      if (err && err.message === "nocode") state.driveNote = "Впишіть код доступу.";
      else if (err && err.message === "noname") state.driveNote = "Помилка: немає назви підрозділу для файлу на Диску — звіт unit не записано.";
      else state.driveNote = "Мережа не відповіла або файл не розшифрувався.";
      render();
    });
  }

  function requestDriveAccessToken(clientId, opts, done) {
    var forceConsent = !!(opts && opts.forceConsent);
    loadGoogle(function () {
      if (!driveTokenClient) {
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_OAUTH_SCOPE,
          callback: function () {}
        });
      }
      driveTokenClient.callback = function (response) {
        if (!response || response.error || !response.access_token) {
          state.driveNote = "Вхід не підтверджено.";
          clearDriveProgress();
          render();
          return;
        }
        rememberDriveToken(response);
        done(driveToken);
      };
      var req = { prompt: forceConsent ? "consent" : "" };
      if (state.driveGoogleEmail) req.hint = state.driveGoogleEmail;
      driveTokenClient.requestAccessToken(req);
    });
  }

  function sendReport(clientId, folderId, opts) {
    if (location.protocol === "file:") {
      state.driveNote = "Google не відкриває вхід з файлу на диску. Сторінку треба відкрити за адресою http або https.";
      clearDriveProgress();
      render();
      return;
    }
    var forceConsent = !!(opts && opts.forceConsent);
    function upload(token) {
      runDriveSync(token, folderId);
    }
    if (!forceConsent && driveTokenValid()) {
      upload(driveToken);
      return;
    }
    if (forceConsent) clearDriveToken();
    requestDriveAccessToken(clientId, { forceConsent: forceConsent }, upload);
  }

  function startDriveSync(opts) {
    state.driveClient = DRIVE_CLIENT;
    var folderId = driveFolderId(state.driveFolder);
    if (!folderId) {
      state.driveNote = "";
      clearDriveProgress();
      if (state.refreshFallback) {
        state.refreshFallback = false;
        if (restoreFromReportCache()) return;
      }
      render();
      return;
    }
    var forceConsent = !!(opts && opts.forceConsent);
    if (forceConsent || !driveTokenValid()) state.driveNote = "Відкриваю вікно Google.";
    else state.driveNote = "Синхронізую.";
    clearDriveProgress();
    render();
    sendReport(DRIVE_CLIENT, folderId, { forceConsent: forceConsent });
  }

  function changeDriveAccount() {
    state.driveGoogleEmail = "";
    saveDrivePrefs();
    startDriveSync({ forceConsent: true });
  }

  function formatConflictValue(kind, field, value) {
    if (value == null || value === "") return "—";
    if (field === "duty") {
      var map = kind === "machine" ? machineDutyMap() : dutyMap();
      return (map[value] && map[value].label) || String(value);
    }
    if (field === "accounting") {
      return (ACCOUNTING[value] && ACCOUNTING[value].label) || String(value);
    }
    if (field === "type") {
      var typed = typeById(String(value || ""));
      return typed ? typed.one : String(value);
    }
    return String(value);
  }

  function conflictSubjectLabel(conflict) {
    if (!conflict) return "";
    if (conflict.kind === "machine") {
      var machine = findMachine(conflict.id);
      return machine ? (machineName(machine) || machineBoard(machine) || conflict.id) : conflict.id;
    }
    var person = findPerson(conflict.id);
    return person ? (personCallsign(person) || personName(person) || conflict.id) : conflict.id;
  }

  function renderMergeConflictOverlay() {
    var list = Array.isArray(state.mergeConflicts) ? state.mergeConflicts : [];
    if (!list.length) return null;
    var conflict = list[0];
    var overlay = el("div", { className: "overlay", attrs: { id: "merge-conflict-overlay", role: "dialog", "aria-label": "Розбіжність після sync" } });
    var sheet = el("div", { className: "overlay-sheet is-compact" });

    sheet.append(el("p", { className: "hint", text: "Після sync з’явилась розбіжність. Оберіть варіант для цього поля." }));
    sheet.append(el("p", {
      className: "hint",
      text: conflictSubjectLabel(conflict) + " · " + (conflict.label || conflict.field) + (list.length > 1 ? " (ще " + (list.length - 1) + ")" : "")
    }));
    var form = el("div", { className: "unit-create" });
    form.append(el("button", {

      attrs: { type: "button", "data-merge-pick": "local" }
    }));

      attrs: { type: "button", "data-merge-pick": "remote" }
    }));

  function applyMergeConflictChoice(side) {
    var list = Array.isArray(state.mergeConflicts) ? state.mergeConflicts : [];
    if (!list.length) return;
    var conflict = list[0];
    var value = side === "remote" ? conflict.remoteValue : conflict.localValue;
    var ts = stampNow();
    if (conflict.kind === "person") {
      var person = findPerson(conflict.id);
      if (person) {
        if (!state.edits.people[conflict.id]) state.edits.people[conflict.id] = {};
        state.edits.people[conflict.id][conflict.field] = value;
        if (conflict.field === "position") state.positions[conflict.id] = value == null ? "" : String(value);
        person[conflict.field] = value;
        person.updatedAt = ts;
        if (!person.fieldsUpdatedAt) person.fieldsUpdatedAt = {};
        person.fieldsUpdatedAt[conflict.field] = ts;
      }
    } else if (conflict.kind === "machine") {
      var machine = findMachine(conflict.id);
      if (machine) {
        if (!state.edits.machines[conflict.id]) state.edits.machines[conflict.id] = {};
        state.edits.machines[conflict.id][conflict.field] = value;
        machine[conflict.field] = value;
        machine.updatedAt = ts;
        if (!machine.fieldsUpdatedAt) machine.fieldsUpdatedAt = {};
        machine.fieldsUpdatedAt[conflict.field] = ts;
      }
    }
    state.mergeConflicts = list.slice(1);
    materializeOverlays();
    captureBundle(state.reportKey);
    save();
    render();
    flushDriveAfterMergeChoices();
  }

    var list = Array.isArray(state.mergeDeletes) ? state.mergeDeletes : [];
    if (!list.length) return null;

    var overlay = el("div", { className: "overlay", attrs: { id: "merge-delete-overlay", role: "dialog", "aria-label": "Видалення після sync" } });
