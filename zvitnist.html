    return resolveUnitDriveFile(token, folderId, key, { kind: "binary", decryptKey: key }).then(function (resolved) {
      var file = resolved && resolved.file;
      if (!file || !file.id) return { pulled: false };
      return downloadBinaryFile(token, file.id).then(function (bytes) {
        return decryptWithCode(key, bytes).then(function (text) {
          var raw;
          try { raw = JSON.parse(text); } catch (err) { return { pulled: false }; }
          if (!raw || typeof raw !== "object") return { pulled: false };
          mergeChildrenFromSnapshot(raw);
          var keepLocal = localReportHasContent();
          if (!keepLocal) {
            // ZS-107: чужий код підлеглого в файлі тата — у bundles, не в загальний.
            if (ownPullLooksLikeChildBleed(raw, key)) {
              var childCode = String(raw.code || "").trim();
              ingestChildUnit(childCode, raw);
              return { pulled: true, keptLocal: false, quarantined: true, name: name, fileId: file.id, fromLegacy: !!resolved.fromLegacy };
            }
            applyOwnUnitSnapshot(raw, key);
          } else {
            normalizeOwnReportKey();
          }
          return { pulled: true, keptLocal: keepLocal, name: name, fileId: file.id, fromLegacy: !!resolved.fromLegacy };
        });
      });
    }).catch(function () {
      return { pulled: false };
    });
  }

  function upsertKeyedUnitFile(token, folderId, key, snap) {
    if (!key) return Promise.reject(new Error("nocode"));
    var name = unitDriveFileName(key);
    if (!name) return Promise.reject(new Error("nocode"));
    return resolveUnitDriveFile(token, folderId, key, { kind: "binary", decryptKey: key }).then(function (resolved) {
      var file = resolved && resolved.file;
      var fromLegacy = !!(resolved && resolved.fromLegacy);
      var preserve = Promise.resolve(null);
      // Не затирати на Диску непорожній children порожнім локальним списком.
      if (file && file.id && subordinatesFor(key).length === 0) {
        preserve = downloadBinaryFile(token, file.id).then(function (bytes) {
          return decryptWithCode(key, bytes).then(function (text) {
            var raw;
            try { raw = JSON.parse(text); } catch (err) { return null; }
            if (!raw || !Array.isArray(raw.children) || !raw.children.length) return null;
            if (!driveChildWriteCode()) mergeChildrenFromSnapshot(raw);
            return raw.children;
          });
        }).catch(function () { return null; });
      }
      return preserve.then(function (remoteChildren) {
        var payload = snap ? cloneData(snap) : currentUnitSnapshot();
        payload.code = key;
        if ((!payload.children || !payload.children.length) && remoteChildren && remoteChildren.length) {
          payload.children = remoteChildren.map(function (item) {
            return { name: String(item && item.name || "").slice(0, 80), code: String(item && item.code || "") };
          }).filter(function (item) { return !!item.code; });
        }
        // З legacy hash — створюємо нове ім’я (не PATCH старого), потім trash hash.
        var writeId = fromLegacy ? null : (file && file.id);
        return encryptWithCode(key, JSON.stringify(payload)).then(function (bytes) {
          return uploadBinaryFile(token, folderId, name, bytes, writeId).then(function (result) {
            var done = Promise.resolve(result);
            if (fromLegacy && file && file.id) {
              done = trashDriveFile(token, file.id).then(function () { return result; });
            }
            return done.then(function (out) {
              return { ok: true, name: name, key: key, updated: !!(out && out.updated), migrated: fromLegacy };
            });
          });
        });
      });
    });
  }

  function upsertOwnUnitFile(token, folderId) {
    var parentKey = String(state.driveEncryptKey || "").trim();
    if (!parentKey) return Promise.reject(new Error("nocode"));
    materializeOverlays();
    var child = driveChildWriteCode();
    var ownBundleKey = canonicalOwnBundleKey(parentKey);
    if (child && child.toLowerCase() !== parentKey.toLowerCase()) {
      captureBundle(state.reportKey);
      var childSnap = currentUnitSnapshot();
      childSnap.code = child;
      childSnap.children = subordinatesFor(child).map(function (unit) {
        return { name: String(unit.name || "").slice(0, 80), code: String(unit.code || "") };
      }).filter(function (item) { return !!item.code; });
      return upsertKeyedUnitFile(token, folderId, child, childSnap).then(function (childResult) {
        normalizeOwnReportKey();
        var parentBundleKey = ownBundleKey || bundleKeyForDriveKey(parentKey);
        var parentSnap = snapshotFromStoredBundle(parentBundleKey);
        if (!parentSnap) {
          return childResult;
        }
        parentSnap.code = parentKey;
        return upsertKeyedUnitFile(token, folderId, parentKey, parentSnap).then(function () {
          return childResult;
        });
      });
    }
    // ZS-109: на загальному завжди писати з канонічного bundle, не з пароля як reportKey.
    normalizeOwnReportKey();
    state.reportKey = ownBundleKey;
    captureBundle(ownBundleKey);
    return upsertKeyedUnitFile(token, folderId, parentKey, null);
  }

  function ingestChildUnit(code, rawJson) {
    var doc = applyUnitSnapshot(rawJson, code);
    if (!doc) return false;
    var unit = findUnitByCode(code);
    if (unit) {
      var kept = preferUnitName(unit.name, doc && doc.name);
      if (kept) unit.name = kept;
      if (isDefaultUnitName(doc.name) && !isDefaultUnitName(kept) && doc) doc.name = kept;
    }
    var day = rawJson && typeof rawJson.day === "string" && /^\d{4}-\d{2}-\d{2}$/.test(rawJson.day) ? rawJson.day : todayISO();
    var days = {};
    if (rawJson && rawJson.days && typeof rawJson.days === "object") {
      Object.keys(rawJson.days).forEach(function (key) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
        days[key] = normalizeDaySlice(rawJson.days[key]);
      });
    }
    var changes = Array.isArray(rawJson && rawJson.changes) ? rawJson.changes.slice(-100) : [];
    bundles[code] = {
      edits: { people: {}, machines: {} },
      removed: { people: {}, machines: {} },
      added: { people: [], machines: [] },
      positions: {},
      changes: changes,
      report: doc,
      daysArchive: days,
      fileDay: day,
      viewDay: day
    };
    // ZS-107: на загальному не підміняти state.report вмістом дитини.
    var openNow = String(state.openCode || "").trim();
    var rootNow = String(state.reportRoot || "").trim();
    var onGeneral = !openNow || !rootNow || openNow.toLowerCase() === rootNow.toLowerCase();
    if (!onGeneral && String(state.reportKey || "") === String(code) && openNow.toLowerCase() === String(code).toLowerCase()) {
      state.report = doc;
      state.changes = changes;
      state.daysArchive = days;
      state.fileDay = day;
      state.viewDay = day;
      ensureDayRollover();
    }
    setUnitReportStatus(code, "received");
    return true;
  }

  function syncChildUnits(token, folderId) {
    var list = unitsOwnedHere();
    if (!list.length) return Promise.resolve({ received: 0, missing: 0 });
    var received = 0;
    var missing = 0;
    var chain = Promise.resolve();
    list.forEach(function (unit) {
      chain = chain.then(function () {
        var name = unitDriveFileName(unit.code);
        if (!name) {
          missing += 1;
          setUnitReportStatus(unit.code, "missing");
          return;
        }
        return resolveUnitDriveFile(token, folderId, unit.code, { kind: "binary", decryptKey: unit.code }).then(function (resolved) {
          var file = resolved && resolved.file;
          if (!file || !file.id) {
            missing += 1;
            setUnitReportStatus(unit.code, "missing");
            return;
          }
          return downloadBinaryFile(token, file.id).then(function (bytes) {
            return decryptWithCode(unit.code, bytes).then(function (text) {
              var raw = JSON.parse(text);
              if (ingestChildUnit(unit.code, raw)) received += 1;
              else {
                missing += 1;
                setUnitReportStatus(unit.code, "missing");
              }
            });
          });
        }).catch(function () {
          missing += 1;
          setUnitReportStatus(unit.code, "missing");
        });
      });
    });
    return chain.then(function () {
      return { received: received, missing: missing };
    });
  }

  function driveSyncSummary(settings, own, children, pulled) {
    var parts = [];
    if (settings && settings.wroteSettings) parts.push("довідники записано");
    else if (settings && settings.readSettings) parts.push("довідники прочитано");
    if (pulled && pulled.pulled && pulled.quarantined) parts.push("чужий звіт підлеглого не в загальний");
    else if (pulled && pulled.pulled && !pulled.keptLocal) parts.push("свій файл прочитано");
    if (own && own.updated) parts.push("свій файл оновлено");
    else if (own && own.ok) {
      if (looksLikeUnitCode(state.driveEncryptKey) && unitsOwnedHere().length === 0) {
        parts.push("звіт підрозділу записано на Диск");
      } else {
        parts.push("свій файл записано");
      }
    }
    var received = children && children.received ? children.received : 0;
    var missing = children && children.missing ? children.missing : 0;
    if (received || missing) {
      parts.push("нижчих: " + received + " отримано" + (missing ? ", " + missing + " відсутні" : ""));
    } else if (unitsOwnedHere().length === 0) {
      parts.push("нижчих ланок ще немає");
    }
    if (state.driveDupNote) parts.push(String(state.driveDupNote));
    return parts.length ? parts.join(". ") + "." : "Синхронізацію завершено.";
  }

  function runDriveSync(token, folderId) {
    var key = String(state.driveEncryptKey || "").trim();
    var syncTotal = 5;
    if (!key) {
      state.driveNote = "Впишіть код доступу.";
      clearDriveProgress();
      render();
      return;
    }
    rememberDriveUser(token);
    state.driveDupNote = "";
    state.driveNote = "Синхронізую довідники.";
    setDriveProgress(1, syncTotal);
    render();
    findSettingsFile(token, folderId).then(function (file) {
      var prepare = file
        ? downloadSettingsFile(token, file.id).then(function (json) {
            rememberSettingsAdmin(json);
            return { file: file, json: json };
          })
        : Promise.resolve({ file: null, json: null });
      return prepare.then(function (info) {
        if (canWriteDriveSettings()) {
          return uploadSettingsFile(token, folderId, info.file && info.file.id).then(function () {
            rememberSettingsAdmin(buildSettingsPayload());
            return { wroteSettings: true, readSettings: false };
          });
        }
        if (info.json) {
          applySettingsPayload(info.json);
          return { wroteSettings: false, readSettings: true };
        }
        return { wroteSettings: false, readSettings: false };
      });
    }).then(function (settingsResult) {
      state.driveNote = "Читаю свій файл підрозділу.";
      setDriveProgress(2, syncTotal);
      render();
      return pullOwnUnitFile(token, folderId).then(function (pulled) {
        return { settings: settingsResult || {}, pulled: pulled || { pulled: false } };
      });
    }).then(function (bundle) {
      state.driveNote = "Пишу файл підрозділу.";
      setDriveProgress(3, syncTotal);
      render();
      return upsertOwnUnitFile(token, folderId).then(function (own) {
        return { settings: bundle.settings, pulled: bundle.pulled, own: own };
      });
    }).then(function (bundle) {
      state.driveNote = "Читаю звіти нижчих ланок.";
      setDriveProgress(4, syncTotal);
      render();
      return syncChildUnits(token, folderId).then(function (children) {
        return { settings: bundle.settings, pulled: bundle.pulled, own: bundle.own, children: children };
      });
    }).then(function (bundle) {
      if (bundle.own && bundle.own.name) {
        state.driveQueue.push({ name: bundle.own.name, folder: folderId, at: new Date().toISOString() });
      }
      state.driveLinked = true;
      state.driveNote = driveSyncSummary(bundle.settings, bundle.own, bundle.children, bundle.pulled);
      setDriveProgress(5, syncTotal);
      clearDriveProgress();
      state.refreshFallback = false;
      save();
      saveReportCache();
      render();
    }).catch(function (err) {
      clearDriveProgress();
      if (state.refreshFallback) {
        state.refreshFallback = false;
        if (restoreFromReportCache()) return;
      }
      if (err && err.message === "nocode") state.driveNote = "Впишіть код доступу.";
      else state.driveNote = "Мережа не відповіла або файл не розшифрувався.";
      render();
    });
  }

  function requestDriveAccessToken(clientId, opts, done) {
    var forceConsent = !!(opts && opts.forceConsent);
    loadGoogle(function () {
      if (!driveTokenClient) {
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_OAUTH_SCOPE,
          callback: function () {}
        });
      }
      driveTokenClient.callback = function (response) {
        if (!response || response.error || !response.access_token) {
          state.driveNote = "Вхід не підтверджено.";
          clearDriveProgress();
          render();
          return;
        }
        rememberDriveToken(response);
        done(driveToken);
      };
      var req = { prompt: forceConsent ? "consent" : "" };
      if (state.driveGoogleEmail) req.hint = state.driveGoogleEmail;
      driveTokenClient.requestAccessToken(req);
    });
  }

  function sendReport(clientId, folderId, opts) {
    if (location.protocol === "file:") {
      state.driveNote = "Google не відкриває вхід з файлу на диску. Сторінку треба відкрити за адресою http або https.";
      clearDriveProgress();
      render();
      return;
    }
    var forceConsent = !!(opts && opts.forceConsent);
    function upload(token) {
      runDriveSync(token, folderId);
    }
    if (!forceConsent && driveTokenValid()) {
      upload(driveToken);
      return;
    }
    if (forceConsent) clearDriveToken();
    requestDriveAccessToken(clientId, { forceConsent: forceConsent }, upload);
  }

  function startDriveSync(opts) {
    state.driveClient = DRIVE_CLIENT;
    var folderId = driveFolderId(state.driveFolder);
    if (!folderId) {
      state.driveNote = "";
      clearDriveProgress();
      if (state.refreshFallback) {
        state.refreshFallback = false;
        if (restoreFromReportCache()) return;
      }
      render();
      return;
    }
    var forceConsent = !!(opts && opts.forceConsent);
    if (forceConsent || !driveTokenValid()) state.driveNote = "Відкриваю вікно Google.";
    else state.driveNote = "Синхронізую.";
    clearDriveProgress();
    render();
    sendReport(DRIVE_CLIENT, folderId, { forceConsent: forceConsent });
  }

  function openAccessChange(unitId) {
    if (!canBranch()) return;
    var unit = null;
    for (var i = 0; i < state.units.length; i++) {
      if (state.units[i].id === unitId) unit = state.units[i];
    }
    if (!unit) return;
    if (String(unit.parent || "").toLowerCase() !== actorKey().toLowerCase()) return;
    state.accessChange = {
      unitId: unit.id,
      oldCode: String(unit.code || ""),
      name: String(unit.name || ""),
      newCode: "",
      deletePending: false,
      note: ""
    };

  }

    var change = state.accessChange;
    if (!change || !canBranch()) return;

    render();

  function remapUnitCodeLocal(oldCode, newCode) {
    var from = String(oldCode || "");
    var to = String(newCode || "");
    if (!from || !to || from === to) return;
    if (bundles[from]) {
      bundles[to] = bundles[from];
      delete bundles[from];
      if (bundles[to] && bundles[to].report) bundles[to].report.code = to;
    }
    if (state.unitReportStatus[from]) {
      state.unitReportStatus[to] = state.unitReportStatus[from];
      delete state.unitReportStatus[from];
    }
    if (String(state.openCode || "") === from) state.openCode = to;
    if (String(state.reportRoot || "") === from) state.reportRoot = to;
    if (String(state.reportKey || "") === from) {
      state.reportKey = to;
      if (state.report) state.report.code = to;
    }
  }

  function removeIssuedUnit(unitId) {
    var removed = null;
    state.units = state.units.filter(function (unit) {
      if (unit.id === unitId) {
        removed = unit;
        return false;
      }
      return true;
    });
    if (removed) {
      delete state.unitReportStatus[removed.code];
      delete bundles[removed.code];
    }
    return removed;
  }

  function confirmAccessChange() {
    var change = state.accessChange;
    if (!change || !canBranch()) return Promise.resolve();
    var unit = null;
    for (var i = 0; i < state.units.length; i++) {
      if (state.units[i].id === change.unitId) unit = state.units[i];
    }
    if (!unit) {
      closeAccessChange();
      return Promise.resolve();
    }
    if (String(unit.parent || "").toLowerCase() !== actorKey().toLowerCase()) {
      closeAccessChange();
      return Promise.resolve();
    }
    var folderId = folderIdFromLink(state.driveFolder);
    var token = driveToken || "";

    if (change.deletePending) {
      removeIssuedUnit(unit.id);
      state.accessChange = null;
      save();
      if (!token || !folderId) {
        render();
        return Promise.resolve();
      }
      return upsertOwnUnitFile(token, folderId).then(function () {
        state.driveNote = "Список нижчих оновлено.";
        render();
      }).catch(function () {
        state.driveNote = "Ланку прибрано локально; синхрон файлу не вдався.";
        render();
      });
    }

    var nextCode = String(change.newCode || "").trim();
    if (!nextCode || nextCode === unit.code) {
      change.note = change.newCode ? "" : "Спочатку натисніть «Змінити».";
      render();
      return Promise.resolve();
    }
    var oldCode = String(unit.code || "");
    unit.code = nextCode;
    remapUnitCodeLocal(oldCode, nextCode);
    state.accessChange = null;
    save();

    if (!token || !folderId) {
      render();
      return Promise.resolve();
    }
    return resealChildUnitFile(token, folderId, oldCode, nextCode).then(function (reseal) {
      return upsertOwnUnitFile(token, folderId).then(function () {
        return reseal;
      });
    }).then(function (reseal) {
      if (reseal && reseal.ok) state.driveNote = "Доступ змінено, файл підлеглого перезапечатано.";
      else state.driveNote = "Новий код збережено; файл підлеглого не перезапечатано.";
      render();
    }).catch(function () {
      state.driveNote = "Новий код збережено локально; синхрон не вдався.";
      render();
    });
  }

    var base = null;
    for (var i = 0; i < TYPES.length; i++) {

    if (base) {
      state.typeOverrides[id] = { name: label, one: label };

    var grid = el("div", { className: "calendar-grid" });

    for (i = 0; i < startWeekday; i++) {

    var today = todayISO();
    for (i = 1; i <= daysInMonth; i++) {

  var justOpened = "";

  function motionOff() {
    if (document.documentElement.classList.contains("is-test")) return true;
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  function wrapReveal(node, key) {
    if (!node) return node;
    node.classList.add("reveal");
    var body = el("div", { className: "reveal-body" });
    while (node.firstChild) body.appendChild(node.firstChild);
    node.appendChild(body);
    if (key && key === justOpened) node.setAttribute("data-fresh", "1");
    return node;
  }

  function armReveals() {
    document.querySelectorAll(".reveal[data-fresh]").forEach(function (node) {
      node.removeAttribute("data-fresh");
      if (motionOff()) return;
      node.classList.add("is-collapsed");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { node.classList.remove("is-collapsed"); });
      });
    });
    justOpened = "";
  }

  function collapseThen(node, done) {
    if (!node || motionOff()) {
      done();
      return;
    }
    node.classList.add("is-collapsed");
    var finished = false;
    function finish(event) {
      if (finished) return;
      if (event && event.target !== node) return;
      finished = true;
      done();
    }
    node.addEventListener("transitionend", finish);
    setTimeout(function () { finish(); }, 280);
  }

  function toggle(id) {
    if (state.open.has(id)) {
      state.open.delete(id);
      if (state.editing === id) discardEdits();
      collapseThen(document.getElementById(panelDomId(id)), render);
      return;
    }
    state.open.add(id);
    justOpened = id;
    pendingScroll = panelDomId(id);
    render();
  }

  function applyCode(raw) {
    var keepReportRoot = String(state.reportRoot || "").trim();
    var typed = String(raw || "").trim();
    var code = typed.toLowerCase();
    // Старий внутрішній код верхівки.
    if (code === "sluzhba") code = "lead";
    state.codeDraft = typed;
    if (!code) {
      state.codeError = "Впишіть код.";
      render();
      return;
    }
    var scope = CODES[code];
    var unit = scope ? null : findUnitByCode(typed);
    var grant = scope || unit ? null : findAccessGrant(typed);
    if (!scope && !unit && !grant) {
      state.codeError = "Такого коду на цьому пристрої немає.";
      render();
      return;
    }
    state.activeGrant = null;
    if (grant) {
      state.scope = "grant";
      state.openCode = grant.code;
      state.holder = grant.forWhom || "";
      state.activeGrant = grant;
    } else if (unit) {
      state.scope = "all";
      state.openCode = unit.code;
      state.holder = unit.name;
    } else {
      state.scope = scope;
      state.openCode = code;
      if (code === "lead") state.holder = "Служба";
      else state.holder = "";
    }
    activateReport(state.openCode);
    if (!grant && !unit && code !== "lead" && scope === "all") {
      state.holder = (state.report && state.report.name) || "";
    }
    // ZS-107: якщо відкриваємо відому дитину поточного кореня — не збивати reportRoot на її код.
    if (state.scope === "all") {
      var opened = String(state.openCode || "").trim();
      if (
        unit &&
        keepReportRoot &&
        keepReportRoot.toLowerCase() !== opened.toLowerCase() &&
        subordinatesFor(keepReportRoot).some(function (row) {
          return row && String(row.code).toLowerCase() === opened.toLowerCase();
        })
      ) {
        state.reportRoot = keepReportRoot;
      } else {
        state.reportRoot = state.openCode;
      }
    }
    state.codeError = "";
    state.codeDraft = "";
    state.profile = false;
    state.profilePane = "";
    state.unitNameDraft = "";
    state.unitError = "";
    state.statusEdit = "";
    state.machineStatusEdit = "";
    state.statusNameDraft = "";
    state.machineStatusNameDraft = "";
    state.statusPlus = true;
    state.machineStatusPlus = true;
    state.statusListOpen = false;
    state.machineStatusListOpen = false;
    state.confirm = null;
    state.draft = null;
    state.changesOpen = false;
    discardEdits();
    state.open.clear();
    save();
    render();
  }

  function newId(prefix) {
    return prefix + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  }

  function findPerson(id) {
    var found = null;
    function walk(node) {
      (node.people || []).some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
      if (!found) (node.children || []).forEach(walk);
    }
    walk(viewUnit());
    if (!found) {
      state.added.people.some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
    }
    return found;
  }

  function findMachine(id) {
    var found = null;
    viewMachines().some(function (item) {
      if (item.id === id) found = item;
      return !!found;
    });
    if (!found) {
      state.added.machines.some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
    }
    return found;
  }

  function removalQuestion(kind, id) {
    if (kind === "duty") {
      var personDuty = dutyMap()[id];
      return "Видалити статус «" + (personDuty ? personDuty.label : "") + "»?";
    }
    if (kind === "machineDuty") {
      var gearDuty = machineDutyMap()[id];
      return "Видалити стан «" + (gearDuty ? gearDuty.label : "") + "»?";
    }
    if (kind === "type") {
      var typeItem = typeById(id);
      return "Видалити тип «" + (typeItem ? typeItem.name : "") + "»?";
    }
    if (kind === "person") {
      var personItem = findPerson(id);
      var who = personItem ? (personCallsign(personItem) || personName(personItem)) : "";
      return "В архів картку «" + who + "»?";
    }
    var machine = findMachine(id);
    var what = machine ? (machineName(machine) || machineBoard(machine)) : "";
    return "В архів машину «" + what + "»?";
  }

  function renderConfirmBox() {
    var box = el("div", { className: "confirm", attrs: { id: "confirm-ask", role: "dialog" } });
    var archive = state.confirm.kind === "person" || state.confirm.kind === "machine";
    box.append(el("p", { text: removalQuestion(state.confirm.kind, state.confirm.id) }));
    box.append(el("button", { className: "remove", text: archive ? "В архів" : "Видалити", attrs: { type: "button", "data-confirm-delete": "1" } }));
    box.append(el("button", { className: "remove", text: "Скасувати", attrs: { type: "button", "data-cancel-delete": "1" } }));
    return box;
  }

  function blankDraft(kind) {
    if (kind === "machine") {
      return {
        kind: "machine",
        id: "draft",
        name: "",
        type: "",
        board: "",
        unit: "",
        accounting: "official",
        duty: "in",
        mileage: null,
        hours: null,
        service: ""
      };
    }
    return {
      kind: "person",
      id: "draft",
      surname: "",
      givenName: "",
      patronymic: "",
      name: "",
      rank: "",
      callsign: "",
      unit: "",
      position: "",
      accounting: "official",
      duty: "in"
    };
  }

  function renderDraftOverlay() {
    var overlay = el("div", { className: "overlay", attrs: { id: "card-overlay", role: "dialog" } });
    var sheet = el("div", { className: "overlay-sheet" });
    sheet.append(el("div", { className: "pull-bar", attrs: { "aria-hidden": "true" } }));
    if (state.draft.kind === "machine") sheet.append(renderMachineCard(state.draft, true));
    else sheet.append(renderPersonCard(state.draft, true));
    overlay.append(sheet);
    return overlay;
  }

  function openDraft(kind) {
    if (!canDelete()) return;
    if (state.draft && state.draft.kind === kind) return;
    state.confirm = null;
    state.draft = blankDraft(kind);
    render();
  }

  function placeFromUnit(value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    var lower = raw.toLowerCase();
    var found = "";
    function walk(node, trail) {
      var next = trail.concat([node]);
      var path = next.map(function (item) { return item.name; }).join(" · ");
      if (node.people && (node.name === raw || path === raw || node.name.toLowerCase() === lower || path.toLowerCase() === lower)) found = node.id;
      (node.children || []).forEach(function (child) { walk(child, next); });
    }
    walk(viewUnit(), []);
    return found;
  }

  function defaultPersonPlace() {
    var root = viewUnit();
    if (root.people) return root.id;
    var found = "";
    function walk(node) {
      if (found) return;
      if (node.people) found = node.id;
      (node.children || []).forEach(walk);
    }
    walk(root);
    return found || root.id;
  }

  function typeFromLabel(value) {
    var raw = String(value || "").trim();
    if (!raw) return OTHER_TYPE.id;
    var lower = raw.toLowerCase();
    if (raw === OTHER_TYPE.name || raw === OTHER_TYPE.one || lower === "інше") return OTHER_TYPE.id;
    var list = typeCatalog();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === raw) return list[i].id;
      if (list[i].one === raw || list[i].name === raw || list[i].one.toLowerCase() === lower || list[i].name.toLowerCase() === lower) return list[i].id;
    }
    return OTHER_TYPE.id;
  }

  function resolveMachineTypeId(raw) {
    var value = String(raw == null ? "" : raw).trim();
    if (!value) return OTHER_TYPE.id;
    return typeFromLabel(value);
  }

  function addedPerson(id) {
    for (var i = 0; i < state.added.people.length; i++) {
      if (state.added.people[i].id === id) return state.added.people[i];
    }
    return null;
  }

  function addedMachine(id) {
    for (var i = 0; i < state.added.machines.length; i++) {
      if (state.added.machines[i].id === id) return state.added.machines[i];
    }
    return null;
  }

  function openUnitPath(placeId) {
    var path = findNode(viewUnit(), placeId, []);
    if (!path) return;
    path.forEach(function (node) {
      if (node.id !== viewUnit().id) state.open.add("unit:" + node.id);
    });
  }

  function applyDraftField(node) {
    if (!state.draft || !node || !node.getAttribute) return false;
    var field = node.getAttribute("data-draft-field");
    if (!field) return false;
    if (field === "mileage" || field === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) state.draft[field] = null;
      else {
        var num = parseInt(trimmed, 10);
        state.draft[field] = isNaN(num) ? null : num;
      }
    } else {
      state.draft[field] = String(rawControl(node) || "").slice(0, 80);
    }
    return true;
  }

  function syncDraftFromDom() {
    var root = document.getElementById("card-overlay");
    if (!root || !state.draft) return;
    root.querySelectorAll("[data-draft-field]").forEach(applyDraftField);
  }

  function saveDraft() {
    if (!canDelete() || !state.draft) return;
    syncDraftFromDom();
    var draft = state.draft;
    if (draft.kind === "person") {
      var place = placeFromUnit(draft.unit) || defaultPersonPlace();
      var personId = newId("np");
      var draftParts = {
        surname: draft.surname || "",
        givenName: draft.givenName || "",
        patronymic: draft.patronymic || ""
      };
      if (!draftParts.surname && !draftParts.givenName && !draftParts.patronymic && draft.name) {
        draftParts = splitLegacyName(draft.name);
      }
      state.added.people.push({
        id: personId,
        surname: draftParts.surname,
        givenName: draftParts.givenName,
        patronymic: draftParts.patronymic,
        name: joinPersonName(draftParts),
        rank: draft.rank || "",
        callsign: draft.callsign || "",
        unit: String(draft.unit || "").slice(0, 80),
        accounting: draft.accounting || "official",
        duty: draft.duty || "in",
        position: draft.position || "",
        place: place
      });
      state.positions[personId] = draft.position || "";
      openUnitPath(place);
    } else {
      var typeId = resolveMachineTypeId(draft.type);
      var machineId = newId("nm");
      state.added.machines.push({
        id: machineId,
        type: typeId,
        name: draft.name || "",
        board: draft.board || "",
        accounting: draft.accounting || "official",
        duty: draft.duty || "in",
        mileage: draft.mileage == null ? null : draft.mileage,
        hours: draft.hours == null ? null : draft.hours,
        service: draft.service || ""
      });
      state.open.add("type:" + typeId);
    }
    state.draft = null;
    state.confirm = null;
    save();
    render();
  }

  function discardEdits() {
    state.editing = null;
    state.pending = null;
  }

  function discardDraft() {
    state.draft = null;
    state.confirm = null;
    discardEdits();
    render();
  }

  var FIELD_LABEL = {
    name: "ПІП",
    surname: "Прізвище",
    givenName: "Ім’я",
    patronymic: "По батькові",
    rank: "Звання",
    unit: "Підрозділ",
    callsign: "Позивний",
    position: "Посада",
    type: "Тип",
    board: "Борт",
    duty: "Стан",
    accounting: "Облік",
    mileage: "Пробіг",
    hours: "Мотогодини",
    service: "Останнє ТО"
  };

  function canJournal() {
    return state.scope === "all" && !!state.holder;
  }

  function plainValue(value) {
    if (value == null || value === "") return "немає";
    return String(value);
  }

  function sameValue(before, after) {
    return plainValue(before) === plainValue(after);
  }

  function currentFieldValue(kind, id, fieldName) {
    if (kind === "person") {
      var personItem = findPerson(id);
      if (!personItem) return "";
      if (fieldName === "name") return personName(personItem);
      if (fieldName === "surname" || fieldName === "givenName" || fieldName === "patronymic") {
        return personNamePart(personItem, fieldName);
      }
      if (fieldName === "rank") return personRank(personItem);
      if (fieldName === "unit") return personUnit(personItem);
      if (fieldName === "callsign") return personCallsign(personItem);
      if (fieldName === "position") return positionOf(personItem);
      if (fieldName === "duty") {
        var personDuty = dutyMap()[personDutyKey(personItem)];
        return personDuty ? personDuty.label : "";
      }
      if (fieldName === "accounting") {
        var personAccount = ACCOUNTING[personAccountingKey(personItem)];
        return personAccount ? personAccount.label : "";
      }
      return "";
    }
    var machine = findMachine(id);
    if (!machine) return "";
    if (fieldName === "name") return machineName(machine);
    if (fieldName === "type") return machineTypeLabel(machine);
    if (fieldName === "board") return machineBoard(machine);
    if (fieldName === "unit") return machineUnit(machine);
    if (fieldName === "duty") {
      var duty = machineDutyMap()[machineDutyKey(machine)];
      return duty ? duty.label : "";
    }
    if (fieldName === "accounting") {
      var account = ACCOUNTING[machineAccountingKey(machine)];
      return account ? account.label : "";
    }
    if (fieldName === "mileage") return machineMileage(machine);
    if (fieldName === "hours") return machineHours(machine);
    if (fieldName === "service") return machineService(machine) || "";
    return "";
  }

  function controlValue(node) {
    var fieldName = node.getAttribute("data-edit-field") || node.getAttribute("data-position-for") && "position";
    if (fieldName === "mileage" || fieldName === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) return null;
      var num = parseInt(trimmed, 10);
      return isNaN(num) ? null : num;
    }
    if (node.classList && node.classList.contains("pick")) {
      var shown = node.querySelector(".pick-current");
      return shown ? String(shown.textContent || "") : "";
    }
    if (node.tagName === "SELECT") {
      var option = node.options[node.selectedIndex];
      return option ? option.text : String(node.value || "");
    }
    return String(node.value || "").slice(0, 80);
  }

  function rawControl(node) {
    if (node && node.classList && node.classList.contains("pick")) return node.getAttribute("data-value") || "";
    return node && node.value != null ? node.value : "";
  }

  function noteChange(fieldName, before, after) {
    if (!canJournal() || sameValue(before, after)) return;
    var label = FIELD_LABEL[fieldName] || fieldName;
    state.changes.push({
      who: state.holder,
      field: label,
      before: plainValue(before).slice(0, 80),
      after: plainValue(after).slice(0, 80)
    });
    if (state.changes.length > 100) state.changes = state.changes.slice(-100);
  }

  function commitCard(spec) {
    var parts = String(spec || "").split(":");
    var kind = parts[0];
    var id = parts.slice(1).join(":");
    var root = document.getElementById(panelDomId(kind + ":" + id));
    if (root) {
      root.querySelectorAll("[data-edit-kind]").forEach(function (node) {
        noteChange(node.getAttribute("data-edit-field"), currentFieldValue(kind, id, node.getAttribute("data-edit-field")), controlValue(node));
        applyFieldEdit(node);
      });
      var post = root.querySelector("[data-position-for]");
      if (post) {
        noteChange("position", currentFieldValue("person", id, "position"), controlValue(post));
        state.positions[post.getAttribute("data-position-for")] = String(post.value || "").slice(0, 80);
      }
    }
    discardEdits();
    save();
    render();
  }

  function renderChanges() {
    if (state.scope !== "all") return null;
    if (!state.changes.length) return null;
    var section = el("section", { className: "block", attrs: { id: "changes", "aria-labelledby": "changes-title" } });
    var btn = el("button", {
      className: "changes-open",
      attrs: {
        type: "button",
        id: "changes-title",
        "data-open-changes": "1",
        "aria-label": "Що змінено, відкрити журнал"
      }
    });
    btn.append(el("span", { text: "Що змінено" }));
    btn.append(el("span", { className: "meta", text: String(state.changes.length) }));
    section.append(btn);
    return section;
  }

  function renderChangesOverlay() {
    var overlay = el("div", { className: "overlay", attrs: { id: "changes-overlay", role: "dialog", "aria-label": "Що змінено" } });
    var sheet = el("div", { className: "overlay-sheet is-compact" });
    sheet.append(el("div", { className: "pull-bar", attrs: { "aria-hidden": "true" } }));
    var head = el("div", { className: "card-head" });
    head.append(el("h2", { text: "Що змінено" }));
    head.append(iconButton("x", "Закрити", { "data-close-changes": "1" }));
    sheet.append(head);
    var list = el("ul", { className: "change-list" });
    state.changes.forEach(function (item) {
      list.append(el("li", { text: item.who + ". " + item.field + ". Було: " + item.before + ". Стало: " + item.after + "." }));
    });
    sheet.append(list);
    overlay.append(sheet);
    return overlay;
  }

  function rememberPending(node) {
    if (!node || !node.getAttribute) return false;
    var kind = node.getAttribute("data-edit-kind");
    var id = node.getAttribute("data-edit-id");
    var fieldName = node.getAttribute("data-edit-field");
    if (!kind && node.getAttribute("data-position-for")) {
      kind = "person";
      id = node.getAttribute("data-position-for");
      fieldName = "position";
    }
    if (!kind || !id || !fieldName) return false;
    if (state.editing !== kind + ":" + id) return false;
    if (!state.pending || state.pending.key !== state.editing) state.pending = { key: state.editing, fields: {} };
    state.pending.fields[fieldName] = rawControl(node);
    return true;
  }

  function saveDutyEdit(machine, id, rawName, plus) {
    if (!canEditCatalogs() || !id) return;
    var label = String(rawName || "").replace(/\s+/g, " ").trim().slice(0, 80);
    if (!label) return;
    var map = machine ? machineDutyMap() : dutyMap();
    var taken = Object.keys(map).some(function (key) {
      return key !== id && map[key].label.toLowerCase() === label.toLowerCase();
    });
    if (taken) return;
    var base = machine ? MACHINE_DUTY : DUTY;
    var custom = machine ? state.customMachineDuties : state.customDuties;
    if (base[id]) {
      var overrides = machine ? state.machineDutyOverrides : state.dutyOverrides;
      overrides[id] = { label: label, plus: !!plus };
    } else {
      custom.forEach(function (item) {
        if (item.id === id) {
          item.label = label;
          item.plus = !!plus;
        }
      });
    }
    if (machine) {
      state.machineStatusEdit = "";
      state.machineStatusNameDraft = "";
      state.machineStatusPlus = true;
    } else {
      state.statusEdit = "";
      state.statusNameDraft = "";
      state.statusPlus = true;
    }
    save();
    render();
  }

  function deleteDuty(kind, id) {
    if (!canEditCatalogs()) return;
    var machine = kind === "machineDuty";
    var custom = machine ? state.customMachineDuties : state.customDuties;
    var next = custom.filter(function (item) { return item.id !== id; });
    if (next.length !== custom.length) {
      if (machine) state.customMachineDuties = next;
      else state.customDuties = next;
    } else if (machine) state.machineDutyRemoved[id] = true;
    else state.dutyRemoved[id] = true;
    if (machine) {
      delete state.machineDutyOverrides[id];
      state.machineStatusEdit = "";
      state.machineStatusNameDraft = "";
      state.machineStatusPlus = true;
    } else {
      delete state.dutyOverrides[id];
      state.statusEdit = "";
      state.statusNameDraft = "";
      state.statusPlus = true;
    }
    state.confirm = null;
    save();
    render();
  }

  function confirmRemoval() {
    if (!state.confirm) return;
    if (state.confirm.kind === "duty" || state.confirm.kind === "machineDuty") {
      deleteDuty(state.confirm.kind, state.confirm.id);
      return;
    }
    if (state.confirm.kind === "type") {
      deleteType(state.confirm.id);
      return;
    }
    if (!canDelete()) return;
    if (state.confirm.kind === "person") state.removed.people[state.confirm.id] = true;
    if (state.confirm.kind === "machine") state.removed.machines[state.confirm.id] = true;
    state.confirm = null;
    save();
    render();
  }

  function issueWideAccess(rawWho, personIds, machineIds, tasksAll) {
    if (state.scope !== "all") return;
    var who = String(rawWho || "").replace(/\s+/g, " ").trim().slice(0, 40);
    var people = (personIds || []).map(String).filter(Boolean);
    var machines = (machineIds || []).map(String).filter(Boolean);
    var allTasks = !!tasksAll;
    if (!people.length && !machines.length && !allTasks) {
      state.accessNote = "Оберіть штат або завдання.";
      render();
      return;
    }
    state.accessGrants.push({
      id: "g" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36),
      code: generateUnitCode(),
      unitKey: state.reportKey || actorKey() || "1rota",
      forWhom: who,
      personIds: people.slice(0, 200),
      machineIds: machines.slice(0, 200),
      tasksAll: allTasks,
      taskIds: []
    });
    state.accessForDraft = "";
    state.accessPersonDraft = {};
    state.accessMachineDraft = {};
    state.accessTasksAllDraft = false;
    state.accessNote = "";
    save();
    render();
  }

  function createUnit(raw) {
    if (!canBranch()) return;
    var name = String(raw || "").trim().slice(0, 80);
    state.unitNameDraft = name;
    if (!name) {
      state.unitError = "Впишіть назву.";
      render();
      return;
    }
    var created = {
      id: "u" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36),
      name: name,
      code: generateUnitCode(),
      parent: actorKey()
    };
    state.units.push(created);
    setUnitReportStatus(created.code, "missing");
    var doc = emptyUnitReport(created);
    bundles[created.code] = {
      edits: { people: {}, machines: {} },
      removed: { people: {}, machines: {} },
      added: { people: [], machines: [] },
      positions: {},
      changes: [],
      report: doc
    };
    state.unitNameDraft = "";
    state.unitError = "";
    offerReportFile(doc);
    save();
    render();
  }

  function applyFieldEdit(node) {
    if (!node || !node.getAttribute) return false;
    var kind = node.getAttribute("data-edit-kind");
    if (!kind) return false;
    var id = node.getAttribute("data-edit-id");
    var fieldName = node.getAttribute("data-edit-field");
    var bucket = kind === "machine" ? state.edits.machines : state.edits.people;
    if (!bucket[id]) bucket[id] = {};
    if (fieldName === "mileage" || fieldName === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) bucket[id][fieldName] = null;
      else {
        var num = parseInt(trimmed, 10);
        bucket[id][fieldName] = isNaN(num) ? null : num;
      }
    } else {
      bucket[id][fieldName] = String(rawControl(node) || "").slice(0, 80);
    }
    if (kind === "person" && (fieldName === "surname" || fieldName === "givenName" || fieldName === "patronymic" || fieldName === "name")) {
      var named = findPerson(id) || addedPerson(id);
      if (named) {
        var synced = personNameParts(named);
        bucket[id].surname = synced.surname;
        bucket[id].givenName = synced.givenName;
        bucket[id].patronymic = synced.patronymic;
        bucket[id].name = joinPersonName(synced);
        if (addedPerson(id)) {
          named.surname = synced.surname;
          named.givenName = synced.givenName;
          named.patronymic = synced.patronymic;
          named.name = bucket[id].name;
        }
      }
    }
    if (kind === "person" && fieldName === "unit") {
      var personItem = addedPerson(id) || findPerson(id);
      if (personItem) personItem.unit = String(bucket[id].unit || "").slice(0, 80);
      var addedOnly = addedPerson(id);
      var place = addedOnly ? placeFromUnit(bucket[id].unit) : "";
      if (addedOnly && place) {
        addedOnly.place = place;
        openUnitPath(place);
      }
    }
    if (kind === "machine" && fieldName === "type") {
      var machineItem = addedMachine(id) || findMachine(id);
      var typeId = resolveMachineTypeId(bucket[id].type);
      if (machineItem) {
        machineItem.type = typeId;
        bucket[id].type = typeId === OTHER_TYPE.id ? "" : (typeById(typeId) ? typeById(typeId).one : "");
        state.open.add("type:" + typeId);
      }
    }
    return true;
  }

  function onClick(event) {
    closeOpenLists(event.target);
    var pickChoice = event.target.closest("[data-pick-value]");
    if (pickChoice) {
      var picked = pickChoice.closest(".pick");
      if (picked) choosePick(picked, pickChoice.getAttribute("data-pick-value"));
      return;
    }
    var pickToggle = event.target.closest("[data-pick-toggle]");
    if (pickToggle) {
      togglePick(pickToggle.getAttribute("data-pick-toggle"));
      return;
    }
    if (blockToggleRow) {
      var swiped = blockToggleRow;
      blockToggleRow = null;
      if (swiped.contains(event.target) && !event.target.closest("[data-remove]")) return;
    }
    var discard = event.target.closest("[data-discard-draft]");
    if (discard) {
      discardDraft();
      return;
    }
    var saveCard = event.target.closest("[data-save-card]");
    if (saveCard) {
      if (saveCard.getAttribute("data-save-card") === "draft") saveDraft();
      else commitCard(saveCard.getAttribute("data-save-card"));
      return;
    }
    var editCard = event.target.closest("[data-edit-card]");
    if (editCard) {
      var editKey = editCard.getAttribute("data-edit-card");
      if (editKey && editKey !== "draft") {
        state.editing = editKey;
        if (!state.pending || state.pending.key !== editKey) state.pending = { key: editKey, fields: {} };
        render();
      }
      return;
    }

  function onChange(event) {
    if (applyDraftField(event.target)) return;
    if (rememberPending(event.target)) return;
    var personBox = event.target.closest("[data-access-person]");
    if (personBox) {
      var personId = personBox.getAttribute("data-access-person");
      if (personBox.checked) state.accessPersonDraft[personId] = true;
      else delete state.accessPersonDraft[personId];
      return;
    }
    var machineBox = event.target.closest("[data-access-machine]");
    if (machineBox) {
      var machineId = machineBox.getAttribute("data-access-machine");
      if (machineBox.checked) state.accessMachineDraft[machineId] = true;
      else delete state.accessMachineDraft[machineId];
      return;
    }
    if (event.target.closest("[data-access-tasks-all]")) {
      state.accessTasksAllDraft = !!event.target.checked;
      return;
    }
    var box = event.target.closest("[data-gear]");
    if (!box) return;
    var group = box.getAttribute("data-gear");
    var fieldName = box.getAttribute("data-field");
    if (group === "people" && Object.prototype.hasOwnProperty.call(state.peopleFields, fieldName)) {
      state.peopleFields[fieldName] = box.checked;
    }
    if (group === "machine" && Object.prototype.hasOwnProperty.call(state.machineFields, fieldName)) {
      state.machineFields[fieldName] = box.checked;
    }
    if (group === "equipment" && Object.prototype.hasOwnProperty.call(state.equipmentRows, fieldName)) {
      state.equipmentRows[fieldName] = box.checked;
    }
    save();
    render();
  }

      return;

    if (node.id === "access-for") {
      state.accessForDraft = node.value.slice(0, 40);

    if (node.id === "drive-folder") {
      state.driveFolder = String(node.value || "").slice(0, 240);
      state.driveClient = DRIVE_CLIENT;
      save();
      return;
    }
    if (node.id === "drive-encrypt-key") {
      state.driveEncryptKey = String(node.value || "").slice(0, 500);
      save();
      return;
    }
    if (node.id === "status-name") {
      state.statusNameDraft = node.value.slice(0, 80);
      return;
    }
    if (node.id === "machine-status-name") {
      state.machineStatusNameDraft = node.value.slice(0, 80);
      return;
    }
    if (node.id === "type-name") {
      state.typeNameDraft = node.value.slice(0, 80);
      return;
    }
    if (rememberPending(node)) return;
  }

  function runSelfTest() {
    var failures = [];
    function check(cond, message) {
      if (!cond) failures.push(message);
    }
    function text(id) {
      var node = document.getElementById(id);
      return node ? node.textContent : "";
    }
    function checkTitleIcons(root, title, xLabel) {
      var head = root ? root.querySelector(".card-head") : null;
      var heading = head ? head.querySelector("h3") : null;
      var tools = head ? head.querySelectorAll(".card-actions .tool") : [];
      check(!!heading && heading.textContent === title, "заголовок картки: " + title);
      check(tools.length === 3, "три іконки в рядку заголовка");
      if (!heading || tools.length !== 3) return;
      var titleBox = heading.getBoundingClientRect();
      var strokes = [];
      var widths = [];
      var labels = [xLabel || "Видалити", "Зберегти", "Редагувати"];
      var kinds = ["tool-x", "tool-check", "tool-pencil"];
      for (var i = 0; i < tools.length; i++) {
        var toolBox = tools[i].getBoundingClientRect();
        var mark = tools[i].querySelector("svg").getBoundingClientRect();
        var css = getComputedStyle(tools[i]);
        check(toolBox.left + 1 >= titleBox.left, "іконка праворуч від назви");
        check(toolBox.width >= 44 && toolBox.height >= 44, "зона іконки");
        check(mark.width >= 34 && mark.width <= 40 && mark.height >= 34 && mark.height <= 40, "розмір іконки");
        check(css.borderTopWidth === "0px" && (css.backgroundColor === "rgba(0, 0, 0, 0)" || css.backgroundColor === "transparent"), "іконка без рамки");
        check(tools[i].textContent.trim() === "", "іконка без підпису");
        check(tools[i].getAttribute("aria-label") === labels[i], "назва дії " + labels[i]);
        check(tools[i].classList.contains(kinds[i]), "вид іконки " + kinds[i]);
        strokes.push(tools[i].querySelector("svg").getAttribute("stroke-width"));
        widths.push(Math.round(mark.width * 10));
      }
      check(strokes[0] === strokes[1] && strokes[1] === strokes[2] && strokes[0] === "2.8", "однакова товщина лінії");
      check(widths[0] === widths[1] && widths[1] === widths[2], "однаковий розмір іконок");
      check(!root.querySelector(".name-row"), "іконки не в полі імені");
    }
    function checkOverlayFrame() {
      var overlay = document.getElementById("card-overlay");
      var sheet = overlay ? overlay.querySelector(".overlay-sheet") : null;
      check(!!sheet, "є вікно картки");
      if (!sheet) return;
      var box = sheet.getBoundingClientRect();
      var outer = overlay.getBoundingClientRect();
      if (window.innerWidth >= 840) {
        check(Math.abs(box.width - 768) <= 1, "на широкому екрані вікно 768");
        check(box.width < window.innerWidth - 16, "вікно не на весь монітор");
        check(Math.abs((outer.left + outer.width / 2) - (box.left + box.width / 2)) <= 2, "вікно по центру");
      } else {
        check(box.width <= window.innerWidth && box.width >= window.innerWidth - 48, "на телефоні вікно майже на весь екран");
      }
      var dim = getComputedStyle(overlay).backgroundColor;
      check(dim !== "rgba(0, 0, 0, 0)" && dim !== "transparent", "сторінка за вікном затемнена");
    }
    var workWidths = [];
    function checkReportSwitchLayout(label) {
      var report = document.getElementById("report-switch");
      if (!report) return;
      var titleRow = document.querySelector("header.top .title-row");
      var wrap = document.querySelector("header.top .wrap");
      var current = report.querySelector(".pick-current");
      var open = report.querySelector("#open-report");
      var rb = report.getBoundingClientRect();
      var cb = current ? current.getBoundingClientRect() : null;
      var cs = getComputedStyle(report);
      check(cs.display !== "none" && cs.visibility !== "hidden" && Number(cs.opacity) > 0.9, label + ": вибір звіту не сховано");

                  check(String(state.driveDupNote || "").indexOf("потрібен вибір") !== -1, "різне — позначка для користувача");
                });
              });
            }).catch(function (err) {
              window.fetch = originalFetch;
              check(false, "ZS-108 dedupe: " + (err && err.message ? err.message : err));
            });
          });
        });
      })().then(function () {
        // Rollover: вчора → архів, новий день копіює о/с і плани.
        var yesterday = shiftISODate(todayISO(), -1);
        state.daysArchive = {};
        state.fileDay = yesterday;
        state.viewDay = "";
        state.report = {
          name: "Тест",
          code: "1rota",
          file: SAMPLE_FILE,
          unit: { id: "root", name: "Тест", people: [{ id: "px", name: "A", rank: "Солдат", callsign: "X", accounting: "official", duty: "in", position: "" }] },
          machines: [{ id: "mx", name: "M", type: "lat", board: "1", accounting: "official", duty: "in" }],
          tasks: [{ id: "tx", title: "План", status: "plan", people: [] }],
          people: []
        };
        state.changes = [];
        openViewDay(yesterday);
        ensureDayRollover();
        check(state.fileDay === todayISO() && state.viewDay === todayISO(), "rollover відкриває сьогодні");
        check(state.daysArchive[yesterday] && state.daysArchive[yesterday].unit && (state.daysArchive[yesterday].unit.people || []).length === 1, "вчорашній зріз в архіві");
        check(state.report.tasks && state.report.tasks[0] && state.report.tasks[0].status === "plan", "плани лишаються планами");
        check(state.report.machines && state.report.machines[0] && state.report.machines[0].board === "1", "ОВТ як були");
        finishSelfTest();
      });
      });
    }).catch(function (err) {
      check(false, "шифрування кодом: " + (err && err.message ? err.message : err));
      finishSelfTest();
    });
  }

  var gesture = null;
  var blockToggleRow = null;

  function eventElement(event) {
    return event.target && event.target.closest ? event.target : null;
  }

  function onPointerDown(event) {
    if (event.button != null && event.button !== 0) return;
    var target = eventElement(event);
    if (!target) return;
    closeOpenLists(target);
    var swipe = target.closest(".swipe-row");
    if (swipe && !target.closest(".swipe-delete")) {
      gesture = { type: "swipe", x: event.clientX, y: event.clientY, el: swipe, active: false };
      return;
    }
    var sheet = target.closest(".overlay-sheet");
    if (sheet && !target.closest("input, select, textarea, button, a, summary, .pick-list, .status-menu")) {
      gesture = { type: "pull", x: event.clientX, y: event.clientY, el: sheet, active: false };
    }
  }

  function onPointerMove(event) {
    if (!gesture) return;
    var dx = event.clientX - gesture.x;
    var dy = event.clientY - gesture.y;
    if (gesture.type === "swipe") {
      if (dx < -48 && Math.abs(dx) > Math.abs(dy) + 4) {
        gesture.el.classList.add("revealed");
        gesture.active = true;
      }
    } else if (dy > 12 && dy > Math.abs(dx)) {
      gesture.el.style.transform = "translateY(" + Math.min(dy, 160) + "px)";
      gesture.active = dy > 72;
    }
  }

  function onPointerUp() {
    if (!gesture) return;
    var current = gesture;
    gesture = null;
    if (current.type === "pull") {
      current.el.style.transform = "";
      if (current.active) {
        if (current.el.closest("#profile-overlay")) closeProfile();
        else if (current.el.closest("#drive-folder-overlay")) {
          state.driveFolderOpen = false;
          render();
        } else if (current.el.closest("#access-change-overlay")) {
          closeAccessChange();
        } else if (current.el.closest("#calendar-overlay")) {
          state.calendarOpen = false;
          render();
        } else if (state.draft) discardDraft();
        else {
          discardEdits();
          render();
        }
      }
    } else if (current.active) {
      blockToggleRow = current.el;
    }
  }

  function boot() {
    if (new URLSearchParams(location.search).get("test") === "1") document.documentElement.classList.add("is-test");
    var root = document.getElementById("app");
    try {
      assertSeed();
    } catch (err) {
      root.textContent = "Помилка в даних зразка: " + err.message;
      return;
    }
    installSample();
    indexPeople(viewUnit());
    load();
    root.addEventListener("click", onClick);
    root.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" && event.key !== " ") return;
      var syncDrive = event.target.closest("[data-sync-drive]");
      if (!syncDrive) return;
      event.preventDefault();
      startDriveSync();
    });
    root.addEventListener("submit", onSubmit);
    root.addEventListener("change", onChange);
    root.addEventListener("input", onInput);
    document.addEventListener("pointerdown", onPointerDown);
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("pointercancel", onPointerUp);
    document.addEventListener("scroll", placeOpenLists, true);
    window.addEventListener("resize", placeOpenLists);
    var params = new URLSearchParams(location.search);
    if (params.get("open")) {
      params.get("open").split(",").forEach(function (id) {
        if (id.trim()) state.open.add(id.trim());
      });
    }
    var bootCode = params.get("code") || codeFromHash();
    var savedReportRoot = String(state.reportRoot || "").trim();
    if (bootCode) {
      applyCode(bootCode);
      // Після reload: hash може бути кодом підлеглого, а reportRoot видавця — з пам’яті.
      var bootUnit = findUnitByCode(bootCode);
      if (
        bootUnit &&
        savedReportRoot &&
        String(savedReportRoot).toLowerCase() !== String(bootUnit.code).toLowerCase() &&
        subordinatesFor(savedReportRoot).some(function (row) {
          return row && String(row.code).toLowerCase() === String(bootUnit.code).toLowerCase();
        })
      ) {
        state.reportRoot = savedReportRoot;
        save();
        render();
      }
    } else render();
    if (params.get("test") === "1") runSelfTest();
    else refreshFromNetworkOrCache();
    if ((location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1") && typeof navigator !== "undefined" && navigator.serviceWorker) {
      var swRefreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (swRefreshing) return;
        swRefreshing = true;
        location.reload();
      });
      navigator.serviceWorker.register("sw.js").then(function (registration) {
        registration.update().catch(function () {});
      }).catch(function () {});
    }
  }

  var api = {
    assertSeed: assertSeed,
    peopleStats: peopleStats,
    machineStats: machineStats,
    DATA: DATA,
    plural: plural,
    emptyUnitReport: emptyUnitReport,
    sampleReportDocument: sampleReportDocument,
    reportFileName: reportFileName,
    writeReportProof: writeReportProof,
    SAMPLE_FILE: SAMPLE_FILE,
    buildSettingsPayload: buildSettingsPayload,
    applySettingsPayload: applySettingsPayload,
    keyFingerprint: keyFingerprint,
    rememberSettingsAdmin: rememberSettingsAdmin,
    typeCatalog: typeCatalog,
    OTHER_TYPE: OTHER_TYPE,
    resolveMachineTypeId: resolveMachineTypeId,
    canWriteDriveSettings: canWriteDriveSettings,
    canEditCatalogs: canEditCatalogs,
    packInvite: packInvite,
    parseAccessCode: parseAccessCode,
    unitDriveFileName: unitDriveFileName,
    encryptWithCode: encryptWithCode,
    decryptWithCode: decryptWithCode,
    currentUnitSnapshot: currentUnitSnapshot
  };

  if (typeof module !== "undefined" && module.exports) module.exports = api;
  if (typeof document !== "undefined") boot();
})();

  </script>
