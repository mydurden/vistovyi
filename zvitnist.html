<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2820">
  <meta name="color-scheme" content="light">
  <title>Звітність служби</title>
  <style>
:root {
  --bg: #e7e1d6;
  --paper: #fbf8f3;
  --ink: #1b1915;
  --muted: #4a453c;
  --line: #ddd4c6;
  --green: #0e6840;
  --green-ink: #0c4f31;
  --green-soft: #e6f3ec;
  --clay: #8c3b2e;
  --clay-ink: #6d2e23;
  --clay-soft: #f8ece8;
  --header: #1a2820;
  --header-ink: #f4f0e7;
  --header-muted: #d5cec3;
  --amber-soft: #f4efe4;
  --amber-ink: #5c4a2e;
  --done-soft: #eceae6;
  --done-ink: #3e3a34;
  --shadow: 0 1px 2px rgba(27, 25, 21, 0.05), 0 12px 28px rgba(27, 25, 21, 0.05);
  --radius: 16px;
  color-scheme: light;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
}

button, input { font: inherit; color: inherit; }

button { cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

.skip {
  position: absolute;
  left: 12px;
  top: -48px;
  z-index: 3;
  background: #fff;
  color: var(--ink);
  padding: 8px 12px;
  border-radius: 8px;
}

.skip:focus { top: 8px; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.top {
  background: var(--header);
  color: var(--header-ink);
}

.wrap {
  width: min(720px, 100%);
  margin: 0 auto;
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
}

.top .wrap { padding-top: 12px; padding-bottom: 10px; }

h1 {
  margin: 0;
  font-size: 1.35rem;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-row h1 {
  flex: 1 1 auto;
  min-width: 0;
}

.title-row .tool { color: var(--header-ink); }

.field-label {
  display: block;
  margin-bottom: 4px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.top .field-label { color: var(--header-muted); }

.code-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.code-row input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  font-size: 16px;
}

.code-row button,
.primary {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  border-radius: 12px;
  background: #f4f0e7;
  color: var(--header);
  font-weight: 700;
}

.now, .hint, .error, .gloss, .saved, .limit {
  margin: 6px 0 0;
}

.top .now, .top .hint { color: var(--header-muted); font-size: 0.92rem; }

.top .error { color: #ffd2c8; font-size: 0.92rem; margin: 8px 0 0; }

.code-switch { margin: 8px 0 2px; }

.top .code-switch .pick-current,
.top .code-switch .pick-list,
.top .code-switch .pick-option {
  background: var(--paper);
  color: var(--ink);
}

.top .code-switch .pick-current { overflow-wrap: anywhere; }

.top .code-switch .pick-option.is-current { background: #fff; }

.top .code-switch .pick-option code {
  margin-left: 8px;
  font: inherit;
  font-size: 16px;
  color: var(--muted);
}

.changes-empty { margin: 4px 0 8px; font-weight: 700; }

main.wrap {
  padding-top: 12px;
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
}

.block {
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 12px 4px;
  margin: 0 0 8px;
}

.block-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.block-tools {
  display: flex;
  align-items: center;
  margin-left: auto;
}

h2 {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.2;
  font-weight: 700;
}

.frac {
  display: flex;
  align-items: baseline;
  gap: 1px;
  margin: 6px 0 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
}

.frac .num, .frac .den {
  font-weight: 700;
  font-size: 2rem;
}

.frac .num { color: var(--green); }
.frac .num.zero { color: var(--clay); }
.frac .slash { color: var(--muted); font-size: 1.45rem; margin: 0 1px; font-weight: 600; }

.frac.small { margin: 0; flex: 0 0 auto; }
.frac.small .num, .frac.small .den { font-size: 1.05rem; }
.frac.small .slash { font-size: 0.95rem; }

.gloss { color: var(--muted); font-size: 0.92rem; margin: 4px 0 4px; }

.tool {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  appearance: none;
  color: var(--ink);
  line-height: 0;
}

.icon-gear svg,
.icon-plus svg,
.icon-x svg,
.icon-check svg,
.icon-pencil svg,
.icon-profile svg { width: 36px; height: 36px; }

.tool-x { color: var(--clay); }
.tool-check { color: var(--green); }
.tool-pencil { color: var(--ink); }

.card-actions { display: flex; flex: 0 0 auto; align-items: center; }

.name-row {
  display: flex;
  align-items: center;
  min-width: 0;
}

.name-row > input[type="text"] {
  flex: 1 1 auto;
  width: 1%;
  min-width: 0;
  margin-top: 4px;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: rgba(26, 40, 32, 0.5);
  overflow: auto;
  padding: 8px;
}

.overlay-sheet {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: calc(100vh - 16px);
  margin: 0 auto;
  background: var(--paper);
  padding: 8px 12px 32px;
}

.pull-bar {
  width: 44px;
  height: 6px;
  margin: 2px auto 10px;
  border-radius: 999px;
  background: var(--line);
  touch-action: none;
}

.overlay-sheet .card {
  border: 0;
  background: transparent;
  margin: 0;
  padding: 4px 0 12px;
  border-radius: 0;
}

.swipe-row {
  position: relative;
  overflow: hidden;
}

.swipe-delete {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  height: auto;
  width: 52px;
  min-width: 52px;
  transform: translateX(110%);
}

.swipe-row.revealed > .row { transform: translateX(-52px); }
.swipe-row.revealed .swipe-delete { transform: none; }

.icon { display: inline-flex; flex: 0 0 auto; }
.icon svg { display: block; }
.icon-chev { color: var(--muted); transition: transform 0.15s ease; }
[aria-expanded="true"] > .icon-chev { transform: rotate(90deg); }

.row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  padding: 7px 2px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
  touch-action: manipulation;
}

.row:active { background: rgba(26, 40, 32, 0.04); }

.grow { flex: 1 1 auto; min-width: 0; }
.call { display: block; font-weight: 700; overflow-wrap: break-word; }
.pname, .meta { display: block; color: var(--muted); font-size: 0.92rem; overflow-wrap: break-word; }
.inline-hint { color: var(--muted); font-weight: 500; }

.pill {
  flex: 0 0 auto;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  white-space: nowrap;
}

.pill.wrap {
  white-space: normal;
  max-width: 8.5rem;
}

.pill.plus { background: var(--green-soft); color: var(--green-ink); }
.pill.minus { background: var(--clay-soft); color: var(--clay-ink); }
.pill.planned { background: var(--amber-soft); color: var(--amber-ink); }
.pill.doing { background: var(--green-soft); color: var(--green-ink); }
.pill.done { background: var(--done-soft); color: var(--done-ink); }

.panel {
  margin: 0 0 8px 10px;
  padding-left: 8px;
  border-left: 2px solid var(--line);
}

.gear, .card, .short, .glossary {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.gear, .short { margin: 4px 0 8px; padding: 10px 12px; }

.gear h3, .card h3, .glossary summary {
  margin: 0 0 6px;
  font-size: 1rem;
}

.gear label, .check {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  min-height: 36px;
  padding: 4px 0;
}

.check input { width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; flex: 0 0 auto; }

.card { margin: 4px 0 8px; padding: 12px; }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-width: 0;
}

.card-head h3 {
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
  line-height: 1.2;
}

.card input:disabled,
.card select:disabled {
  color: var(--ink);
  opacity: 1;
}

.machine-card .card-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 10px;
  row-gap: 8px;
  margin-top: 8px;
}

.machine-card .card-fields .field {
  margin: 0;
  min-width: 0;
}

.machine-card .card-fields .field.wide {
  grid-column: 1 / -1;
}

.field { margin: 0 0 10px; }
.field .label, .card .label { color: var(--muted); font-size: 0.82rem; font-weight: 700; }
.field .value { font-size: 1rem; overflow-wrap: anywhere; }

button.count-toggle {
  display: block;
  width: auto;
  max-width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 6px 0;
  border: 0;
  background: transparent;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 0.18em;
  touch-action: manipulation;
}

.card input[type="text"],
.card select,
.unit-create input[type="text"],
.unit-create select {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 44px;
  margin-top: 4px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-size: 16px;
}

.card input[type="text"]:disabled,
.card select:disabled {
  background: var(--paper);
  color: var(--ink);
}

.card.is-editing {
  background: var(--paper);
}

.card.is-editing input[type="text"],
.card.is-editing select {
  background: #fff;
  color: var(--ink);
}

.card .name-row > input[type="text"] {
  flex: 1 1 auto;
  width: 1%;
  min-width: 0;
}

.unit-create .label,
.archive .label { display: block; margin-top: 8px; font-weight: 700; }

.section-access .label { display: block; margin-top: 8px; }

.section-access input.for-whom {
  display: block;
  width: 11.5rem;
  max-width: 100%;
  min-height: 44px;
  margin-top: 4px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-size: 16px;
}

.section-access .issue {
  display: block;
  width: 100%;
  min-height: 44px;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-weight: 700;
}

.pick { position: relative; margin-top: 4px; }

.pick-current,
.pick-option {
  appearance: none;
  box-shadow: none;
  font: inherit;
  font-size: 16px;
  font-weight: 400;
  color: var(--ink);
  text-align: left;
}

.pick-current {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}

.card .pick.is-locked .pick-current { background: var(--paper); color: var(--ink); }

.card.is-editing .pick-current { background: #fff; color: var(--ink); }

.pick-list {
  position: fixed;
  z-index: 80;
  margin: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  overflow: auto;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 200ms ease, transform 200ms ease;
}

.pick-list.is-shown {
  opacity: 1;
  transform: translateY(0);
}

.pick-group {
  padding: 8px 12px 4px;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  color: var(--muted);
  background: var(--paper);
}

.pick-option {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 8px 12px;
  border: 0;
  border-radius: 0;
  background: #fff;
}

.pick-option.is-current { background: var(--paper); }

.unit-create .pick-current,
.card .pick-current {
  margin-top: 0;
  font-weight: 400;
}

.unit-create .pick-option,
.card .pick-option {
  margin-top: 0;
  border: 0;
  border-radius: 0;
  font-weight: 400;
  background: #fff;
}

.unit-create .pick-option.is-current,
.card .pick-option.is-current { background: var(--paper); }

.duty-catalog { margin-top: 14px; }

.reveal {
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows 200ms ease, opacity 200ms ease, transform 200ms ease;
}

.reveal > .reveal-body {
  min-height: 0;
  overflow: visible;
}

.reveal.is-collapsed {
  grid-template-rows: 0fr;
  opacity: 0;
  transform: translateY(-4px);
}

.reveal.is-collapsed > .reveal-body {
  overflow: hidden;
}

.status-list .pick-option {
  margin-top: 0;
  border: 0;
  border-radius: 0;
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  font-weight: 400;
  padding: 8px 12px;
}

.status-list summary {
  min-height: 44px;
  padding: 12px 0;
  font-weight: 700;
  cursor: pointer;
}

.status-item { border-top: 1px solid var(--line); padding-top: 8px; }

.status-item .grow { display: block; font-weight: 700; }
.unit-create button,
.archive button,
.remove {
  display: block;
  width: 100%;
  min-height: 44px;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-weight: 700;
}

.confirm {
  margin-top: 10px;
  padding: 10px 12px 4px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--amber-soft);
}

.confirm p {
  margin: 0 0 4px;
  font-weight: 700;
}

.code-line {
  margin: 4px 0 0;
  font-family: ui-monospace, "Cascadia Mono", monospace;
  font-size: 1rem;
  overflow-wrap: anywhere;
  user-select: all;
}

.hint { color: var(--muted); font-size: 0.92rem; }
.saved { color: var(--green-ink); font-size: 0.88rem; }
.limit {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 0.95rem;
}

.change-list { list-style: none; margin: 8px 0 0; padding: 0; }
.change-list li {
  padding: 8px 0;
  border-top: 1px solid var(--line);
  overflow-wrap: anywhere;
}

.people-list { list-style: none; margin: 8px 0 0; padding: 0; }
.people-list li {
  padding: 6px 0;
  border-top: 1px solid var(--line);
}

.linkish {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  margin-top: 4px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  font-weight: 600;
}

.glossary { margin: 4px 0 12px; padding: 4px 12px 8px; }
.glossary summary {
  min-height: 44px;
  display: flex;
  align-items: center;
  cursor: pointer;
  font-weight: 700;
}

.glossary { padding: 4px 12px 8px; }
.glossary summary { margin: 0; font-size: 1rem; }
.glossary .item { margin-top: 10px; }
.glossary .item + .item { margin-top: 10px; }
.glossary .term { font-weight: 700; }
.glossary .text { margin: 2px 0 0; color: var(--muted); }

.error-box {
  margin: 16px;
  padding: 12px;
  background: var(--clay-soft);
  color: var(--clay-ink);
  border-radius: 12px;
}

#test-result {
  margin: 12px;
  padding: 12px;
  border-radius: 12px;
  background: #fff;
  white-space: pre-wrap;
}

@media (min-width: 840px) {
  :root { --work-width: 768px; }
  #app {
    width: var(--work-width);
    min-width: var(--work-width);
    max-width: var(--work-width);
    margin-left: auto;
    margin-right: auto;
  }
  header.top .wrap,
  main.wrap {
    width: 100%;
    min-width: 0;
    max-width: 100%;
  }
  .top .wrap { padding-top: 22px; padding-bottom: 18px; }
  h1 { font-size: 1.6rem; }
  .frac .num, .frac .den { font-size: 2.35rem; }
  main.wrap { padding-top: 20px; }
  .block { padding: 16px 16px 8px; margin-bottom: 16px; }
  .overlay { padding: 28px 16px; }
  .overlay-sheet {
    width: var(--work-width);
    min-width: var(--work-width);
    max-width: var(--work-width);
    min-height: calc(100vh - 56px);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
}

@media (prefers-reduced-motion: reduce) {
  .icon-chev,
  .reveal,
  .pick-list { transition: none; }
}

  </style>
</head>
<body>
  <div id="app"></div>

    var alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var bytes = new Uint8Array(20);
    if (typeof crypto !== "undefined" && crypto.getRandomValues) crypto.getRandomValues(bytes);
    else {
      for (var i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    var raw = "";
    for (var n = 0; n < bytes.length; n++) raw += alphabet[bytes[n] % alphabet.length];
    var code = raw.slice(0, 4) + "-" + raw.slice(4, 8) + "-" + raw.slice(8, 12) + "-" + raw.slice(12, 16) + "-" + raw.slice(16, 20);
    var known = false;
    var lower = code.toLowerCase();
    state.units.forEach(function (unit) {
      if (unit.code.toLowerCase() === lower) known = true;
    });
    state.sectionKeys.forEach(function (item) {

    var typeExpected = { dump: [3, 3], excavator: [1, 2], lat: [2, 2], dozer: [1, 1] };
    TYPES.forEach(function (type) {
      var stats = machineStats(machinesOf(type.id));
      var wantType = typeExpected[type.id];
      if (stats.plus !== wantType[0] || stats.total !== wantType[1]) throw new Error("тип " + type.id);
    });
    var seen = {};
    var personCount = 0;
    var callsigns = {};
    function take(id) {
      if (seen[id]) throw new Error("повтор " + id);
      seen[id] = true;
    }
    function walkPeople(node) {
      (node.people || []).forEach(function (item) {
        personCount += 1;
        take(item.id);
        if (callsigns[item.callsign]) throw new Error("повтор позивного " + item.callsign);
        callsigns[item.callsign] = true;
      });
      (node.children || []).forEach(walkPeople);
    }
    walkPeople(DATA.unit);
    if (personCount !== 18) throw new Error("не 18 військовослужбовців");
    DATA.machines.forEach(function (item) {
      take(item.id);
      if (!MACHINE_DUTY[item.duty]) throw new Error("стан машини");
    });
    DATA.tasks.forEach(function (task) {
      if (!TASK_STATUS[task.status]) throw new Error("стан завдання");
      if (task.restricted) {
        Object.keys(task).forEach(function (key) {
          if (!RESTRICTED_KEYS[key]) throw new Error("зайве поле в обмеженому рядку: " + key);
        });
        if (typeof task.peopleCount !== "number" || !task.name || !task.status) throw new Error("неповний обмежений рядок");
      }
    });

    if (plural(14, "людина", "людини", "людей") !== "людей") throw new Error("plural 14");
    if (plural(11, "людина", "людини", "людей") !== "людей") throw new Error("plural 11");
    if (plural(21, "людина", "людини", "людей") !== "людина") throw new Error("plural 21");
    if (serviceMembers(1) !== "військовослужбовець") throw new Error("в/сл 1");
    if (serviceMembers(2) !== "військовослужбовці") throw new Error("в/сл 2");

    });

    options.forEach(function (pair) {
      if (pair[0] === value) {
        known = true;
        knownLabel = pair[1];
      }
    });

    if (extra) Object.keys(extra).forEach(function (key) { attrs[key] = extra[key]; });
    var box = el("div", { className: "pick", attrs: attrs });

      attrs: { type: "button", "data-pick-toggle": id, "aria-expanded": "false" }

  function closePick(box) {
    var list = box.querySelector(".pick-list:not(.is-closing)");
    box.classList.remove("is-open");
    var btn = box.querySelector(".pick-current");
    if (btn) btn.setAttribute("aria-expanded", "false");
    if (!list) return;
    if (motionOff()) {
      list.remove();
      return;
    }
    list.classList.add("is-closing");
    list.classList.remove("is-shown");
    var finished = false;
    function finish(event) {
      if (finished) return;
      if (event && event.target !== list) return;
      finished = true;
      if (list.parentNode) list.remove();
    }
    list.addEventListener("transitionend", finish);
    setTimeout(function () { finish(); }, 280);
  }

  function placeLayer(layer, anchor) {
    var rect = anchor.getBoundingClientRect();
    var gap = 4;
    var maxH = 280;
    var below = window.innerHeight - rect.bottom - gap - 8;
    var above = rect.top - gap - 8;
    var upward = below < 160 && above > below;
    var room = Math.max(88, Math.min(maxH, upward ? above : below));
    layer.style.left = Math.max(8, rect.left) + "px";
    layer.style.width = Math.max(120, rect.width) + "px";
    layer.style.maxHeight = room + "px";
    if (upward) {
      layer.style.top = "auto";
      layer.style.bottom = (window.innerHeight - rect.top + gap) + "px";
    } else {
      layer.style.bottom = "auto";
      layer.style.top = (rect.bottom + gap) + "px";
    }
  }

  function placePickList(box) {

  function openPick(box) {
    var current = box.getAttribute("data-value") || "";
    var list = el("div", { className: "pick-list" });
    if (box.classList.contains("duty-catalog")) {
      var chooseAttr = box.id === "machine-status-list" ? "data-choose-machine-duty" : "data-choose-duty";
      (box._options || []).forEach(function (pair) {
        var opt = el("button", { className: "pick-option", attrs: { type: "button" } });
        opt.setAttribute(chooseAttr, pair[0]);
        opt.textContent = pair[1];
        list.append(opt);
      });
    } else if (box.classList.contains("rank-pick")) {
      list.append(pickOption("", "", current));
      if (current && !listedRank(current)) list.append(pickOption(current, current, current));
      RANK_GROUPS.forEach(function (group) {
        list.append(el("div", { className: "pick-group", text: group.label }));
        group.ranks.forEach(function (rank) { list.append(pickOption(rank, rank, current)); });
      });
    } else {
      (box._options || []).forEach(function (pair) {
        list.append(pickOption(pair[0], pair[1], current));
      });
      if (box.id === "code-switch") {
        (box._options || []).forEach(function (pair, index) {
          var opt = list.children[index];
          if (!opt) return;
          opt.textContent = "";
          opt.append(el("span", { text: pair[1] }), el("code", { text: pair[0] }));
        });
      }
    }
    box.append(list);
    box.classList.add("is-open");
    var btn = box.querySelector(".pick-current");
    if (btn) btn.setAttribute("aria-expanded", "true");
    placePickList(box);
    if (motionOff()) list.classList.add("is-shown");
    else requestAnimationFrame(function () { list.classList.add("is-shown"); });
  }

  function togglePick(id) {

  function choosePick(box, value) {
    if (box.id === "code-switch") {
      applyCode(value);
      return;
    }
    if (box.classList.contains("is-locked")) {
      closePick(box);
      return;
    }
    var label = "";
    (box._options || []).forEach(function (pair) {
      if (pair[0] === value) label = pair[1];
    });
    box.setAttribute("data-value", value);
    var shown = box.querySelector(".pick-current span");
    if (shown) shown.textContent = label;
    if (box.id === "section-scope") state.sectionScopeDraft = value;
    closePick(box);
    if (!applyDraftField(box)) rememberPending(box);

  var justOpened = "";

  function motionOff() {
    if (document.documentElement.classList.contains("is-test")) return true;
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  function wrapReveal(node, key) {
    if (!node) return node;
    node.classList.add("reveal");
    var body = el("div", { className: "reveal-body" });
    while (node.firstChild) body.appendChild(node.firstChild);
    node.appendChild(body);
    if (key && key === justOpened) node.setAttribute("data-fresh", "1");
    return node;
  }

  function armReveals() {
    document.querySelectorAll(".reveal[data-fresh]").forEach(function (node) {
      node.removeAttribute("data-fresh");
      if (motionOff()) return;
      node.classList.add("is-collapsed");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { node.classList.remove("is-collapsed"); });
      });
    });
    justOpened = "";
  }

  function collapseThen(node, done) {
    if (!node || motionOff()) {
      done();
      return;
    }
    node.classList.add("is-collapsed");
    var finished = false;
    function finish(event) {
      if (finished) return;
      if (event && event.target !== node) return;
      finished = true;
      done();
    }
    node.addEventListener("transitionend", finish);
    setTimeout(function () { finish(); }, 280);
  }

  function toggle(id) {
    if (state.open.has(id)) {
      state.open.delete(id);
      if (state.editing === id) discardEdits();
      collapseThen(document.getElementById(panelDomId(id)), render);
      return;
    }
    state.open.add(id);
    justOpened = id;
    pendingScroll = panelDomId(id);
    render();
  }

  function applyCode(raw) {
    var typed = String(raw || "").trim();
    var code = typed.toLowerCase();
    state.codeDraft = typed;
    if (!code) {
      state.codeError = "Впишіть код.";
      render();
      return;
    }
    var scope = CODES[code];
    var unit = scope ? null : findUnitByCode(typed);
    var section = scope || unit ? null : findSectionKey(typed);
    if (!scope && !unit && !section) {
      state.codeError = "Такого коду на цьому пристрої немає.";
      render();
      return;
    }
    if (section) {
      state.scope = section.scope;
      state.openCode = section.code;
      state.holder = section.forWhom || "";
    } else if (unit) {
      state.scope = "all";
      state.openCode = unit.code;
      state.holder = unit.name;
    } else {
      state.scope = scope;
      state.openCode = code;
      if (code === "sluzhba") state.holder = "Служба";
      else if (scope === "all") state.holder = DATA.unit.name;
      else state.holder = "";
    }
    activateReport(state.openCode);
    state.codeError = "";
    state.codeDraft = "";
    state.profile = false;
    state.profilePane = "";
    state.unitNameDraft = "";
    state.unitError = "";
    state.statusEdit = "";
    state.machineStatusEdit = "";
    state.statusNameDraft = "";
    state.machineStatusNameDraft = "";
    state.statusPlus = true;
    state.machineStatusPlus = true;
    state.statusListOpen = false;
    state.machineStatusListOpen = false;
    state.confirm = null;
    state.draft = null;
    discardEdits();
    state.open.clear();
    save();
    render();
  }

  function newId(prefix) {
    return prefix + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  }

  function findPerson(id) {
    var found = null;
    function walk(node) {
      (node.people || []).some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
      if (!found) (node.children || []).forEach(walk);
    }
    walk(viewUnit());
    if (!found) {
      state.added.people.some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
    }
    return found;
  }

  function findMachine(id) {
    var found = null;
    viewMachines().some(function (item) {
      if (item.id === id) found = item;
      return !!found;
    });
    if (!found) {
      state.added.machines.some(function (item) {
        if (item.id === id) found = item;
        return !!found;
      });
    }
    return found;
  }

  function removalQuestion(kind, id) {
    if (kind === "duty") {
      var personDuty = dutyMap()[id];
      return "Видалити статус «" + (personDuty ? personDuty.label : "") + "»?";
    }
    if (kind === "machineDuty") {
      var gearDuty = machineDutyMap()[id];
      return "Видалити стан «" + (gearDuty ? gearDuty.label : "") + "»?";
    }
    if (kind === "person") {
      var personItem = findPerson(id);
      var who = personItem ? (personCallsign(personItem) || personName(personItem)) : "";
      return "В архів картку «" + who + "»?";
    }
    var machine = findMachine(id);
    var what = machine ? (machineName(machine) || machineBoard(machine)) : "";
    return "В архів машину «" + what + "»?";
  }

  function renderConfirmBox() {
    var box = el("div", { className: "confirm", attrs: { id: "confirm-ask", role: "dialog" } });
    var archive = state.confirm.kind === "person" || state.confirm.kind === "machine";
    box.append(el("p", { text: removalQuestion(state.confirm.kind, state.confirm.id) }));
    box.append(el("button", { className: "remove", text: archive ? "В архів" : "Видалити", attrs: { type: "button", "data-confirm-delete": "1" } }));
    box.append(el("button", { className: "remove", text: "Скасувати", attrs: { type: "button", "data-cancel-delete": "1" } }));
    return box;
  }

  function blankDraft(kind) {
    if (kind === "machine") {
      return {
        kind: "machine",
        id: "draft",
        name: "",
        type: "",
        board: "",
        unit: "",
        accounting: "official",
        duty: "in",
        mileage: null,
        hours: null,
        service: ""
      };
    }
    return {
      kind: "person",
      id: "draft",
      name: "",
      rank: "",
      callsign: "",
      unit: "",
      position: "",
      accounting: "official",
      duty: "in"
    };
  }

  function renderDraftOverlay() {
    var overlay = el("div", { className: "overlay", attrs: { id: "card-overlay", role: "dialog" } });
    var sheet = el("div", { className: "overlay-sheet" });
    sheet.append(el("div", { className: "pull-bar", attrs: { "aria-hidden": "true" } }));
    if (state.draft.kind === "machine") sheet.append(renderMachineCard(state.draft, true));
    else sheet.append(renderPersonCard(state.draft, true));
    overlay.append(sheet);
    return overlay;
  }

  function openDraft(kind) {
    if (!canDelete()) return;
    if (state.draft && state.draft.kind === kind) return;
    state.confirm = null;
    state.draft = blankDraft(kind);
    render();
  }

  function placeFromUnit(value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    var lower = raw.toLowerCase();
    var found = "";
    function walk(node, trail) {
      var next = trail.concat([node]);
      var path = next.map(function (item) { return item.name; }).join(" · ");
      if (node.people && (node.name === raw || path === raw || node.name.toLowerCase() === lower || path.toLowerCase() === lower)) found = node.id;
      (node.children || []).forEach(function (child) { walk(child, next); });
    }
    walk(viewUnit(), []);
    return found;
  }

  function typeFromLabel(value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    var lower = raw.toLowerCase();
    for (var i = 0; i < TYPES.length; i++) {
      if (TYPES[i].one === raw || TYPES[i].name === raw || TYPES[i].one.toLowerCase() === lower || TYPES[i].name.toLowerCase() === lower) return TYPES[i].id;
    }
    return "";
  }

  function addedPerson(id) {
    for (var i = 0; i < state.added.people.length; i++) {
      if (state.added.people[i].id === id) return state.added.people[i];
    }
    return null;
  }

  function addedMachine(id) {
    for (var i = 0; i < state.added.machines.length; i++) {
      if (state.added.machines[i].id === id) return state.added.machines[i];
    }
    return null;
  }

  function openUnitPath(placeId) {
    var path = findNode(viewUnit(), placeId, []);
    if (!path) return;
    path.forEach(function (node) {
      if (node.id !== viewUnit().id) state.open.add("unit:" + node.id);
    });
  }

  function applyDraftField(node) {
    if (!state.draft || !node || !node.getAttribute) return false;
    var field = node.getAttribute("data-draft-field");
    if (!field) return false;
    if (field === "mileage" || field === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) state.draft[field] = null;
      else {
        var num = parseInt(trimmed, 10);
        state.draft[field] = isNaN(num) ? null : num;
      }
    } else {
      state.draft[field] = String(rawControl(node) || "").slice(0, 80);
    }
    return true;
  }

  function syncDraftFromDom() {
    var root = document.getElementById("card-overlay");
    if (!root || !state.draft) return;
    root.querySelectorAll("[data-draft-field]").forEach(applyDraftField);
  }

  function saveDraft() {
    if (!canDelete() || !state.draft) return;
    syncDraftFromDom();
    var draft = state.draft;
    if (draft.kind === "person") {
      var place = placeFromUnit(draft.unit) || "s1";
      var personId = newId("np");
      state.added.people.push({
        id: personId,
        name: draft.name || "",
        rank: draft.rank || "",
        callsign: draft.callsign || "",
        accounting: draft.accounting || "official",
        duty: draft.duty || "in",
        position: draft.position || "",
        place: place
      });
      state.positions[personId] = draft.position || "";
      openUnitPath(place);
    } else {
      var typeId = typeFromLabel(draft.type) || "dump";
      var machineId = newId("nm");
      state.added.machines.push({
        id: machineId,
        type: typeId,
        name: draft.name || "",
        board: draft.board || "",
        accounting: draft.accounting || "official",
        duty: draft.duty || "in",
        mileage: draft.mileage == null ? null : draft.mileage,
        hours: draft.hours == null ? null : draft.hours,
        service: draft.service || ""
      });
      state.open.add("type:" + typeId);
    }
    state.draft = null;
    state.confirm = null;
    save();
    render();
  }

  function discardEdits() {
    state.editing = null;
    state.pending = null;
  }

  function discardDraft() {
    state.draft = null;
    state.confirm = null;
    discardEdits();
    render();
  }

  var FIELD_LABEL = {
    name: "ПІП",
    rank: "Звання",
    unit: "Підрозділ",
    callsign: "Позивний",
    position: "Посада",
    type: "Тип",
    board: "Борт",
    duty: "Стан",
    accounting: "Облік",
    mileage: "Пробіг",
    hours: "Мотогодини",
    service: "Останнє ТО"
  };

  function canJournal() {
    return state.scope === "all" && !!state.holder;
  }

  function plainValue(value) {
    if (value == null || value === "") return "немає";
    return String(value);
  }

  function sameValue(before, after) {
    return plainValue(before) === plainValue(after);
  }

  function currentFieldValue(kind, id, fieldName) {
    if (kind === "person") {
      var personItem = findPerson(id);
      if (!personItem) return "";
      if (fieldName === "name") return personName(personItem);
      if (fieldName === "rank") return personRank(personItem);
      if (fieldName === "unit") return personUnit(personItem);
      if (fieldName === "callsign") return personCallsign(personItem);
      if (fieldName === "position") return positionOf(personItem);
      if (fieldName === "duty") {
        var personDuty = dutyMap()[personDutyKey(personItem)];
        return personDuty ? personDuty.label : "";
      }
      if (fieldName === "accounting") {
        var personAccount = ACCOUNTING[personAccountingKey(personItem)];
        return personAccount ? personAccount.label : "";
      }
      return "";
    }
    var machine = findMachine(id);
    if (!machine) return "";
    if (fieldName === "name") return machineName(machine);
    if (fieldName === "type") return machineTypeLabel(machine);
    if (fieldName === "board") return machineBoard(machine);
    if (fieldName === "unit") return machineUnit(machine);
    if (fieldName === "duty") {
      var duty = machineDutyMap()[machineDutyKey(machine)];
      return duty ? duty.label : "";
    }
    if (fieldName === "accounting") {
      var account = ACCOUNTING[machineAccountingKey(machine)];
      return account ? account.label : "";
    }
    if (fieldName === "mileage") return machineMileage(machine);
    if (fieldName === "hours") return machineHours(machine);
    if (fieldName === "service") return machineService(machine) || "";
    return "";
  }

  function controlValue(node) {
    var fieldName = node.getAttribute("data-edit-field") || node.getAttribute("data-position-for") && "position";
    if (fieldName === "mileage" || fieldName === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) return null;
      var num = parseInt(trimmed, 10);
      return isNaN(num) ? null : num;
    }
    if (node.classList && node.classList.contains("pick")) {
      var shown = node.querySelector(".pick-current");
      return shown ? String(shown.textContent || "") : "";
    }
    if (node.tagName === "SELECT") {
      var option = node.options[node.selectedIndex];
      return option ? option.text : String(node.value || "");
    }
    return String(node.value || "").slice(0, 80);
  }

  function rawControl(node) {
    if (node && node.classList && node.classList.contains("pick")) return node.getAttribute("data-value") || "";
    return node && node.value != null ? node.value : "";
  }

  function noteChange(fieldName, before, after) {
    if (!canJournal() || sameValue(before, after)) return;
    var label = FIELD_LABEL[fieldName] || fieldName;
    state.changes.push({
      who: state.holder,
      field: label,
      before: plainValue(before).slice(0, 80),
      after: plainValue(after).slice(0, 80)
    });
    if (state.changes.length > 100) state.changes = state.changes.slice(-100);
  }

  function commitCard(spec) {
    var parts = String(spec || "").split(":");
    var kind = parts[0];
    var id = parts.slice(1).join(":");
    var root = document.getElementById(panelDomId(kind + ":" + id));
    if (root) {
      root.querySelectorAll("[data-edit-kind]").forEach(function (node) {
        noteChange(node.getAttribute("data-edit-field"), currentFieldValue(kind, id, node.getAttribute("data-edit-field")), controlValue(node));
        applyFieldEdit(node);
      });
      var post = root.querySelector("[data-position-for]");
      if (post) {
        noteChange("position", currentFieldValue("person", id, "position"), controlValue(post));
        state.positions[post.getAttribute("data-position-for")] = String(post.value || "").slice(0, 80);
      }
    }
    discardEdits();
    save();
    render();
  }

  function renderChanges() {
    if (state.scope !== "all") return null;
    var section = el("section", { className: "block", attrs: { id: "changes", "aria-labelledby": "changes-title" } });
    if (!state.changes.length) {
      section.append(el("p", { className: "changes-empty", attrs: { id: "changes-title" }, text: "Змін ще немає" }));
      return section;
    }
    section.append(el("h2", { text: "Що змінено", attrs: { id: "changes-title" } }));
    var list = el("ul", { className: "change-list" });
    state.changes.forEach(function (item) {
      list.append(el("li", { text: item.who + ". " + item.field + ". Було: " + item.before + ". Стало: " + item.after + "." }));
    });
    section.append(list);
    return section;
  }

  function rememberPending(node) {
    if (!node || !node.getAttribute) return false;
    var kind = node.getAttribute("data-edit-kind");
    var id = node.getAttribute("data-edit-id");
    var fieldName = node.getAttribute("data-edit-field");
    if (!kind && node.getAttribute("data-position-for")) {
      kind = "person";
      id = node.getAttribute("data-position-for");
      fieldName = "position";
    }
    if (!kind || !id || !fieldName) return false;
    if (state.editing !== kind + ":" + id) return false;
    if (!state.pending || state.pending.key !== state.editing) state.pending = { key: state.editing, fields: {} };
    state.pending.fields[fieldName] = rawControl(node);
    return true;
  }

  function saveDutyEdit(machine, id, rawName, plus) {
    if (!isService() || !id) return;
    var label = String(rawName || "").replace(/\s+/g, " ").trim().slice(0, 80);
    if (!label) return;
    var map = machine ? machineDutyMap() : dutyMap();
    var taken = Object.keys(map).some(function (key) {
      return key !== id && map[key].label.toLowerCase() === label.toLowerCase();
    });
    if (taken) return;
    var base = machine ? MACHINE_DUTY : DUTY;
    var custom = machine ? state.customMachineDuties : state.customDuties;
    if (base[id]) {
      var overrides = machine ? state.machineDutyOverrides : state.dutyOverrides;
      overrides[id] = { label: label, plus: !!plus };
    } else {
      custom.forEach(function (item) {
        if (item.id === id) {
          item.label = label;
          item.plus = !!plus;
        }
      });
    }
    if (machine) {
      state.machineStatusEdit = "";
      state.machineStatusNameDraft = "";
      state.machineStatusPlus = true;
    } else {
      state.statusEdit = "";
      state.statusNameDraft = "";
      state.statusPlus = true;
    }
    save();
    render();
  }

  function deleteDuty(kind, id) {
    if (!isService()) return;
    var machine = kind === "machineDuty";
    var custom = machine ? state.customMachineDuties : state.customDuties;
    var next = custom.filter(function (item) { return item.id !== id; });
    if (next.length !== custom.length) {
      if (machine) state.customMachineDuties = next;
      else state.customDuties = next;
    } else if (machine) state.machineDutyRemoved[id] = true;
    else state.dutyRemoved[id] = true;
    if (machine) {
      delete state.machineDutyOverrides[id];
      state.machineStatusEdit = "";
      state.machineStatusNameDraft = "";
      state.machineStatusPlus = true;
    } else {
      delete state.dutyOverrides[id];
      state.statusEdit = "";
      state.statusNameDraft = "";
      state.statusPlus = true;
    }
    state.confirm = null;
    save();
    render();
  }

  function confirmRemoval() {
    if (!state.confirm) return;
    if (state.confirm.kind === "duty" || state.confirm.kind === "machineDuty") {
      deleteDuty(state.confirm.kind, state.confirm.id);
      return;
    }
    if (!canDelete()) return;
    if (state.confirm.kind === "person") state.removed.people[state.confirm.id] = true;
    if (state.confirm.kind === "machine") state.removed.machines[state.confirm.id] = true;
    state.confirm = null;
    save();
    render();
  }

  function issueSectionKey(scope, rawWho) {
    if (state.scope !== "all") return;
    if (scope !== "people" && scope !== "equipment" && scope !== "tasks") return;
    var who = String(rawWho || "").replace(/\s+/g, " ").trim().slice(0, 40);
    state.sectionKeys.push({
      code: generateUnitCode(),
      scope: scope,
      unitKey: state.reportKey || "1rota",
      forWhom: who
    });
    state.sectionScopeDraft = scope;
    state.sectionForDraft = "";
    save();
    render();
  }

  function createUnit(raw) {
    if (!canBranch()) return;
    var name = String(raw || "").trim().slice(0, 80);
    state.unitNameDraft = name;
    if (!name) {
      state.unitError = "Впишіть назву.";
      render();
      return;
    }
    var created = {
      id: "u" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36),
      name: name,
      code: generateUnitCode(),
      parent: actorKey()
    };
    state.units.push(created);
    var doc = emptyUnitReport(created);
    bundles[created.code] = {
      edits: { people: {}, machines: {} },
      removed: { people: {}, machines: {} },
      added: { people: [], machines: [] },
      positions: {},
      changes: [],
      report: doc
    };
    state.unitNameDraft = "";
    state.unitError = "";
    offerReportFile(doc);
    save();
    render();
  }

  function applyFieldEdit(node) {
    if (!node || !node.getAttribute) return false;
    var kind = node.getAttribute("data-edit-kind");
    if (!kind) return false;
    var id = node.getAttribute("data-edit-id");
    var fieldName = node.getAttribute("data-edit-field");
    var bucket = kind === "machine" ? state.edits.machines : state.edits.people;
    if (!bucket[id]) bucket[id] = {};
    if (fieldName === "mileage" || fieldName === "hours") {
      var trimmed = String(node.value || "").replace(/\s/g, "");
      if (!trimmed) bucket[id][fieldName] = null;
      else {
        var num = parseInt(trimmed, 10);
        bucket[id][fieldName] = isNaN(num) ? null : num;
      }
    } else {
      bucket[id][fieldName] = String(rawControl(node) || "").slice(0, 80);
    }
    if (kind === "person" && fieldName === "unit") {
      var personItem = addedPerson(id);
      var place = personItem ? placeFromUnit(bucket[id].unit) : "";
      if (personItem && place) {
        personItem.place = place;
        openUnitPath(place);
      }
    }
    if (kind === "machine" && fieldName === "type") {
      var machineItem = addedMachine(id);
      var typeId = machineItem ? typeFromLabel(bucket[id].type) : "";
      if (machineItem && typeId) {
        machineItem.type = typeId;
        state.open.add("type:" + typeId);
      }
    }
    return true;
  }

  function onClick(event) {
    closeOpenLists(event.target);
    var pickChoice = event.target.closest("[data-pick-value]");
    if (pickChoice) {
      var picked = pickChoice.closest(".pick");
      if (picked) choosePick(picked, pickChoice.getAttribute("data-pick-value"));
      return;
    }
    var pickToggle = event.target.closest("[data-pick-toggle]");
    if (pickToggle) {
      togglePick(pickToggle.getAttribute("data-pick-toggle"));
      return;
    }
    if (blockToggleRow) {
      var swiped = blockToggleRow;
      blockToggleRow = null;
      if (swiped.contains(event.target) && !event.target.closest("[data-remove]")) return;
    }
    var discard = event.target.closest("[data-discard-draft]");
    if (discard) {
      discardDraft();
      return;
    }
    var saveCard = event.target.closest("[data-save-card]");
    if (saveCard) {
      if (saveCard.getAttribute("data-save-card") === "draft") saveDraft();
      else commitCard(saveCard.getAttribute("data-save-card"));
      return;
    }
    var editCard = event.target.closest("[data-edit-card]");
    if (editCard) {
      var editKey = editCard.getAttribute("data-edit-card");
      if (editKey && editKey !== "draft") {
        state.editing = editKey;
        if (!state.pending || state.pending.key !== editKey) state.pending = { key: editKey, fields: {} };
        render();
      }
      return;
    }
    var add = event.target.closest("[data-add]");
    if (add) {
      if (canDelete()) openDraft(add.getAttribute("data-add") === "machine" ? "machine" : "person");
      return;
    }
    if (event.target.id === "card-overlay") {
      discardDraft();
      return;
    }
    if (event.target.id === "profile-overlay") {
      closeProfile();
      return;
    }
    var openProfile = event.target.closest("[data-open-profile]");
    if (openProfile) {
      state.profile = true;
      state.profilePane = "";
      render();
      return;
    }
    var closeProfileBtn = event.target.closest("[data-close-profile]");
    if (closeProfileBtn) {
      closeProfile();
      return;
    }
    var profilePane = event.target.closest("[data-profile-pane]");
    if (profilePane) {
      var pane = profilePane.getAttribute("data-profile-pane");
      var openingPane = state.profilePane !== pane;
      var closingPane = state.profilePane;
      state.profilePane = openingPane ? pane : "";
      state.statusEdit = "";
      state.machineStatusEdit = "";
      state.statusNameDraft = "";
      state.machineStatusNameDraft = "";
      state.statusPlus = true;
      state.machineStatusPlus = true;
      if (state.confirm && (state.confirm.kind === "duty" || state.confirm.kind === "machineDuty")) state.confirm = null;
      if (!openingPane) {
        var closingId = closingPane === "people" ? "status-create" : closingPane === "gear" ? "machine-status-create" : "";
        collapseThen(closingId ? document.getElementById(closingId) : null, render);
        return;
      }
      justOpened = "profile:" + pane;
      render();
      return;
    }
    var chooseDuty = event.target.closest("[data-choose-duty]");
    if (chooseDuty) {
      if (!isService()) return;
      var chosen = chooseDuty.getAttribute("data-choose-duty");
      if (chosen === "new") {
        state.statusEdit = "";
        state.statusNameDraft = "";
        state.statusPlus = true;
      } else {
        var chosenDuty = dutyMap()[chosen];
        state.statusEdit = chosen;
        state.statusNameDraft = chosenDuty ? chosenDuty.label : "";
        state.statusPlus = chosenDuty ? !!chosenDuty.plus : true;
      }
      state.statusListOpen = false;
      if (state.confirm && state.confirm.kind === "duty") state.confirm = null;
      render();
      return;
    }
    var chooseMachineDuty = event.target.closest("[data-choose-machine-duty]");
    if (chooseMachineDuty) {
      if (!isService()) return;
      var chosenMachine = chooseMachineDuty.getAttribute("data-choose-machine-duty");
      if (chosenMachine === "new") {
        state.machineStatusEdit = "";
        state.machineStatusNameDraft = "";
        state.machineStatusPlus = true;
      } else {
        var chosenState = machineDutyMap()[chosenMachine];
        state.machineStatusEdit = chosenMachine;
        state.machineStatusNameDraft = chosenState ? chosenState.label : "";
        state.machineStatusPlus = chosenState ? !!chosenState.plus : true;
      }
      state.machineStatusListOpen = false;
      if (state.confirm && state.confirm.kind === "machineDuty") state.confirm = null;
      render();
      return;
    }
    var dropDuty = event.target.closest("[data-delete-duty]");
    if (dropDuty) {
      if (!isService()) return;
      var dutyId = dropDuty.getAttribute("data-delete-duty");
      if (state.confirm && state.confirm.kind === "duty" && state.confirm.id === dutyId) {
        state.confirm = null;
        render();
        return;
      }
      state.confirm = { kind: "duty", id: dutyId };
      render();
      return;
    }
    var dropMachineDuty = event.target.closest("[data-delete-machine-duty]");
    if (dropMachineDuty) {
      if (!isService()) return;
      var machineDutyId = dropMachineDuty.getAttribute("data-delete-machine-duty");
      if (state.confirm && state.confirm.kind === "machineDuty" && state.confirm.id === machineDutyId) {
        state.confirm = null;
        render();
        return;
      }
      state.confirm = { kind: "machineDuty", id: machineDutyId };
      render();
      return;
    }
    var copy = event.target.closest("[data-copy]");
    if (copy) {
      var value = copy.getAttribute("data-copy");
      var line = copy.parentElement.querySelector("[data-unit-code], [data-key-code]");
      if (line && window.getSelection && document.createRange) {
        var range = document.createRange();
        range.selectNodeContents(line);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).catch(function () {});
      }
      return;
    }
    var restore = event.target.closest("[data-restore]");
    if (restore) {
      if (!canBranch()) return;
      var restored = restore.getAttribute("data-restore").split(":");
      var restoredKind = restored[0];
      var restoredId = restored.slice(1).join(":");
      if (restoredKind === "person") delete state.removed.people[restoredId];
      if (restoredKind === "machine") delete state.removed.machines[restoredId];
      save();
      render();
      return;
    }
    var cancelDelete = event.target.closest("[data-cancel-delete]");
    if (cancelDelete) {
      state.confirm = null;
      render();
      return;
    }
    var confirmDelete = event.target.closest("[data-confirm-delete]");
    if (confirmDelete) {
      confirmRemoval();
      return;
    }
    var remove = event.target.closest("[data-remove]");
    if (remove) {
      if (canDelete()) {
        var parts = remove.getAttribute("data-remove").split(":");
        var kind = parts[0];
        var id = parts.slice(1).join(":");
        if (state.confirm && state.confirm.kind === kind && state.confirm.id === id) {
          state.confirm = null;
          render();
          return;
        }
        state.confirm = { kind: kind, id: id };
        state.open.add(kind + ":" + id);
        render();
      }
      return;
    }
    var use = event.target.closest("[data-use-code]");
    if (use) {
      applyCode(use.getAttribute("data-use-code"));
      return;
    }
    var toggleNode = event.target.closest("[data-toggle]");
    if (!toggleNode) return;
    toggle(toggleNode.getAttribute("data-toggle"));
  }

    check(!!statusList && statusList.tagName !== "SELECT" && !statusList.classList.contains("is-open") && document.getElementById("profile-overlay").contains(statusList) && !document.getElementById("main").contains(statusList), "список статусів згорнутий у профілі");
    check(!document.querySelector("[data-edit-duty]") && !document.querySelector("[data-delete-duty]"), "статуси не розкриті окремими кнопками");
    var countPick = document.getElementById("status-count");
    var countNext = document.querySelector("#status-form button[type='submit']");
    var profileSheet = document.querySelector("#profile-overlay .overlay-sheet");
    var countTop = countNext.offsetTop;
    var countH = profileSheet.scrollHeight;
    countPick.querySelector("[data-pick-toggle]").click();
    check(countPick.tagName !== "SELECT" && countNext.offsetTop === countTop && profileSheet.scrollHeight === countH && (layerPos(countPick.querySelector(".pick-list")) === "fixed" || layerPos(countPick.querySelector(".pick-list")) === "absolute"), "плюс і мінус поверх, без зсуву");
    countPick.querySelector("[data-pick-toggle]").click();
    var gearPane = document.querySelector("[data-profile-pane='gear']");
    var statusTop = gearPane.offsetTop;
    var statusH = profileSheet.scrollHeight;
    statusList.querySelector("[data-pick-toggle]").click();
    check(gearPane.offsetTop === statusTop && profileSheet.scrollHeight === statusH && (layerPos(statusList.querySelector(".pick-list")) === "fixed" || layerPos(statusList.querySelector(".pick-list")) === "absolute") && motionOn(statusList.querySelector(".pick-list")), "наявні статуси поверх, без зсуву");
    var firstDuty = statusList.querySelector("[data-choose-duty]");
    check(statusList.classList.contains("is-open") && firstDuty && firstDuty.getAttribute("data-choose-duty") === "new" && firstDuty.textContent === "Новий статус" && statusList.textContent.indexOf("Відпустка") !== -1, "перший пункт — новий статус");
    document.querySelector("[data-choose-duty='new']").click();
    check(document.getElementById("status-name").value === "" && !document.getElementById("status-list").classList.contains("is-open"), "новий статус очищує поле");
    document.querySelector("[data-profile-pane='gear']").click();
    var machineList = document.getElementById("machine-status-list");
    check(document.querySelectorAll("#machine-status-create input[type='text']").length === 1, "у редакторі станів одне поле");
    check(!!machineList && machineList.tagName !== "SELECT" && !machineList.classList.contains("is-open") && !document.getElementById("main").contains(machineList), "список станів згорнутий у профілі");
    machineList.querySelector("[data-pick-toggle]").click();
    var firstMachine = machineList.querySelector("[data-choose-machine-duty]");
    check(machineList.classList.contains("is-open") && firstMachine && firstMachine.getAttribute("data-choose-machine-duty") === "new" && firstMachine.textContent === "Новий стан" && machineList.textContent.indexOf("Ремонт") !== -1 && machineList.textContent.indexOf("У строю") !== -1 && !!machineList.querySelector("[data-choose-machine-duty='repair']"), "перший пункт — новий стан");
    document.querySelector("[data-profile-pane='people']").click();
    chooseStatus("leave");
    var dutyEditName = document.getElementById("status-name");
    var dutyEditCount = document.getElementById("status-count");
    check(dutyEditName && dutyEditName.value === "Відпустка" && dutyEditCount && dutyEditCount.tagName !== "SELECT" && dutyEditCount.getAttribute("data-value") === "minus" && document.querySelectorAll("#status-create input[type='text']").length === 1, "наявний статус заповнює те саме поле");
    dutyEditName.value = "Канікули";
    document.getElementById("status-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
    check(state.dutyOverrides.leave && state.dutyOverrides.leave.label === "Канікули" && state.dutyOverrides.leave.plus === false, "перейменування не змінює мінус");
    document.querySelector("[data-close-profile]").click();
    toggle("unit:v1");
    toggle("unit:s1");
    toggle("person:p6");
    var renamedDuty = document.getElementById("duty-p6");
    var renamedRow = document.querySelector("[data-toggle='person:p6']");
    check(renamedDuty && renamedDuty.tagName !== "SELECT" && renamedDuty.getAttribute("data-value") === "leave" && renamedDuty.querySelector(".pick-current").textContent === "Канікули", "картка показує нову назву");
    check(renamedRow && renamedRow.textContent.indexOf("Канікули") !== -1, "рядок показує нову назву");
    var fracRenamed = document.querySelector("#people .frac");
    check(fracRenamed && fracRenamed.getAttribute("data-plus") === "14" && fracRenamed.getAttribute("data-total") === "18", "мінус лишається поза чисельником");
    document.querySelector("[data-open-profile]").click();
    document.querySelector("[data-profile-pane='people']").click();
    chooseStatus("leave");
    document.querySelector("[data-delete-duty='leave']").click();
    check(document.getElementById("confirm-ask") && document.getElementById("confirm-ask").textContent.indexOf("Видалити") !== -1 && !!document.querySelector("[data-cancel-delete]"), "видалення статусу питає підтвердження");
    document.querySelector("[data-delete-duty='leave']").click();
    check(!document.getElementById("confirm-ask") && !state.dutyRemoved.leave, "другий раз скасовує видалення статусу");
    document.querySelector("[data-delete-duty='leave']").click();
    document.querySelector("[data-confirm-delete]").click();
    var clearedDuty = document.getElementById("duty-p6");
    var clearedRow = document.querySelector("[data-toggle='person:p6']");
    check(!!state.dutyRemoved.leave && clearedDuty && clearedDuty.tagName !== "SELECT" && clearedDuty.getAttribute("data-value") === "" && clearedDuty.querySelector(".pick-current").textContent === "", "після видалення поле стану порожнє");
    check(clearedRow && clearedRow.textContent.indexOf("Канікули") === -1 && clearedRow.textContent.indexOf("Відпустка") === -1 && clearedRow.textContent.indexOf("У строю") === -1, "рядок без підміненого статусу");
    var fracCleared = document.querySelector("#people .frac");
    check(fracCleared && fracCleared.getAttribute("data-plus") === "14" && fracCleared.getAttribute("data-total") === "18", "видалений мінус не входить у чисельник");
    chooseStatus("in");
    check(document.getElementById("status-name") && document.getElementById("status-name").value === "У строю", "після видалення те саме поле бере інший статус");
    document.querySelector("[data-delete-duty='in']").click();
    document.querySelector("[data-confirm-delete]").click();
    var fracDropped = document.querySelector("#people .frac");
    check(fracDropped && fracDropped.getAttribute("data-plus") === "0" && fracDropped.getAttribute("data-total") === "18", "видалений плюс виходить із чисельника");
    state.dutyRemoved = {};
    state.dutyOverrides = {};
    state.machineDutyRemoved = {};
    state.machineDutyOverrides = {};
    state.statusEdit = "";
    state.machineStatusEdit = "";
    state.confirm = null;
    save();
    applyCode("1rota");
    document.querySelector("[data-open-profile]").click();
    document.querySelector("[data-profile-pane='people']").click();
    document.querySelector("[data-profile-pane='gear']").click();
    check(!document.getElementById("status-name") && !document.getElementById("machine-status-name") && !document.querySelector("[data-choose-duty]") && !document.querySelector("[data-delete-duty]") && !document.querySelector("[data-choose-machine-duty]") && !document.querySelector("[data-delete-machine-duty]") && !document.querySelector("[data-edit-duty]") && !document.querySelector("[data-edit-machine-duty]"), "рота не править і не видаляє статуси");
    check(document.getElementById("profile-overlay").textContent.indexOf("Редагування статусів військовослужбовців") !== -1 && document.getElementById("profile-overlay").textContent.indexOf("Редагування станів ОВТ") !== -1, "рота бачить назви розділів");
    document.querySelector("[data-close-profile]").click();
    try {
      assertSeed();
    } catch (err) {
      check(false, "зразок лишається 14/18 і 7/8: " + err.message);
    }
    ["забезпечення", "підготовка", "проблеми", "запасна тека", "години здачі"].forEach(function (word) {
      check(document.getElementById("app").textContent.toLowerCase().indexOf(word) === -1, "немає розділу: " + word);
    });
    ["люди", "людина", "людини", "людей", "Людина", "Люди", "Показати людей", "Сховати людей", "Картка людини", "Кількість людей"].forEach(function (word) {
      check(document.getElementById("app").textContent.indexOf(word) === -1, "немає на екрані: " + word);
    });
    check(document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1, "без горизонтального прокручування");
    if (workWidths.length) {
      var sameWidth = workWidths[0];
      check(workWidths.every(function (n) { return n === sameWidth; }), "ширина вікна однакова в усіх станах");
    }
    var report = el("pre", { attrs: { id: "test-result" } });
    if (failures.length) {
      report.textContent = "FAIL\n" + failures.join("\n");
      document.title = "TEST FAIL";
    } else {
      report.textContent = "PASS";
      document.title = "TEST PASS";
    }
    document.body.append(report);
  }

  var gesture = null;
  var blockToggleRow = null;

  function eventElement(event) {
    return event.target && event.target.closest ? event.target : null;
  }

  function onPointerDown(event) {
    if (event.button != null && event.button !== 0) return;
    var target = eventElement(event);
    if (!target) return;
    closeOpenLists(target);
    var swipe = target.closest(".swipe-row");
    if (swipe && !target.closest(".swipe-delete")) {
      gesture = { type: "swipe", x: event.clientX, y: event.clientY, el: swipe, active: false };
      return;
    }
    var sheet = target.closest(".overlay-sheet");
    if (sheet && !target.closest("input, select, textarea, button, a, summary, .pick-list, .status-menu")) {
      gesture = { type: "pull", x: event.clientX, y: event.clientY, el: sheet, active: false };
    }
  }

  function onPointerMove(event) {
    if (!gesture) return;
    var dx = event.clientX - gesture.x;
    var dy = event.clientY - gesture.y;
    if (gesture.type === "swipe") {
      if (dx < -48 && Math.abs(dx) > Math.abs(dy) + 4) {
        gesture.el.classList.add("revealed");
        gesture.active = true;
      }
    } else if (dy > 12 && dy > Math.abs(dx)) {
      gesture.el.style.transform = "translateY(" + Math.min(dy, 160) + "px)";
      gesture.active = dy > 72;
    }
  }

  function onPointerUp() {
    if (!gesture) return;
    var current = gesture;
    gesture = null;
    if (current.type === "pull") {
      current.el.style.transform = "";
      if (current.active) {
        if (current.el.closest("#profile-overlay")) closeProfile();
        else if (state.draft) discardDraft();
        else {
          discardEdits();
          render();
        }
      }
    } else if (current.active) {
      blockToggleRow = current.el;
    }
  }

  function boot() {
    if (new URLSearchParams(location.search).get("test") === "1") document.documentElement.classList.add("is-test");
    var root = document.getElementById("app");
    try {
      assertSeed();
    } catch (err) {
      root.textContent = "Помилка в даних зразка: " + err.message;
      return;
    }
    installSample();
    indexPeople(viewUnit());
    load();
    root.addEventListener("click", onClick);
    root.addEventListener("submit", onSubmit);
    root.addEventListener("change", onChange);
    root.addEventListener("input", onInput);
    document.addEventListener("pointerdown", onPointerDown);
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("pointercancel", onPointerUp);
    document.addEventListener("scroll", placeOpenLists, true);
    window.addEventListener("resize", placeOpenLists);
    var params = new URLSearchParams(location.search);
    if (params.get("open")) {
      params.get("open").split(",").forEach(function (id) {
        if (id.trim()) state.open.add(id.trim());
      });
    }
    if (params.get("code")) applyCode(params.get("code"));
    else if (codeFromHash()) applyCode(codeFromHash());
    else render();
    if (params.get("test") === "1") runSelfTest();
  }

  var api = {
    assertSeed: assertSeed,
    peopleStats: peopleStats,
    machineStats: machineStats,
    DATA: DATA,
    plural: plural,
    emptyUnitReport: emptyUnitReport,
    sampleReportDocument: sampleReportDocument,
    reportFileName: reportFileName,
    writeReportProof: writeReportProof,
    SAMPLE_FILE: SAMPLE_FILE
  };

  if (typeof module !== "undefined" && module.exports) module.exports = api;
  if (typeof document !== "undefined") boot();
})();

  </script>
</body>
